# BPF verifier zero-extension bug (upstream 7ce090afbf72). Reachable on x86_64; needs root or CAP_BPF.
[[mitigation]]
id = "CVE-2026-98869"
package = "linux"
reason = "BPF verifier can miss a zero extension of a 32-bit result, so a register can hold upper bits the verifier does not expect. Reachable on x86_64 (one case is zero-extended by the verifier on every architecture); arm64's JIT zero-extends by itself. Loading a BPF program needs root or CAP_BPF (unprivileged BPF stays off, Debian default), so the effect is a local root reaching kernel memory despite lockdown. Unfixed in Debian forky/sid (7.2.12-1); bookworm and trixie do not contain the code. End: a Debian kernel with the fix (7.3 or a backport)."
expires = 2026-11-07
