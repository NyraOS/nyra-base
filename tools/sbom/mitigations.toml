# Kerberos: fixed upstream (krb5 1.22 branch), waiting for the Debian upload. End: a fixed krb5.

[[mitigation]]
id = "CVE-2026-107778"
package = "krb5"
reason = "Denial of service of GSS-API acceptor services (servers that take Kerberos authentication) by an authenticated client. The base image only has the krb5 client libraries, pulled in by libcurl and libtirpc; it runs no GSS-API acceptor (no sshd, Samba or NFS server, and the secure-defaults check allows no listening socket but resolved's local stub). Fixed upstream; waiting for the Debian upload."
expires = 2026-11-09

# Linux: fixed upstream, waiting for the Debian kernel upload. End: a fixed linux in our snapshot.

[[mitigation]]
id = "CVE-2026-98375"
package = "linux"
reason = "xen-netfront: RX packets with a short Ethernet header from the Xen network backend (XSA-522). Only reachable when the system runs as a Xen guest, and then only from the Xen backend, which already controls the guest's network. Fixed upstream (commit 089e58805c45); waiting for a Debian linux upload."
expires = 2026-11-08

# Linux kernel: long-standing issues with no upstream fix, carried by every distribution.

[[mitigation]]
id = "CVE-2019-19449"
package = "linux"
reason = "f2fs out-of-bounds read when mounting a crafted f2fs image. Mounting needs root and the base image has no automounter (no udisks2). Follow-up: block autoloading of unused filesystems."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2019-19814"
package = "linux"
reason = "f2fs out-of-bounds write when mounting a crafted f2fs image. Mounting needs root and the base image has no automounter (no udisks2). Follow-up: block autoloading of unused filesystems."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2021-3847"
package = "linux"
reason = "OverlayFS copy-up of file capabilities on setuid files; local attacker who can mount overlayfs. No upstream fix; Debian tracks it unfixed in every release."
