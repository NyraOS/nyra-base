# SPDX-License-Identifier: GPL-3.0-or-later
# Reviewed exceptions to the vulnerability gate (docs/SBOM.md). Each entry accepts one
# vulnerability in one package (Debian source package or Rust crate) until its expiry date,
# at most 90 days ahead. Say why the image is not exposed or what limits the damage, and
# what would end the exception (a fix in Debian, a snapshot bump).
#
# [[mitigation]]
# id = "CVE-2026-00000"
# package = "example"
# reason = "Only reachable through X, which the image does not ship or enable."
# expires = 2026-12-31

# Not in the image: the vulnerable code is in a package or file the image does not ship
# (checked in the snapshot's .deb contents and the image's /etc/pam.d, 2026-10-09).

[[mitigation]]
id = "CVE-2026-107161"
package = "cyrus-sasl2"
reason = "Heap overflow in the DIGEST-MD5 plugin. The plugin (libdigestmd5.so) is in libsasl2-modules, which is not in the image; libsasl2-2 and libsasl2-modules-db ship no DIGEST-MD5 code."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2026-82560"
package = "perl"
reason = "CPU/memory exhaustion in Pod::Text. Pod::Text is in perl-modules-5.42, which is not in the image; perl-base ships no Pod/Text.pm."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2026-85498"
package = "policykit-1"
reason = "Stack buffer underflow in read_cookie() of the polkit agent helper (polkit-agent-helper-1, package polkitd 128). The helper is not setuid in polkit 128: it runs as root only when started through polkit-agent-helper.socket, which the image disables (80-nyra.preset, docs/DEFAULTS.md), so no user can reach it; polkitd does not run it. Enable the socket only with the fixed version (upstream commit eea1729)."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2025-8941"
package = "pam"
reason = "Symlink/race in pam_namespace. No file in the image's /etc/pam.d (login, passwd, su, runuser, other...) or /usr/lib/pam.d loads pam_namespace.so, so the module never runs."
expires = 2027-01-07

# Waiting for a Debian fix: exploitable only with an attacker-controlled X server, a crafted
# file or a specific API use that nothing in the base image does. End: the fixed Debian version
# reaches our snapshot.

[[mitigation]]
id = "CVE-2026-88806"
package = "libx11"
reason = "Buffer overflow while handling replies from a malicious X server. The base image runs no X server and no X client sessions (libx11 is only a library dependency). Fixed upstream in libX11 1.8.14."
expires = 2026-11-08

[[mitigation]]
id = "CVE-2026-88807"
package = "libxrender"
reason = "Heap overflow while handling replies from a malicious X server. The base image runs no X server and no X client sessions (libxrender is only a library dependency). Fixed upstream in libXrender 0.9.13."
expires = 2026-11-08

[[mitigation]]
id = "CVE-2026-102010"
package = "gcc-16"
reason = "libstdc++ reallocation bug in erase_if on a binary-heap priority queue. Needs a program using that API on attacker-influenced data; no known component of the base image does. Waiting for a gcc-16 upload."
expires = 2026-11-08

[[mitigation]]
id = "CVE-2026-95619"
package = "gcc-16"
reason = "libstdc++ integer overflow in aligned operator new with huge sizes. Needs a program passing attacker-controlled sizes to aligned new; no known component of the base image does. Waiting for a gcc-16 upload."
expires = 2026-11-08

[[mitigation]]
id = "CVE-2026-85091"
package = "zlib"
reason = "Heap overflow in gz_vacate() when writing gzip files to a non-blocking descriptor. Needs a program using gzwrite on a non-blocking fd with attacker-influenced data; no known component of the base image does. Waiting for the Debian zlib upload."
expires = 2026-11-08

# libheif 1.23.6-1: the one advisory of 2026-10-05 that has no fix yet. In the image libheif (with
# only the dav1d and libde265 decoder plugins, no encoder plugin) has one user: glycin's HEIF/AVIF
# loader, pulled in by flatpak through gdk-pixbuf. In the base image that loader is reached only by
# glycin-thumbnailer, which runs only when a file manager or thumbnail service asks for a thumbnail
# (none is in the image), and by flatpak-validate-icon, which only `flatpak build-export` runs, on
# the builder's own files. Nothing in the base image decodes images from outside. A change that adds
# such a consumer must first end this exception (docs/SBOM.md). End: a fixed libheif.

[[mitigation]]
id = "TEMP-0000000-153207"
package = "libheif"
reason = "GHSA-vr5j-9r89-725x: excessive CPU time while decoding a crafted uncompressed (unci) image, left over from an earlier fix; CPU use only. Needs a crafted file decoded through libheif; nothing in the base image decodes untrusted images. No fix upstream or in Debian yet."
expires = 2026-11-08

# Kerberos: fixed upstream (krb5 1.22 branch), waiting for the Debian upload. End: a fixed krb5.

[[mitigation]]
id = "CVE-2026-107778"
package = "krb5"
reason = "Denial of service of GSS-API acceptor services (servers that take Kerberos authentication) by an authenticated client. The base image only has the krb5 client libraries, pulled in by libcurl and libtirpc; it runs no GSS-API acceptor (no sshd, Samba or NFS server, and the secure-defaults check allows no listening socket but resolved's local stub). Fixed upstream; waiting for the Debian upload."
expires = 2026-11-09

# Linux kernel: long-standing issues with no upstream fix, carried by every distribution.

[[mitigation]]
id = "CVE-2019-19449"
package = "linux"
reason = "f2fs out-of-bounds read when mounting a crafted f2fs image. f2fs is not autoloaded (/usr/lib/modprobe.d/nyra-filesystems.conf), so mounting one fails, through udisks2 too (which mounts only when a user asks); loading the module needs root."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2019-19814"
package = "linux"
reason = "f2fs out-of-bounds write when mounting a crafted f2fs image. f2fs is not autoloaded (/usr/lib/modprobe.d/nyra-filesystems.conf), so mounting one fails, through udisks2 too (which mounts only when a user asks); loading the module needs root."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2021-3847"
package = "linux"
reason = "OverlayFS copy-up of file capabilities on setuid files; local attacker who can mount overlayfs. No upstream fix; Debian tracks it unfixed in every release."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2021-3864"
package = "linux"
reason = "Dumpable flag of SUID descendants with a non-default core_pattern pipe handler; local attacker. No upstream fix; the image sets no core_pattern pipe handler of its own (systemd-coredump is not installed)."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2024-21803"
package = "linux"
reason = "Use-after-free in the Bluetooth modules; needs Bluetooth hardware and local access. The base image ships no Bluetooth stack (no bluez). No upstream fix identified by Debian."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2013-7445"
package = "linux"
reason = "DRM GEM objects can be used to consume memory (local denial of service, no score). Known upstream since 2015 without a fix; the impact is limited to memory exhaustion by a local user."
expires = 2027-01-07

# ntpd 1.9.0 (pinned) needs rustls-platform-verifier 0.5, which needs webpki-root-certs 0.26. That
# release has no roots of its own: it only re-exports webpki-root-certs 1.0.x, which ntpd-rs/Cargo.lock
# has at the fixed 1.0.10 (no 0.26 release is fixed, so the scanner still lists it).
[[mitigation]]
id = "RUSTSEC-2026-0383"
package = "webpki-root-certs"
reason = "Version 0.26.11 holds no certificates, it re-exports the roots of webpki-root-certs 1.0.10, where the distrusted emSign root is removed. End: ntpd with rustls-platform-verifier 0.6 (webpki-root-certs 1)."
expires = 2027-01-07
