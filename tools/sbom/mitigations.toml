[[mitigation]]
id = "TEMP-0000000-301DE5"
package = "libheif"
reason = "GHSA-q7mw-2fmm-5q94: out-of-bounds read in libsharpyuv when libheif converts 10/12-bit RGB to YCbCr 4:2:0 with sharp-YUV downsampling (the encoding side). The image's only libheif user decodes to RGB, and nothing in the base image encodes images. Fixed in Debian 1.23.6-1."
