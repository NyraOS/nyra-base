# brotli 1.2.0-4: fixed upstream in brotli 1.2.1, no Debian upload yet. Only libbrotli1 is in the
# image, pulled in by libcurl, FreeType, libheif and libjxl. Its decoder runs only when one of them
# is given brotli data: nyra-updated's curl does not ask for compressed responses, and nothing in
# the base image decodes untrusted fonts or images; Flatpak pulls only from a remote a user adds.
# Short expiry. End: a fixed brotli in Debian and a snapshot bump.

[[mitigation]]
id = "CVE-2026-111497"
package = "brotli"
reason = "Out-of-bounds write in the brotli decoder, fixed upstream in brotli 1.2.1; Debian has no fixed upload yet. Only libbrotli1 is in the image. The base image has no program that decodes brotli data from outside on its own: nyra-updated fetches the channel sheet with curl without asking for compressed responses, and no font or image from outside is decoded (see the libheif entry). Flatpak (libostree) does ask its server for compressed responses, but the image configures no remote and nothing pulls from one on its own; a user who adds one is exposed to that server until the fix."
expires = 2026-10-29

# expat 2.9.0-1: upstream has merged fixes, but there is no libexpat release and no Debian upload
# yet. libexpat1 is in the image through dbus-daemon, polkitd, fontconfig and python3.14-minimal. The
# only XML those parse on their own is root-owned configuration and policy files (dbus and polkit
# policy, fonts.conf); no program of the base image parses XML from outside. The installer ISO does
# not ship libexpat1 (checked in its SBOM), so tools/sbom/mitigations-iso*.toml need no entry. Short
# expiry. End: a fixed expat in Debian and a snapshot bump.

[[mitigation]]
id = "CVE-2026-113351"
package = "expat"
reason = "Denial of service when a parser is reset and reused. Only libexpat1 is in the image, used by dbus-daemon, polkitd, fontconfig and python3.14-minimal. They parse XML written by root (message bus configuration and service files, polkit action files, fonts.conf); the image has no program that parses XML from outside with Python or libexpat, and no network service. A user's own fontconfig file can only slow that user's own processes. Upstream has merged a fix; Debian has no fixed upload yet."
expires = 2026-10-30

[[mitigation]]
id = "CVE-2026-115506"
package = "expat"
reason = "Denial of service from the entity-expansion limit that triggers too late. Only libexpat1 is in the image, used by dbus-daemon, polkitd, fontconfig and python3.14-minimal. They parse XML written by root (message bus configuration and service files, polkit action files, fonts.conf); the image has no program that parses XML from outside with Python or libexpat, and no network service. A user's own fontconfig file can only slow that user's own processes. Upstream has merged a fix; Debian has no fixed upload yet."
expires = 2026-10-30

# harfbuzz 12.3.2-2: fixed upstream in HarfBuzz 15.0.0 (released 2026-10-22), no Debian upload yet.
# The flaw is in the experimental WebAssembly shaper, which Debian does not build: debian/rules
# configures meson with auto_features=enabled, but the `wasm` option is a feature option with a
# fixed default of disabled, and it needs libiwasm (WAMR), which is no build dependency and no
# package in Debian. Checked in the snapshot's libharfbuzz0b 12.3.2-2+b2: no wasm, iwasm or wamr
# string, no exported wasm symbol, no libiwasm in its NEEDED libraries (2026-10-23). Only
# libharfbuzz0b is in the image (through pango, used by librsvg2). The installer ISOs do not ship
# harfbuzz (checked in their SBOMs), so tools/sbom/mitigations-iso*.toml need no entry. Expiry
# allows for a Debian upload of 15.0.0 or a backported fix. End: a fixed harfbuzz in Debian and a
# snapshot bump.

[[mitigation]]
id = "CVE-2026-113679"
package = "harfbuzz"
reason = "Out-of-bounds write in HarfBuzz's experimental WebAssembly shaper, fixed upstream in 15.0.0; Debian has no fixed upload yet. Debian's build does not include that shaper: its wasm option stays disabled (it needs libiwasm, which Debian does not package), and libharfbuzz0b 12.3.2-2+b2 contains no wasm code and does not link a wasm runtime. The vulnerable code is therefore not in the image. It would matter only if a rebuilt harfbuzz enabled wasm."
expires = 2026-11-20

# wget 1.25.0-3: fixed upstream (commits 37a40fc, c2640fe, dd692d9), no Debian upload yet. wget is in
# the base image only for users who start it; nothing in the image runs it (no unit, timer or script).
# Checked in the snapshot's source and its amd64 and arm64 binaries (2026-10-24). Metalink is not
# built: the package does not build-depend on libmetalink and wget enables it only when found; the
# binaries list "-metalink" in their features, link no libmetalink and have no metalink option.
# convert_fname() (58471) runs for every file wget saves, but only an expanding --remote-encoding /
# --local-encoding pair triggers the bug. html_quote_string() (58472) is reached by the HTML index of
# an FTP directory and, through convert.c, by -k / --convert-links / --convert-file-only. A plain
# download reaches the index only through a server redirect to an ftp:// directory URL (wget follows
# redirects across schemes), and that path is closed only while htmlify is off. The image sets
# htmlify = off in /etc/wgetrc (docs/DEFAULTS.md). Still exposed: a user who switches htmlify back
# on (--htmlify, ~/.wgetrc, -e, --config), who skips the system rc (--no-config skips the system
# wgetrc entirely, SYSTEM_WGETRC points wget elsewhere) or replaces /etc/wgetrc, and anyone who runs
# -k on content from a hostile server. The installer ISOs do not ship wget (checked in
# their package lists), so tools/sbom/mitigations-iso*.toml need no entry. Expiry allows for a
# Debian upload. End: a fixed wget in Debian and a snapshot bump.

[[mitigation]]
id = "CVE-2026-58469"
package = "wget"
reason = "Heap buffer underread in clean_metalink_string(), fixed upstream in commit 37a40fc; Debian has no fixed upload yet. The function is part of wget's Metalink support, which Debian's wget 1.25.0-3 is built without: libmetalink is no build dependency, and the amd64 and arm64 binaries contain no Metalink code, link no libmetalink and have no Metalink option. The vulnerable code is therefore not in the image. It would matter only if a rebuilt wget enabled Metalink."
expires = 2026-11-20

[[mitigation]]
id = "CVE-2026-58471"
package = "wget"
reason = "Heap overflow in convert_fname() when the iconv output buffer for a file name is too small, fixed upstream in commit c2640fe; Debian has no fixed upload yet. The function runs for every file wget saves, but the faulty step needs a conversion that makes the name more than twice as long. By default wget converts UTF-8 to the locale's charset, which never does that (checked over the locale charsets of glibc: at most twice). It takes an expanding --remote-encoding or --local-encoding pair (or the same in a wgetrc) that the image does not set; a user who chooses one and downloads from a hostile server is exposed until the fix."
expires = 2026-11-20

[[mitigation]]
id = "CVE-2026-58472"
package = "wget"
reason = "Integer overflow and heap overflow in html_quote_string(), fixed upstream in commit dd692d9; Debian has no fixed upload yet. The size counter is a signed int, so one string that needs quoting and is hundreds of megabytes long is required. wget calls the function in two places: for link conversion (--convert-links, also -k, and --convert-file-only), and to build the HTML index of an FTP directory (`wget ftp://host/dir/`, with the server's file names). A plain HTTP or HTTPS `wget URL` reaches the FTP index only if the server redirects it to an ftp:// directory URL, which wget follows, and that path is closed only while htmlify is off. While /etc/wgetrc is the image's link, the image sets htmlify = off (docs/DEFAULTS.md). A user who runs -k on content from a hostile server, turns htmlify back on (--htmlify, ~/.wgetrc, -e, --config), skips the system rc (--no-config, SYSTEM_WGETRC) or replaces /etc/wgetrc is exposed until the fix."
expires = 2026-11-20

# libheif 1.23.6-1: the one advisory of 2026-10-05 that has no fix yet. In the image libheif (with
# only the dav1d and libde265 decoder plugins, no encoder plugin) has one user: glycin's HEIF/AVIF
# loader, pulled in by flatpak through gdk-pixbuf. In the base image that loader is reached only by
# glycin-thumbnailer, which runs only when a file manager or thumbnail service asks for a thumbnail
# (none is in the image), and by flatpak-validate-icon, which only `flatpak build-export` runs, on
# the builder's own files. Nothing in the base image decodes images from outside. A change that adds
# such a consumer must first end this exception (docs/SBOM.md). End: a fixed libheif.

[[mitigation]]
id = "TEMP-0000000-153207"
package = "libheif"
reason = "GHSA-vr5j-9r89-725x: excessive CPU time while decoding a crafted uncompressed (unci) image, left over from an earlier fix; CPU use only. Needs a crafted file decoded through libheif; nothing in the base image decodes untrusted images. No fix upstream or in Debian yet."
expires = 2026-11-08

# Kerberos: fixed upstream (krb5 1.22 branch), waiting for the Debian upload. End: a fixed krb5.

[[mitigation]]
id = "CVE-2026-107778"
