# GnuTLS 3.8.13: certificate validation issues published 2026-10-09, no fix in Debian yet. Reachable
# only by the few programs that link GnuTLS, none of which runs by itself. End: a fixed gnutls28.

[[mitigation]]
id = "CVE-2026-67693"
package = "gnutls28"
reason = "End-entity X.509 certificates with a contradictory Key Usage and Extended Key Usage are not rejected. In the image GnuTLS is only used through libcurl-gnutls (by tpm2-tools and libappstream5) and dirmngr; the image's network clients (systemd-resolved, flatpak, OSTree, podman, skopeo, bootc) use OpenSSL or Go/Rust TLS, and nothing in the base image runs a GnuTLS client by itself. Debian lists it unfixed; end: a fixed gnutls28 in our snapshot."
expires = 2026-11-08

[[mitigation]]
id = "CVE-2026-88647"
package = "gnutls28"
reason = "Hostname verification bypass through the Common Name fallback with a crafted certificate. In the image GnuTLS is only used through libcurl-gnutls (by tpm2-tools and libappstream5) and dirmngr; the image's network clients (systemd-resolved, flatpak, OSTree, podman, skopeo, bootc) use OpenSSL or Go/Rust TLS, and nothing in the base image runs a GnuTLS client by itself. Debian lists it unfixed; end: a fixed gnutls28 in our snapshot."
expires = 2026-11-08

