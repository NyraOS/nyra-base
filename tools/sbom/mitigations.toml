# libheif 1.23.4: advisories published upstream on 2026-10-05; Debian fixed all but one in
# 1.23.6-1 (2026-10-11). In the image libheif (with only the dav1d and libde265 decoder plugins, no
# encoder plugin) has one user: glycin's HEIF/AVIF loader, pulled in by flatpak through gdk-pixbuf.
# In the base image that loader is reached only by glycin-thumbnailer, which runs only when a file
# manager or thumbnail service asks for a thumbnail (none is in the image), and by
# flatpak-validate-icon, which only `flatpak build-export` runs, on the builder's own files.
# Nothing in the base image decodes or encodes images from outside. End: a snapshot with libheif
# 1.23.6-1; until then a short expiry for the fixed issues (docs/SBOM.md).

[[mitigation]]
id = "TEMP-0000000-153207"
package = "libheif"
reason = "GHSA-vr5j-9r89-725x: excessive CPU time while decoding a crafted uncompressed (unci) image, left over from an earlier fix; CPU use only. Needs a crafted file decoded through libheif; nothing in the base image decodes untrusted images. No fix upstream or in Debian yet."
expires = 2026-11-08

[[mitigation]]
id = "TEMP-0000000-1B5D39"
package = "libheif"
reason = "GHSA-h4h8-qgvc-m7r2: multi-gigabyte allocations from a crafted JPEG 2000 codestream in the OpenJPEG decoder plugin. That plugin (libheif-plugin-j2kdec) is not in the image. Fixed in Debian 1.23.6-1."
