# Linux: fixed upstream, waiting for the Debian kernel upload. End: a fixed linux in our snapshot.

[[mitigation]]
id = "CVE-2026-98375"
package = "linux"
reason = "xen-netfront: RX packets with a short Ethernet header from the Xen network backend (XSA-522). Only reachable when the system runs as a Xen guest, and then only from the Xen backend, which already controls the guest's network. Fixed upstream (commit 089e58805c45); waiting for a Debian linux upload."
expires = 2026-11-08

# Linux kernel: long-standing issues with no upstream fix, carried by every distribution.

[[mitigation]]
id = "CVE-2019-19449"
package = "linux"
reason = "f2fs out-of-bounds read when mounting a crafted f2fs image. Mounting needs root and the base image has no automounter (no udisks2). Follow-up: block autoloading of unused filesystems."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2019-19814"
package = "linux"
reason = "f2fs out-of-bounds write when mounting a crafted f2fs image. Mounting needs root and the base image has no automounter (no udisks2). Follow-up: block autoloading of unused filesystems."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2021-3847"
package = "linux"
reason = "OverlayFS copy-up of file capabilities on setuid files; local attacker who can mount overlayfs. No upstream fix; Debian tracks it unfixed in every release."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2021-3864"
package = "linux"
reason = "Dumpable flag of SUID descendants with a non-default core_pattern pipe handler; local attacker. No upstream fix; the image sets no core_pattern pipe handler of its own (systemd-coredump is not installed)."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2024-21803"
package = "linux"
reason = "Use-after-free in the Bluetooth modules; needs Bluetooth hardware and local access. The base image ships no Bluetooth stack (no bluez). No upstream fix identified by Debian."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2013-7445"
package = "linux"
reason = "DRM GEM objects can be used to consume memory (local denial of service, no score). Known upstream since 2015 without a fix; the impact is limited to memory exhaustion by a local user."
expires = 2027-01-07

# Critical with a fix upstream but not in Debian yet: bridge only.

[[mitigation]]
id = "CVE-2026-94603"
package = "podman"
reason = "podman run of a checkpoint image from a registry ignores user sandboxing (GHSA-2cvf-wqm6-wr9g, fixed upstream in 5.8.8). No image is delivered to users yet (signing stays off until main is protected, docs/SIGNING.md); shipping a fixed podman before any user image is tracked by the maintainers."
