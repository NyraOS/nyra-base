# SPDX-License-Identifier: GPL-3.0-or-later
# Reviewed exceptions to the vulnerability gate (docs/SBOM.md). Each entry accepts one
# vulnerability in one package (Debian source package or Rust crate) until its expiry date,
# at most 90 days ahead. Say why the image is not exposed or what limits the damage, and
# what would end the exception (a fix in Debian, a snapshot bump).
#
# [[mitigation]]
# id = "CVE-2026-00000"
# package = "example"
# reason = "Only reachable through X, which the image does not ship or enable."
# expires = 2026-12-31

# Not in the image: the vulnerable code is in a package or file the image does not ship
# (checked in the snapshot's .deb contents and the image's /etc/pam.d, 2026-10-09).

[[mitigation]]
id = "CVE-2026-82560"
package = "perl"
reason = "CPU/memory exhaustion in Pod::Text. Pod::Text is in perl-modules-5.42, which is not in the image; perl-base ships no Pod/Text.pm."
expires = 2027-01-07

[[mitigation]]
id = "CVE-2026-85498"
package = "policykit-1"
reason = "Fixed in the image, still listed by the Debian tracker. The stack buffer underflow is in read_cookie() of the polkit agent helper (polkit-agent-helper-1, package polkitd); the tracker lists policykit-1 128-1 as unfixed, but polkit 128 contains the fix (upstream commit eea1729, in the 128 release notes), the source of 128-1 from the snapshot has it, and so has the helper binary. sbom.py fails the build if the manifest lists polkitd older than 128-1, and the Containerfile if the helper is setuid (the socket polkit-agent-helper.socket is enabled, docs/DEFAULTS.md). Ends when the tracker marks 128-1 as fixed."
expires = 2026-12-20

[[mitigation]]
id = "CVE-2025-8941"
package = "pam"
reason = "Symlink/race in pam_namespace. No file in the image's /etc/pam.d (login, passwd, su, runuser, other...) or /usr/lib/pam.d loads pam_namespace.so, so the module never runs."
expires = 2027-01-07

