# Tuning for swap that lives in compressed memory (docs/DEFAULTS.md, "Running out of memory"):
# swapping to zram is far cheaper than dropping the file cache and reading it back from the disk,
# so the kernel may prefer it (above 100 is allowed since Linux 5.8), and pages are swapped one at a
# time because there is no disk seek to amortise.
vm.swappiness = 180
vm.page-cluster = 0
