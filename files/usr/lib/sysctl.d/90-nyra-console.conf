# Only kernel errors and worse reach the console (tty1, a serial console), the threshold of the
# `quiet` kernel argument, without changing the sealed command line (docs/DEFAULTS.md, "Kernel
# messages on the console"). Without an audit daemon the kernel prints every audit record (BPF
# program loads, unit starts) at "notice" level, and the summary of its rate limit ("kauditd_printk_skb:
# N callbacks suppressed") at "warning", over the login prompt and the user's commands. Nothing is
# lost: the journal keeps every kernel message (journalctl -k) and every audit record
# (journalctl _TRANSPORT=audit). A kernel oops or panic raises the threshold by itself. Applied in
# the initrd too (dracut copies /usr/lib/sysctl.d), so kernel messages stay off the disk's
# passphrase prompt. The fields: console, default message, minimum console, default console level.
kernel.printk = 4 4 1 7
