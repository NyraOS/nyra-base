# Swap in compressed memory (docs/DEFAULTS.md, "Running out of memory"): half of the RAM, at most
# 4 GiB, compressed with zstd. The package's own default is the same size with the kernel's
# default algorithm; it is named here so the choice does not depend on the kernel. Memory that no
# program is using right now is squeezed instead of the machine stalling on the disk, and the
# priority is above any swap on a disk.
[zram0]
compression-algorithm = zstd
swap-priority = 100
