# Nyra: the socket is mode 0666 and each connection starts a root helper (docs/DEFAULTS.md,
# "Passwords through polkit"). systemd allows 64 connections at once; without a limit per source one
# user could hold them all and no one else could approve anything. For a unix socket the source is
# the peer's user. A person has one authentication dialog at a time, so 4 leaves room for a few
# agents, and 16 users together are needed to fill the 64.
[Socket]
MaxConnectionsPerSource=4
