# The ESP at /boot (systemd-gpt-auto-generator), mounted at every boot (local-fs.target.d) and
# read-only: nothing that walks the file system as root, such as rm -rf /, can change the boot files.
# What writes there (esp-sync, systemd-bless-boot, systemd-boot-random-seed) runs through esp-writable,
# which makes it writable in a mount namespace of its own; bootc does the same by itself
# (docs/BOOT.md). The generator's options, with ro instead of rw, plus dirsync: on FAT, directory
# changes otherwise reach the disk in any order, and a power cut can leave a new directory
# (loader/entries.staged) whose own cluster was never written. The first mount sets dirsync for
# every later one.
[Mount]
Options=fmask=0177,dmask=0077,ro,nodev,nosuid,noexec,nosymfollow,dirsync
