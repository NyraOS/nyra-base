# The ESP at /boot (systemd-gpt-auto-generator): the generator's options plus dirsync. On FAT,
# directory changes otherwise reach the disk in any order, and a power cut can leave a new
# directory (loader/entries.staged) whose own cluster was never written (docs/BOOT.md).
[Mount]
Options=fmask=0177,dmask=0077,rw,nodev,nosuid,noexec,nosymfollow,dirsync
