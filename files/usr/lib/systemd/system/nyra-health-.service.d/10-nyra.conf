# Every nyra-health-*.service: a health check that boot-complete.target requires (docs/UPDATES.md).
# A failure keeps the boot from being blessed and, while the version is on trial, reboots so boot
# counting can fall back. The checks finish before anyone can log in (systemd-user-sessions), so an
# unprivileged user cannot make one fail and force reboots or mark a good version failed.
[Unit]
Before=boot-complete.target systemd-user-sessions.service
OnFailure=nyra-updated-health-failed.service

[Service]
Type=oneshot
RemainAfterExit=yes
NoNewPrivileges=yes
ProtectSystem=full
ProtectHome=tmpfs
PrivateTmp=yes
PrivateNetwork=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_NETLINK
