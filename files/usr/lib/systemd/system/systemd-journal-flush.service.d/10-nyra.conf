# Stop this unit (journalctl --smart-relinquish-var: journald moves to /run) before /var is
# unmounted at shutdown. RequiresMountsFor=/var/log/journal adds Requires=var.mount only when the
# mount has a unit file; bootc's /var is a bind mount set up in the initrd, with no unit file, so
# only the ordering was left: nothing stopped this unit, journald kept its files in /var open, and
# every shutdown ended with "Failed unmounting var.mount".
[Unit]
Requires=var.mount
