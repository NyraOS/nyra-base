# Nyra: the boot's tmpfiles run after /tmp is mounted, not only after local-fs.target: when a mount
# from /etc/fstab fails at once, local-fs.target fails at once too and no longer waits for tmp.mount
# (docs/BOOT.md, "Mounts from /etc/fstab"). Ordering only: tmp.mount stays wanted, as before.
[Unit]
After=tmp.mount
