# Nyra: no blessing after a soft reboot (docs/UPDATES.md). The boot loader entry systemd-boot started
# belongs to the full boot before it, and bootc may have renamed it since: blessing it would confirm
# a version that did not just pass its health checks, or fail and leave the system degraded. A
# health check that fails after a soft reboot makes nyra-updated reboot fully, so boot counting
# decides.
[Service]
ExecCondition=/bin/sh -c 'test "$(systemctl show --property=SoftRebootsCount --value)" = 0'
