# Nyra: the ESP is read-only at /boot; blessing renames the boot entry there, where esp-writable makes
# it writable, in a mount namespace of its own (docs/BOOT.md). "systemd-bless-boot status" only reads.
[Service]
ExecStart=
ExecStart=/usr/lib/nyra/boot/esp-writable /usr/lib/systemd/systemd-bless-boot good
