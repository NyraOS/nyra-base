# After nyra-health-.service.d/10-nyra.conf (drop-ins apply in file name order): networkctl lists the
# links of the network namespace it runs in, and this check needs the machine's. It still opens no
# network socket: RestrictAddressFamilies= stays AF_UNIX and AF_NETLINK.
[Service]
PrivateNetwork=no
