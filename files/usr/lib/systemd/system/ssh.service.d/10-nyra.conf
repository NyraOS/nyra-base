# Nyra: SSH is off in the base (docs/DEFAULTS.md, "SSH"); a layer that offers it creates
# /usr/lib/nyra/allow-ssh. The image has no host keys: sshd-keygen.service makes them first.
[Unit]
ConditionPathExists=/usr/lib/nyra/allow-ssh
Wants=sshd-keygen.service
After=sshd-keygen.service
