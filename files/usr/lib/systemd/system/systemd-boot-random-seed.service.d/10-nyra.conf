# Nyra: the ESP is read-only at /boot; the boot loader's random seed is written where esp-writable
# makes it writable, in a mount namespace of its own (docs/BOOT.md).
[Service]
ExecStart=
ExecStart=/usr/lib/nyra/boot/esp-writable /usr/bin/bootctl --graceful random-seed
