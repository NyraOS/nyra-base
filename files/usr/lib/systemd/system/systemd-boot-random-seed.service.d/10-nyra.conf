# Nyra: the ESP is read-only at /boot; the boot loader's random seed is written where esp-writable
# makes it writable, in a mount namespace of its own (docs/BOOT.md).
# After boot.mount (which comes after the ESP's file system check), not only after local-fs.target:
# when a mount from /etc/fstab fails at once, local-fs.target fails at once too and no longer waits
# for the ESP (docs/BOOT.md, "Mounts from /etc/fstab"). Otherwise esp-writable could mount the ESP
# read-write during its check, and boot.mount then fail.
[Unit]
After=boot.mount

[Service]
ExecStart=
ExecStart=/usr/lib/nyra/boot/esp-writable /usr/bin/bootctl --graceful random-seed
