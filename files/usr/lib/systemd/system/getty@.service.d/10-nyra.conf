# Hang up the console when the login session is stopped, before the kill signal. An interactive bash
# that gets its SIGHUP while readline sets up the terminal (tcsetattr waits for the console output
# to drain, which takes long while shutdown messages go to the same console) records the signal and
# then waits for input anyway; systemd kills it only after the stop timeout, 90 s later
# (docs/LESSONS.md). A hangup is a state, not an event: once the TTY is hung up, every read returns
# end of file and the shell exits. systemd hangs up the unit's TTY (TTYVHangup=yes in the unit)
# before it runs any of the unit's commands, so a no-op ExecStop= does it when the stop begins.
[Service]
ExecStop=-/usr/bin/true
