# Nyra, in the initramfs: after three wrong passphrases systemd-cryptsetup gives up; ask again
# instead, as long as it takes (docs/BOOT.md, "Disk encryption").
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=1
# gpt-auto asks systemd-cryptsetup to measure the volume key into PCR 15 and the key slot into an
# NvPCR, which it does through systemd-pcrextend's socket, blocked in the image: turned off, so no boot
# logs "Could not extend PCR/NvPCR". The unlock path is unchanged (docs/BOOT.md, "PCR 15, not measured").
Environment=SYSTEMD_FORCE_MEASURE=0
