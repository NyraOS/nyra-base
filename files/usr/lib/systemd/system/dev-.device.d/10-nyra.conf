# Nyra: the running system waits 10 s, not 90 s, for a device that is not there, such as a disk in
# /etc/fstab that is not connected; the mount is then left out and the boot goes on (docs/BOOT.md,
# "Mounts from /etc/fstab"). Every /dev/... device unit; the root and /usr are mounted in the
# initramfs, which does not get this drop-in. An fstab line's x-systemd.device-timeout= still wins
# (systemd-fstab-generator's own drop-in, 50-device-timeout.conf, comes after this one).
[Unit]
JobRunningTimeoutSec=10s
