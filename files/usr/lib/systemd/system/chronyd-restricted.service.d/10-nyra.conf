# Nyra: chronyd with the configuration in /usr (docs/DEFAULTS.md, "Time") and its seccomp filter
# whatever /etc/default/chrony says. Options from there still apply after these (a -f there replaces
# our configuration).
[Service]
ExecStart=
ExecStart=/usr/sbin/chronyd -n -U -F 1 -f /usr/lib/nyra/chrony/chrony.conf $DAEMON_OPTS
