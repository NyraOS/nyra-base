# Nyra: chronyd with the configuration in /usr (docs/DEFAULTS.md, "Time"). Options from
# /etc/default/chrony still apply after it (a -f there replaces ours).
[Service]
ExecStart=
ExecStart=/usr/sbin/chronyd -n -U -f /usr/lib/nyra/chrony/chrony.conf $DAEMON_OPTS
