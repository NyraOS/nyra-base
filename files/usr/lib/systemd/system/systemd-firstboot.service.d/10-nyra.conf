# A boot with /etc emptied counts as a first boot (docs/BOOT.md, "No first-boot questions").
# Reset settings: no first-boot questions before the reset's own (a time zone, without credentials);
# the reset puts the image's /etc back.
[Unit]
ConditionKernelCommandLine=!systemd.unit=nyra-reset-settings.target

# Every boot: never ask for a root password, so whoever is at the console cannot set one; root
# stays locked. systemd's own command line (262) without --prompt-root-password.
[Service]
ExecStart=
ExecStart=systemd-firstboot --prompt-locale --prompt-keymap-auto --prompt-timezone --mute-console=yes
