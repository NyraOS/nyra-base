# Reset settings (docs/BOOT.md): no first-boot questions before the reset's own. A boot with /etc
# emptied counts as a first boot, and systemd-firstboot would ask for a root password (root stays
# locked in Nyra) and a time zone before the reset question; the reset puts the image's /etc back.
[Unit]
ConditionKernelCommandLine=!systemd.unit=nyra-reset-settings.target
