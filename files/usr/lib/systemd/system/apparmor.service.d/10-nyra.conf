# AppArmor at every boot (docs/DEFAULTS.md), also with the root file system full. Debian's script runs
# apparmor_parser --write-cache; when the parser cannot set up its cache in /var/cache/apparmor for
# lack of space (no cache yet, for example when the first boot loaded the profiles before /var/cache
# existed), it exits without loading any profile. Load them again without the cache then. A profile
# that does not load still fails the unit, and so does a boot that ends with no profile loaded.
# Without /etc/apparmor.d (an emptied /etc, before Reset settings brings it back), the image's
# profiles load from their copy in /usr/lib/nyra/apparmor.d (Containerfile).
[Service]
ExecStart=
ExecStart=/bin/sh -c 'if [ -d /etc/apparmor.d ]; then /usr/lib/apparmor/apparmor.systemd reload || { echo "Loading the AppArmor profiles again, without the cache"; /usr/sbin/apparmor_parser --skip-cache --replace -- /etc/apparmor.d; }; else echo "No /etc/apparmor.d: loading the profiles of the image from /usr/lib/nyra/apparmor.d"; /usr/sbin/apparmor_parser --skip-cache --replace --base /usr/lib/nyra/apparmor.d -- /usr/lib/nyra/apparmor.d; fi'
ExecStartPost=/bin/sh -c 'grep -q . /sys/kernel/security/apparmor/profiles || { echo "No AppArmor profile loaded"; exit 1; }'
