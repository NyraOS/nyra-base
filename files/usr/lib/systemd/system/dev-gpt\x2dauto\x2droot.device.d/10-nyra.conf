# Nyra, in the initramfs: the root may be behind the disk's passphrase prompt, and typing a recovery
# key can take longer than systemd's 90 s for a device (docs/BOOT.md, "Disk encryption"). A root that
# never appears still ends in emergency mode after 90 s, through nyra-root-wait.service.
[Unit]
JobRunningTimeoutSec=infinity
