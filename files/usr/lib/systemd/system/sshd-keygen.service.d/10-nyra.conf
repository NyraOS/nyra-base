# Nyra: SSH is off in the base (docs/DEFAULTS.md, "SSH"); a layer that offers it creates
# /usr/lib/nyra/allow-ssh. The host keys are made on the machine (ssh-keygen -A: only the missing
# ones) before sshd starts, on any boot: SSH can be turned on long after the first one. The empty
# ConditionFirstBoot= drops Debian's conditions; its other two follow again.
[Unit]
ConditionFirstBoot=
ConditionPathExists=/usr/lib/nyra/allow-ssh
ConditionPathIsReadWrite=/etc/ssh
ConditionPathIsSymbolicLink=!/etc/ssh
