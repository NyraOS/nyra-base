# Nyra: at shutdown, /run/user/UID is unmounted after the user's manager and this unit have stopped
# (this unit's stop unmounts it itself). Without an order between them, systemd's own unmount of
# run-user-UID.mount could run while the user's manager still had files open there: "Failed
# unmounting run-user-0.mount" once in CI, after logind sessions came with polkitd (docs/LESSONS.md).
[Unit]
After=run-user-%i.mount
