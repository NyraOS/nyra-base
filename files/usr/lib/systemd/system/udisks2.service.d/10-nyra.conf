# Nyra: udisks2 runs as root without a sandbox upstream (docs/DEFAULTS.md, "Removable media"). It
# keeps what it needs (root, its capabilities, /dev, D-Bus, udev's netlink socket, the system's mount
# namespace: its mounts must be the system's, so no ProtectSystem=, ProtectHome=, PrivateTmp= or
# other option that gives it a mount namespace of its own), and loses the rest. Titanic T14
# (tools/vm/removable-media.sh) mounts, unmounts and pulls sticks out with it.
[Service]
NoNewPrivileges=yes
RestrictAddressFamilies=AF_UNIX AF_NETLINK
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
