# Nyra: chronyd's configuration (docs/DEFAULTS.md, "Time"), passed with -f by a drop-in of
# chronyd-restricted.service. Debian's /etc/chrony/chrony.conf (an unauthenticated pool and servers
# from DHCP) is not read.

# Authenticated time only: NTS servers of two operators, no unauthenticated NTP and no servers from
# DHCP. The clock is updated only when both are reachable and agree.
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
minsources 2

# A clock outside the servers' certificate validity (a wrong hardware clock, an empty RTC battery)
# could never be corrected through NTS: until the first clock update, the certificates' dates are
# not checked (the chain to a trusted CA and the server name still are). docs/DEFAULTS.md weighs it.
nocerttimecheck 1

# NTS cookies and the clock's drift kept across restarts.
ntsdumpdir /var/lib/chrony
driftfile /var/lib/chrony/chrony.drift

# As in Debian's configuration: step the clock in the first three updates if it is off by more than
# a second, slew it afterwards; the kernel copies it to the hardware clock every 11 minutes.
makestep 1 3
rtcsync
maxupdateskew 100.0
leapseclist /usr/share/zoneinfo/leap-seconds.list

# chronyc talks to chronyd as root over the Unix socket in /run/chrony. No command port on UDP 323:
# the restricted service cannot bind it, and nothing needs it.
cmdport 0

# Local changes: more sources in /etc/chrony/sources.d/*.sources, other directives (they override
# the ones above) in /etc/chrony/conf.d/*.conf.
sourcedir /etc/chrony/sources.d
confdir /etc/chrony/conf.d
