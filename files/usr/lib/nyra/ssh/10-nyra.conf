# Nyra: the SSH server's settings (docs/DEFAULTS.md, "SSH"), linked from /etc/ssh/sshd_config.d. For
# each setting sshd takes the first value it reads, and Debian's sshd_config includes this directory
# before its own lines. A file that sorts before this one in that directory still wins.
# A key alone, or a password together with a one-time code: the keyboard-interactive login goes
# through PAM (/etc/pam.d/sshd), which asks for the password and then for the code of the user's
# authenticator app (pam_nyra_totp.so; a user without two-step authentication gets no password login).
PasswordAuthentication no
KbdInteractiveAuthentication yes
AuthenticationMethods publickey keyboard-interactive:pam
UsePAM yes
PermitRootLogin no
# Addresses that fail to log in, again and again, are refused for a while (OpenSSH's defaults).
PerSourcePenalties yes
