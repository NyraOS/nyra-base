# The sealed command line does not import systemd credentials (from firmware tables such as SMBIOS
# and fw_cfg, the kernel command line or the boot stub): nothing outside the signed image configures
# the system at boot (docs/BOOT.md). Test disks add an add-on that turns it back on.
kargs = ["systemd.import_credentials=no"]
