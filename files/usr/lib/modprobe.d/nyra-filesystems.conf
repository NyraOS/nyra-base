# Filesystems that are not loaded automatically when a disk or image asks for them (docs/DEFAULTS.md):
# rare or legacy formats whose parsers are attack surface for a crafted USB stick or disk image.
# "blacklist" stops only the automatic load (mount, udev); an administrator can still run
# `modprobe <name>`. What Nyra mounts from removable media stays (vfat, exfat, ntfs, ext4, btrfs,
# xfs, udf, isofs; 90-nyra-udisks.rules), plus erofs and overlay (composefs). hfsplus and squashfs are
# here too: udisks2 lets a user ask for them by name (udisksctl mount -t), even on a stick that holds
# another file system.
blacklist adfs
blacklist affs
blacklist befs
blacklist bfs
blacklist cramfs
blacklist efs
blacklist f2fs
blacklist freevxfs
blacklist gfs2
blacklist hfs
blacklist hfsplus
blacklist hpfs
blacklist jffs2
blacklist jfs
blacklist minix
blacklist nilfs2
blacklist ocfs2
blacklist omfs
blacklist qnx4
blacklist qnx6
blacklist romfs
blacklist squashfs
blacklist sysv
blacklist ufs
