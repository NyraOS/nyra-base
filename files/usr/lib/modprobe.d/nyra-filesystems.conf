# Filesystems that are not loaded automatically when a disk or image asks for them (docs/DEFAULTS.md):
# rare or legacy formats whose parsers are attack surface for a crafted USB stick or disk image.
# "blacklist" stops only the automatic load (mount, udev); an administrator can still run
# `modprobe <name>`. Everything people plug in stays: vfat, exfat, ntfs3, ext4, btrfs, xfs, udf,
# isofs, hfsplus, squashfs, plus erofs and overlay (composefs).
blacklist adfs
blacklist affs
blacklist befs
blacklist bfs
blacklist cramfs
blacklist efs
blacklist f2fs
blacklist freevxfs
blacklist gfs2
blacklist hfs
blacklist hpfs
blacklist jffs2
blacklist jfs
blacklist minix
blacklist nilfs2
blacklist ocfs2
blacklist omfs
blacklist qnx4
blacklist qnx6
blacklist romfs
blacklist sysv
blacklist ufs
