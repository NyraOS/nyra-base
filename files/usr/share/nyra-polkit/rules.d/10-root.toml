# root may do every action, as with polkitd, which answers yes to root before it reads any rule
# (docs/DEFAULTS.md, "polkit"): udisks2 asks about every caller, root included, so `udisksctl mount`
# as root on the console (a session without a seat) needs this. nyra-polkit has no such case, and
# allows a rule for every action only with "no", so the rule names the prefixes of every action
# installed in the image. One difference stays: the most restrictive matching rule wins, so the
# actions that need an administrator's password for everyone (49-nyra.toml, 60-flatpak.toml) need
# it for root too; root can still do the same with losetup, fatlabel and flatpak directly.
[[rule]]
actions = ["io.*", "org.*"]
users = ["root"]
result = "yes"
