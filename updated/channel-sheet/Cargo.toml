# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "nyra-channel-sheet"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Verifies the signed channel sheet of Nyra OS updates and picks the version for this machine"

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
ed25519-dalek = "3"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
