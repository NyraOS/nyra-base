# SPDX-License-Identifier: GPL-3.0-or-later
name: arm64 installer ISO
description: >-
  The aarch64 installer ISO (docs/ISO.md, "aarch64"), built natively on an arm64 runner: the iso job of
  image.yml for x86_64 with ISO_ARCH=arm64 and nothing else changed. The image artifact is checked
  against the hash of the job that made it and loaded; in release mode the signature of the sign job is
  checked against that job's outputs. Then the installer program (ci/build-installer.sh), the installer
  system and the boot files (ci/build-iso-os.sh), the registry store (ci/iso-registry.sh) and the ISO
  (ci/build-iso.sh, built twice: the two files must be the same). Then two altered ISOs, made like the real
  one from a copy of its inputs: a layer of the image replaced in the registry store, and a RELEASE that
  names another digest. The three are uploaded for the boot tests (arm64-iso-boot) with their hashes as
  outputs, and the package lists and Cargo.lock for the scan (arm64-iso-sbom). No secret and no id-token;
  nothing from the image or the ISO runs outside the build containers.
inputs:
  mode:
    description: release (the image of the release run and its signature) or test (an image signed with a key made here)
    required: true
  image-artifact:
    description: The name of the artifact holding nyra-base.oci.tar
    required: true
  image-sha256:
    description: Its sha256, as the job that made it reported
    required: true
  image-digest:
    description: Release mode - the digest the sign job signed, from its outputs
    default: ""
  signature-digest:
    description: Release mode - the digest of the signature manifest, from the sign job's outputs
    default: ""
  signature-artifact:
    description: Release mode - the name of the signature artifact
    default: nyra-base-arm64-signature
outputs:
  iso_artifact:
    description: >-
      The name of the artifact the ISO is uploaded as for the boot tests, nyra-installer-iso-arm64-untested-unsigned-MODE:
      it is what the name says. It is uploaded before any boot, built from the inputs of the run (a pull request's
      too, in test mode, trusting a key made for the run) and it is signed by nobody. The boot and keep jobs take
      the name from this output.
    value: ${{ steps.name.outputs.iso_artifact }}
  iso_sha256:
    description: The sha256 of the ISO in the artifact
    value: ${{ steps.build.outputs.iso_sha256 }}
  layer_sha256:
    description: The sha256 of the ISO with an altered layer, in the artifact iso_artifact-layer
    value: ${{ steps.layer.outputs.sha256 }}
  digest_sha256:
    description: The sha256 of the ISO with another digest in RELEASE, in the artifact iso_artifact-digest
    value: ${{ steps.digest.outputs.sha256 }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/arm64-prepare
      with:
        tools: "true"

    - name: Install the tools that write the ISO
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends xorriso mtools dosfstools cpio zstd jq
        df -h / "$WORK"

    - name: Mode
      id: name
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        case "$MODE" in release | test) ;; *) echo "::error::mode is release or test, not '$MODE'"; exit 1 ;; esac
        echo "ISO mode: $MODE"
        echo "iso_artifact=nyra-installer-iso-arm64-untested-unsigned-$MODE" >> "$GITHUB_OUTPUT"
        {
          echo "ISO_ARCH=arm64"
          echo "MODE=$MODE"
        } >> "$GITHUB_ENV"

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.image-artifact }}
        path: ${{ env.WORK }}/image

    - name: Check the image and load it
      shell: bash
      env:
        IMAGE_SHA256: ${{ inputs.image-sha256 }}
      run: |
        ci/check-artifact.sh "$WORK/image/nyra-base.oci.tar" "$IMAGE_SHA256"
        sudo podman load -q -i "$WORK/image/nyra-base.oci.tar"
        sudo podman image exists localhost/nyra-base:ci
        # The registry store is made from the archive: it stays until then.

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: ${{ inputs.mode == 'release' }}
      with:
        name: ${{ inputs.signature-artifact }}
        path: ${{ env.WORK }}/signature

    # What is downloaded is data: read by jq and sha256sum, never run. The values come from the sign job's
    # outputs, as in the iso job.
    - name: Check the signature against the sign job
      if: ${{ inputs.mode == 'release' }}
      shell: bash
      env:
        IMAGE_DIGEST: ${{ inputs.image-digest }}
        SIGNATURE_DIGEST: ${{ inputs.signature-digest }}
      run: |
        die() { echo "::error::$*" >&2; exit 1; }
        digest_re='^sha256:[0-9a-f]{64}$'
        [[ "$IMAGE_DIGEST" =~ $digest_re ]] || die "sign: no image digest ('$IMAGE_DIGEST')"
        [[ "$SIGNATURE_DIGEST" =~ $digest_re ]] || die "sign: no signature digest ('$SIGNATURE_DIGEST')"
        sig="$WORK/signature"
        [ -z "$(find "$sig" ! -type f ! -type d -print -quit)" ] || die "the signature artifact holds more than files and directories"
        [ "$(cat "$sig/image-digest")" = "$IMAGE_DIGEST" ] || die "the signature is not for $IMAGE_DIGEST"
        sig_tag="${IMAGE_DIGEST/:/-}.sig"
        [ "$(jq -er --arg ref "$sig_tag" '.manifests | select(length == 1) | .[0]
              | select(.annotations["org.opencontainers.image.ref.name"] == $ref) | .digest' "$sig/signature/index.json")" = "$SIGNATURE_DIGEST" ] ||
          die "the signature layout is not exactly the manifest $SIGNATURE_DIGEST"
        blob="$sig/signature/blobs/sha256/${SIGNATURE_DIGEST#sha256:}"
        [ -f "$blob" ] && [ ! -L "$blob" ] && [ "$(sha256sum < "$blob" | cut -d' ' -f1)" = "${SIGNATURE_DIGEST#sha256:}" ] ||
          die "the signature blob does not match its digest"

    - name: The installer program (ci/build-installer.sh)
      shell: bash
      run: ci/build-installer.sh "$WORK/iso/installer" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: The installer system (ci/build-iso-os.sh)
      shell: bash
      run: ci/build-iso-os.sh "$WORK/iso"

    # One directory, so that the files are at the root of the artifact (arm64-iso-sbom reads them there).
    - name: Upload the bill of materials of the ISO
      shell: bash
      run: |
        mkdir "$WORK/materials"
        cp "$WORK/iso/os/nyra-installer-os.manifest" "$WORK/iso/boot/nyra-installer-boot.manifest" \
          "$WORK/iso/installer/Cargo.lock" "$WORK/materials/"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.name.outputs.iso_artifact }}-materials
        path: ${{ env.WORK }}/materials
        retention-days: 14

    - name: The registry store with the signed image (ci/iso-registry.sh)
      shell: bash
      run: |
        if [ "$MODE" = release ]; then
          ci/iso-registry.sh "$WORK/iso" "$WORK/image/nyra-base.oci.tar" "$VERSION" release "$WORK/signature"
        else
          ci/iso-registry.sh "$WORK/iso" "$WORK/image/nyra-base.oci.tar" "$VERSION" test
        fi
        rm -f "$WORK/image/nyra-base.oci.tar"

    - name: The ISO (ci/build-iso.sh)
      id: build
      shell: bash
      run: |
        sudo -E ci/build-iso.sh "$WORK/iso" "$WORK/nyra.iso" "$VERSION" "$GITHUB_SHA" "$MODE" localhost/nyra-base:ci
        sudo chown "$(id -u):$(id -g)" "$WORK/nyra.iso"
        sha256="$(sha256sum < "$WORK/nyra.iso" | cut -d' ' -f1)"
        echo "iso_sha256=$sha256" >> "$GITHUB_OUTPUT"
        echo "ISO: $(stat -c %s "$WORK/nyra.iso") bytes, sha256 $sha256, $MODE mode"
        {
          echo "## aarch64 installer ISO"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Mode | $MODE |"
          echo "| Size | $(stat -c %s "$WORK/nyra.iso") bytes |"
          echo "| SHA-256 | \`$sha256\` |"
          echo
        } >> "$GITHUB_STEP_SUMMARY"

    # The same inputs give the same file: the last step (the RAM disk, the EFI image, xorriso) runs again.
    - name: The same ISO again (ci/build-iso.sh)
      shell: bash
      run: |
        sudo -E ci/build-iso.sh "$WORK/iso" "$WORK/nyra-again.iso" "$VERSION" "$GITHUB_SHA" "$MODE" localhost/nyra-base:ci
        if ! sudo cmp "$WORK/nyra.iso" "$WORK/nyra-again.iso"; then
          echo "::error::two builds of the same inputs are not the same ISO"
          sha256sum "$WORK/nyra.iso" "$WORK/nyra-again.iso"
          exit 1
        fi
        sudo rm -f "$WORK/nyra-again.iso"

    - name: Upload the ISO for the boot tests
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.name.outputs.iso_artifact }}
        path: ${{ env.WORK }}/nyra.iso
        retention-days: 1
        compression-level: 0

    # The altered ISOs, made like the real one from a copy of its inputs (as image.yml's iso job): the biggest
    # blob of the registry store is the image's layer, replaced by another valid gzip stream so that what
    # fails is its digest and nothing else; and a RELEASE that names another digest. One at a time, so that
    # the disk holds one extra ISO. The boot tests must see the pull refused (tools/iso/boot-test.py --refusal).
    - name: The ISO with an altered layer (ci/build-iso.sh)
      id: layer
      shell: bash
      run: |
        t="$WORK/tamper-layer"
        sudo rm -rf "$t"
        mkdir "$t"
        ln -s "$WORK/iso/os" "$t/os"
        ln -s "$WORK/iso/boot" "$t/boot"
        sudo cp -a "$WORK/iso/registry" "$t/registry"
        cp "$WORK/iso/registry-digest" "$t/registry-digest"
        if [ -f "$WORK/iso/registry-test.pub" ]; then cp "$WORK/iso/registry-test.pub" "$t/"; fi
        blob="$(sudo find "$t/registry" -path '*/blobs/sha256/*' -name data -printf '%s %p\n' | sort -n | tail -n 1 | cut -d' ' -f2-)"
        echo "a layer that is not the image's" | gzip -c | sudo tee "$blob" > /dev/null
        sudo -E ci/build-iso.sh "$t" "$t/nyra.iso" "$VERSION" "$GITHUB_SHA" "$MODE" localhost/nyra-base:ci
        sudo rm -rf "$t/registry"
        sudo chown "$(id -u):$(id -g)" "$t/nyra.iso"
        echo "sha256=$(sha256sum < "$t/nyra.iso" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        mkdir "$WORK/up-layer" && mv "$t/nyra.iso" "$WORK/up-layer/"

    - name: Upload the ISO with an altered layer
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.name.outputs.iso_artifact }}-layer
        path: ${{ env.WORK }}/up-layer/nyra.iso
        retention-days: 1
        compression-level: 0

    - name: The ISO with another digest in RELEASE (ci/build-iso.sh)
      id: digest
      shell: bash
      run: |
        sudo rm -rf "$WORK/tamper-layer" "$WORK/up-layer"
        t="$WORK/tamper-digest"
        sudo rm -rf "$t"
        mkdir "$t"
        ln -s "$WORK/iso/os" "$t/os"
        ln -s "$WORK/iso/boot" "$t/boot"
        sudo cp -a "$WORK/iso/registry" "$t/registry"
        if [ -f "$WORK/iso/registry-test.pub" ]; then cp "$WORK/iso/registry-test.pub" "$t/"; fi
        echo "sha256:$(printf 'f%.0s' {1..64})" > "$t/registry-digest"
        sudo -E ci/build-iso.sh "$t" "$t/nyra.iso" "$VERSION" "$GITHUB_SHA" "$MODE" localhost/nyra-base:ci
        sudo rm -rf "$t/registry"
        sudo chown "$(id -u):$(id -g)" "$t/nyra.iso"
        echo "sha256=$(sha256sum < "$t/nyra.iso" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        mkdir "$WORK/up-digest" && mv "$t/nyra.iso" "$WORK/up-digest/"

    - name: Upload the ISO with another digest
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.name.outputs.iso_artifact }}-digest
        path: ${{ env.WORK }}/up-digest/nyra.iso
        retention-days: 1
        compression-level: 0
