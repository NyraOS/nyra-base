# SPDX-License-Identifier: GPL-3.0-or-later
name: arm64 boot
description: >-
  The aarch64 boot tests (docs/ARM64.md, "What the tests prove"), the boot job of arm64.yml and
  image.yml's boot-arm64: the image artifact checked against its job's hash and installed to a disk as
  the installer does, then tools/vm/arm64-boot.sh (without and with Secure Boot, the UKI's certificate
  enrolled as a MOK), and with KVM boot counting across updates. Without KVM (GitHub's arm64 runners)
  the boots are emulated (QEMU TCG) with a longer timeout. With `vm-disk`, the installed disk is
  uploaded as a compressed qcow2 for UTM (nyra-base-arm64-vm) before any test boots it.
  Security: as in image.yml, the boots run images built from pull requests with --privileged and
  /dev mounted: GitHub-hosted runners only.
inputs:
  artifact:
    description: The name of the artifact holding nyra-base.oci.tar
    required: true
  image-sha256:
    description: Its sha256, as the job that made it reported
    required: true
  uki-cert:
    description: The certificate the UKI is signed with, base64 (enrolled as a MOK)
    required: true
  vm-disk:
    description: Upload the installed disk for UTM (true or false)
    default: "false"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/arm64-prepare

    - name: KVM on the runner?
      id: kvm
      shell: bash
      run: |
        if [ -e /dev/kvm ]; then
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
        fi
        if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then kvm=true timeout=300; else kvm=false timeout=1800; fi
        echo "kvm=$kvm ($(ls -l /dev/kvm 2>&1))"
        echo "kvm=$kvm" >> "$GITHUB_OUTPUT"
        echo "BOOT_TIMEOUT=$timeout" >> "$GITHUB_ENV"
        {
          echo "## aarch64 runner"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| CPU | $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) CPUs |"
          echo "| Kernel | $(uname -r) |"
          echo "| /dev/kvm | $(ls -l /dev/kvm 2>&1) |"
          echo "| VM tests | $([ "$kvm" = true ] && echo "KVM" || echo "emulated (QEMU TCG), boot timeout ${timeout} s") |"
          echo
        } >> "$GITHUB_STEP_SUMMARY"

    # ipxe-qemu: the virtio NIC's option ROM file, which QEMU must find (only recommended on arm64).
    - name: Install QEMU and edk2 (AAVMF)
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends qemu-system-arm qemu-utils qemu-efi-aarch64 ipxe-qemu \
          python3-virt-firmware systemd-ukify sbsigntool python3-pefile
        qemu-system-aarch64 --version | head -1
        ls -l /usr/share/AAVMF

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ env.WORK }}/image

    - name: Load the image
      shell: bash
      env:
        IMAGE_SHA256: ${{ inputs.image-sha256 }}
      run: |
        ci/check-artifact.sh "$WORK/image/nyra-base.oci.tar" "$IMAGE_SHA256"
        sudo podman load -i "$WORK/image/nyra-base.oci.tar"
        rm "$WORK/image/nyra-base.oci.tar"
        digest="$(sudo podman image inspect -f '{{.Digest}}' localhost/nyra-base:ci)"
        [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

    - name: Install to a disk image with bootc
      id: install
      shell: bash
      run: |
        tools/vm/install-disk.sh localhost/nyra-base:ci "$WORK"
        tools/vm/test-console.sh localhost/nyra-base:ci "$WORK/disk.raw" "$WORK"
        qemu-img convert -O qcow2 "$WORK/disk.raw" "$WORK/disk.qcow2"
        rm "$WORK/disk.raw"

    # Before any test boots it: the boots below run in snapshot mode, but boot counting writes to a copy.
    - name: The VM disk image for UTM (docs/ARM64.md)
      if: inputs.vm-disk == 'true'
      shell: bash
      run: |
        mkdir -p "$WORK/vm"
        qemu-img convert -c -O qcow2 "$WORK/disk.qcow2" "$WORK/vm/nyra-base-arm64.qcow2"
        (cd "$WORK/vm" && sha256sum nyra-base-arm64.qcow2 > nyra-base-arm64.qcow2.sha256)
        qemu-img info "$WORK/vm/nyra-base-arm64.qcow2"
        echo "| VM disk image | nyra-base-arm64.qcow2, $(du -h "$WORK/vm/nyra-base-arm64.qcow2" | cut -f1) (artifact nyra-base-arm64-vm) |" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the VM disk image
      if: inputs.vm-disk == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nyra-base-arm64-vm
        path: ${{ env.WORK }}/vm
        compression-level: 0
        retention-days: 14

    - name: Boots without and with Secure Boot (tools/vm/arm64-boot.sh)
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      shell: bash
      env:
        UKI_CERT: ${{ inputs.uki-cert }}
      run: |
        base64 -d <<<"$UKI_CERT" > "$RUNNER_TEMP/uki.crt"
        tools/vm/arm64-boot.sh localhost/nyra-base:ci "$IMAGE_DIGEST" "$WORK/disk.qcow2" "$RUNNER_TEMP/uki.crt" \
          "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY" "$BOOT_TIMEOUT"

    # Its boots have the x86_64 timeouts: only with KVM.
    - name: Boot counting across updates (tools/vm/boot-counting.sh)
      if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.kvm.outputs.kvm == 'true' }}
      shell: bash
      run: |
        ci/pinned-images.sh "$RUNNER_TEMP/pinned-images" registry
        tools/vm/boot-counting.sh localhost/nyra-base:ci "$IMAGE_DIGEST" "$WORK/disk.qcow2" \
          "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

    - name: Upload the serial logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: arm64-serial-log
        path: ${{ runner.temp }}/serial*.log
        if-no-files-found: ignore
        retention-days: 14
