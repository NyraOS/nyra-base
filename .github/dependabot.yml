# Updates for the GitHub Actions pinned by SHA in .github/workflows and .github/actions, for the
# Python package pinned by hash in tools/sbom/requirements.txt and for the Rust crates of updated/,
# zlib/ and ntpd-rs/ (locked in their Cargo.lock): pins keep CI from running code nobody reviewed,
# and Dependabot keeps the pins current.
# Minor and patch updates of the actions and of the crates come grouped in one PR each. Container
# images in run: lines and Containerfiles are pinned by digest and updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /tools/sbom
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
  - package-ecosystem: cargo
    directories: [/updated, /zlib, /ntpd-rs]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
