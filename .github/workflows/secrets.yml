# Secret scanning on every push and pull request (DECIZII F151).
# Runs the gitleaks container directly: the gitleaks GitHub Action needs a license for organizations.
name: secrets
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" docker.io/zricethezav/gitleaks:v8.18.4 detect --source /repo --redact --no-banner -v
