# Secret scanning on every push and pull request (DECIZII F151).
# Runs the gitleaks container directly: the gitleaks GitHub Action needs a license for organizations.
name: secrets
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks v8.30.1, pinned by its multi-arch index digest (Dependabot does not update images in run: lines)
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" docker.io/zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner -v /repo
