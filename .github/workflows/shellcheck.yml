# SPDX-License-Identifier: GPL-3.0-or-later
# Lints the shell scripts with the shellcheck preinstalled on the GitHub-hosted Ubuntu runner.
name: shellcheck
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -S warning ci/*.sh tools/*/*.sh tools/hooks/pre-push files/usr/lib/nyra/boot/esp-sync
