# SPDX-License-Identifier: GPL-3.0-or-later
# Runs ci/precheck.sh, the list of the offline checks (run it before a push too): lints the shell
# scripts with the shellcheck preinstalled on the GitHub-hosted Ubuntu runner (the scripts are the
# tracked files whose first line is a sh/bash/dash shebang), checks the workflows with actionlint
# (syntax, expressions, reusable workflow calls; the shell in them is not linted) and runs the offline
# self-tests of the test tools, so a workflow that runs only at night (titanic.yml) is checked on every
# pull request too.
name: shellcheck
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$f"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      # The checks themselves are listed in ci/precheck.sh, which runs the same on a developer's machine
      # before a push: shellcheck, the self-tests of the test tools, the lints of ci/ and the workflows,
      # and actionlint. The secret scan is the secrets workflow's.
      - name: Offline checks (ci/precheck.sh)
        run: ci/precheck.sh
