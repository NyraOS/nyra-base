# SPDX-License-Identifier: GPL-3.0-or-later
# nyra-base for aarch64 (docs/ARM64.md): the same sources and steps as image.yml (mkosi/mkosi.conf,
# Containerfile, ci/build-image.sh, the tools image, bootc from source), built natively on GitHub's
# arm64 runners. Only the architecture changes: the build sets it in mkosi.conf (its Architecture=
# and the two packages named after it), and the release repository in updated.conf, nothing else.
# The steps are local actions (.github/actions/arm64-*) that image.yml's arm64 release jobs run too.
# Not part of the x86_64 checks: it runs on main after a merge, by hand, and on pull requests that
# change it, those actions, the signing tools or the scripts that make the UKI; image.yml and
# titanic.yml do not wait for it. It uses no cache (every run downloads and builds with the same
# pins), and nothing is signed for release or published here (image.yml does that, docs/ARM64.md,
# "Releases").
#   bootc   bootc compiled from source twice, on two runners; build checks that both are identical
#   build   mkosi, the bootc layer, the sealed UKI signed with a key made for the run, lint, the
#           architecture and repository, the UKI release gate's and the PCR policy's tests on the
#           AArch64 UKI, on pull requests the release mode build; then a second build that must give
#           the same layers (ci/check-reproducible.sh)
#   join    on x86_64, no token: the join of release-sign-arm64 (tools/signing/join-pcrsig.sh, the
#           sealed arm64 image's ukify under Ubuntu's qemu-user-static) on this run's UKI, which must
#           give the UKI the build joined natively, then sign-uki.sh with a key made for the job
#   boot    whether the runner has KVM; install to a disk, two boots (tools/vm/arm64-boot.sh: without
#           and with Secure Boot), boot counting across updates (tools/vm/boot-counting.sh) when
#           there is KVM; the installed disk as a compressed qcow2 for UTM on Apple Silicon
# Security: as in image.yml, the boot job runs images built from pull requests with --privileged and
# /dev mounted: GitHub-hosted runners only.
name: arm64
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/arm64.yml
      - .github/actions/arm64-*/**
      - tools/vm/arm64-boot.sh
      - tools/signing/**
      - ci/build-image.sh
      - ci/ukify.sh
      - ci/release-smoke.sh
      - ci/check-image-repository.sh
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  bootc:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      matrix:
        copy: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/arm64-bootc
        with:
          copy: ${{ matrix.copy }}

  build:
    needs: bootc
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    outputs:
      uki_cert: ${{ steps.build.outputs.uki_cert }}
      image_sha256: ${{ steps.build.outputs.image_sha256 }}
      unsigned_uki_sha256: ${{ steps.build.outputs.unsigned_uki_sha256 }}
      sealed_image_sha256: ${{ steps.build.outputs.sealed_image_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: build
        uses: ./.github/actions/arm64-build
        with:
          release: "false"

  # What release-sign-arm64 in image.yml does between its checks and the KMS (docs/SIGNING.md), on an
  # x86_64 runner without any token: the emulator from Ubuntu's archive, the sealed arm64 image checked
  # and loaded, the join in tools/signing/join-pcrsig.sh. The joined UKI must be byte for byte the one
  # ci/build-image.sh joined natively from the same signature, and sign-uki.sh (sbsign on x86_64 for an
  # AArch64 PE) must sign and verify it, with a key made here and deleted with the runner.
  join:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      # As release-sign-arm64's step of the same name.
      - name: Install sbsign, pefile and qemu-user-static
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q --no-install-recommends sbsigntool python3-pefile qemu-user-static >/dev/null
          sudo /usr/lib/systemd/systemd-binfmt /usr/lib/binfmt.d/qemu-aarch64.conf
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-arm64-unsigned-uki
          path: ${{ runner.temp }}/unsigned

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-arm64-sealed-oci-archive
          path: ${{ runner.temp }}/sealed

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-arm64-join-test
          path: ${{ runner.temp }}/reference

      - name: Check both artifacts and load the sealed image
        env:
          UNSIGNED_UKI_SHA256: ${{ needs.build.outputs.unsigned_uki_sha256 }}
          SEALED_IMAGE_SHA256: ${{ needs.build.outputs.sealed_image_sha256 }}
        run: |
          files=("$RUNNER_TEMP"/unsigned/*)
          [ "${#files[@]}" = 1 ] && [ -f "${files[0]}" ] || { echo "::error::the unsigned UKI artifact must hold exactly one file"; exit 1; }
          ci/check-artifact.sh "${files[0]}" "$UNSIGNED_UKI_SHA256"
          ci/check-artifact.sh "$RUNNER_TEMP/sealed/nyra-base-sealed.oci.tar" "$SEALED_IMAGE_SHA256"
          sudo podman load -q -i "$RUNNER_TEMP/sealed/nyra-base-sealed.oci.tar"
          rm "$RUNNER_TEMP/sealed/nyra-base-sealed.oci.tar"
          sudo podman image exists localhost/nyra-base:ci-sealed

      - name: Join under qemu-user, compare, sign with a key of the job
        run: |
          files=("$RUNNER_TEMP"/unsigned/*)
          name="${files[0]##*/}"
          ref="$RUNNER_TEMP/reference"
          start=$SECONDS
          tools/signing/join-pcrsig.sh localhost/nyra-base:ci-sealed linux/arm64 "${files[0]}" "$ref/pcrsig.json" "$RUNNER_TEMP/join"
          echo "join under qemu-user: $((SECONDS - start)) s"
          cmp "$RUNNER_TEMP/join/out/$name" "$ref/$name"
          echo "The UKI joined under qemu-user on x86_64 is the one joined natively on aarch64."
          python3 -I tools/signing/pcr-policy.py check "$RUNNER_TEMP/join/out/$name" "$ref/tpm2-pcr-public-key.pem"
          key="$(mktemp -d)"
          openssl req -new -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=Nyra CI arm64 join test key" \
            -keyout "$key/uki.key" -out "$key/uki.crt" 2>/dev/null
          PCR_PUBKEY="$ref/tpm2-pcr-public-key.pem" tools/signing/sign-uki.sh "$RUNNER_TEMP/join/out" "$RUNNER_TEMP/signed" \
            --key "$key/uki.key" --cert "$key/uki.crt"
          rm -rf "$key"
          python3 -I - "$RUNNER_TEMP/signed/$name" <<'PY'
          import sys
          import pefile
          machine = pefile.PE(sys.argv[1], fast_load=True).FILE_HEADER.Machine
          assert machine == 0xAA64, hex(machine)
          print("signed on x86_64: an AArch64 PE (machine 0xaa64)")
          PY

  boot:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/arm64-boot
        with:
          artifact: nyra-base-arm64-oci-archive
          image-sha256: ${{ needs.build.outputs.image_sha256 }}
          uki-cert: ${{ needs.build.outputs.uki_cert }}
          vm-disk: "true"
