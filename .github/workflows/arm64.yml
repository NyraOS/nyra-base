# SPDX-License-Identifier: GPL-3.0-or-later
# nyra-base for aarch64 (docs/ARM64.md): the same sources and steps as image.yml (mkosi/mkosi.conf,
# Containerfile, ci/build-image.sh, the tools image, bootc from source), built natively on GitHub's
# arm64 runners. Only the architecture changes: the build sets it in mkosi.conf (its Architecture=
# and the two packages named after it), and the release repository in updated.conf, nothing else.
# The steps are local actions (.github/actions/arm64-*) that image.yml's arm64 release jobs run too.
# Not part of the x86_64 checks: it runs on main after a merge, by hand, and on pull requests that
# change it, those actions, the signing tools or the scripts that make the UKI; image.yml and
# titanic.yml do not wait for it. It uses no cache (every run downloads and builds with the same
# pins), and nothing is signed for release or published here (image.yml does that, docs/ARM64.md,
# "Releases").
#   bootc   bootc compiled from source twice, on two runners; build checks that both are identical
#   build   mkosi, the bootc layer, the sealed UKI signed with a key made for the run, lint, the
#           architecture and repository, the UKI release gate's and the PCR policy's tests on the
#           AArch64 UKI, on pull requests the release mode build; then a second build that must give
#           the same layers (ci/check-reproducible.sh)
#   join    on x86_64, no token: the join of release-sign-arm64 (tools/signing/join-pcrsig.sh, the
#           sealed arm64 image's ukify under Ubuntu's qemu-user-static) on this run's UKI, which must
#           give the UKI the build joined natively, then sign-uki.sh with a key made for the job
#   policy  on arm64, no token: the plumbing of image.yml's verify-signature-arm64 (the image's own
#           skopeo, the throwaway registry, tools/signing/test-policy.sh for nyra-base-arm64)
#   boot    whether the runner has KVM; install to a disk, two boots (tools/vm/arm64-boot.sh: without
#           and with Secure Boot), boot counting across updates (tools/vm/boot-counting.sh) when
#           there is KVM; the installed disk as a compressed qcow2 for UTM on Apple Silicon
#   display  the installer's encrypted disk (a password) booted with a display and a USB keyboard, as UTM runs
#           it; the screen is read as text, the password typed on the keyboard (tools/vm/arm64-display.sh)
#   iso     the aarch64 installer ISO (docs/ISO.md, "aarch64") built from this run's image, in test mode (the
#           image signed with a key made for the run), natively on arm64 (the .github/actions/arm64-iso
#           that image.yml's iso-arm64 runs too); then iso-boot, three emulated boots of it in parallel
#           (QEMU TCG, AAVMF with Secure Boot, no TPM): as a CD, as a USB stick with a decoy medium, and as
#           a CD with the verified pull of the image on it, and two altered ISOs whose pull must be
#           refused; iso-sbom: the vulnerability scan of its installer system
# Security: as in image.yml, the boot job runs images built from pull requests with --privileged and
# /dev mounted: GitHub-hosted runners only.
name: arm64
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/arm64.yml
      - .github/actions/arm64-*/**
      - Containerfile
      - tools/vm/arm64-boot.sh
      - tools/vm/arm64-display.sh
      - tools/vm/screen-boot.py
      - tools/vm/install-encrypted.sh
      - tools/install/lib.sh
      - tools/signing/**
      - ci/build-image.sh
      - ci/ukify.sh
      - ci/release-smoke.sh
      - ci/check-image-repository.sh
      - iso/**
      - ci/build-installer.sh
      - ci/build-iso.sh
      - ci/build-iso-os.sh
      - ci/iso-*.sh
      - tools/iso/**
      - tools/sbom/sbom.py
      - tools/sbom/mitigations-iso-arm64.toml
      - tools/sbom/requirements.txt
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  bootc:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      matrix:
        copy: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/arm64-bootc
        with:
          copy: ${{ matrix.copy }}

  build:
    needs: bootc
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    outputs:
      uki_cert: ${{ steps.build.outputs.uki_cert }}
      image_sha256: ${{ steps.build.outputs.image_sha256 }}
      unsigned_uki_sha256: ${{ steps.build.outputs.unsigned_uki_sha256 }}
      sealed_image_sha256: ${{ steps.build.outputs.sealed_image_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: build
        uses: ./.github/actions/arm64-build
        with:
          release: "false"

  # What release-sign-arm64 in image.yml does between its checks and the KMS (docs/SIGNING.md), on an
  # x86_64 runner without any token: the emulator from Ubuntu's archive, the sealed arm64 image checked
  # and loaded, the join in tools/signing/join-pcrsig.sh. The joined UKI must be byte for byte the one
  # ci/build-image.sh joined natively from the same signature, and sign-uki.sh (sbsign on x86_64 for an
  # AArch64 PE) must sign and verify it, with a key made here and deleted with the runner.
  join:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      # As release-sign-arm64's step of the same name.
      - name: Install sbsign, pefile and qemu-user-static
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update -q >/dev/null
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y -q --no-install-recommends sbsigntool python3-pefile qemu-user-static >/dev/null
          sudo /usr/lib/systemd/systemd-binfmt /usr/lib/binfmt.d/qemu-aarch64.conf
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-arm64-unsigned-uki
          path: ${{ runner.temp }}/unsigned

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-arm64-sealed-oci-archive
          path: ${{ runner.temp }}/sealed

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-arm64-join-test
          path: ${{ runner.temp }}/reference

      - name: Check both artifacts and load the sealed image
        env:
          UNSIGNED_UKI_SHA256: ${{ needs.build.outputs.unsigned_uki_sha256 }}
          SEALED_IMAGE_SHA256: ${{ needs.build.outputs.sealed_image_sha256 }}
        run: |
          files=("$RUNNER_TEMP"/unsigned/*)
          [ "${#files[@]}" = 1 ] && [ -f "${files[0]}" ] || { echo "::error::the unsigned UKI artifact must hold exactly one file"; exit 1; }
          ci/check-artifact.sh "${files[0]}" "$UNSIGNED_UKI_SHA256"
          ci/check-artifact.sh "$RUNNER_TEMP/sealed/nyra-base-sealed.oci.tar" "$SEALED_IMAGE_SHA256"
          sudo podman load -q -i "$RUNNER_TEMP/sealed/nyra-base-sealed.oci.tar"
          rm "$RUNNER_TEMP/sealed/nyra-base-sealed.oci.tar"
          sudo podman image exists localhost/nyra-base:ci-sealed

      # What sign-arm64 (image.yml) does with an arm64 image on its x86_64 runner, rehearsed on the sealed
      # image: nothing of the image runs. podman creates a container only to copy files out of it
      # (--platform: no emulator, no warning), and the runner's skopeo copies the oci-archive into the
      # throwaway registry with the manifest digest unchanged.
      - name: Read the arm64 image on x86_64 and copy it with the runner's skopeo
        run: |
          ci/check-image-repository.sh localhost/nyra-base:ci-sealed nyra-base-arm64
          if ci/check-image-repository.sh localhost/nyra-base:ci-sealed nyra-base; then
            echo "::error::an arm64 image was accepted for nyra-base"; exit 1
          fi
          # The sealed image has no UKI under /boot (ci/final-image.sh adds the signed one): the files
          # sign-arm64's release gate also copies out of the image are what is read here.
          cid="$(sudo podman create -q --platform linux/arm64 localhost/nyra-base:ci-sealed)"
          sudo podman cp "$cid:/boot" "$RUNNER_TEMP/boot"
          sudo podman cp "$cid:/usr/lib/nyra/secureboot/tpm2-pcr-public-key-next.pem" "$RUNNER_TEMP/next.pem"
          sudo podman cp "$cid:/usr/lib/nyra/secureboot/tpm2-pcr-retired-keys" "$RUNNER_TEMP/retired"
          sudo podman rm -f "$cid" >/dev/null
          echo "/boot of the sealed image:"; find "$RUNNER_TEMP/boot" | head -20
          echo "retired keys:"; ls "$RUNNER_TEMP/retired"
          [ -s "$RUNNER_TEMP/next.pem" ] || { echo "::error::tpm2-pcr-public-key-next.pem was not copied out of the image"; exit 1; }
          grep -q 'BEGIN PUBLIC KEY' "$RUNNER_TEMP/next.pem" || { echo "::error::tpm2-pcr-public-key-next.pem is not a public key"; exit 1; }
          reg="$RUNNER_TEMP/registry"
          mkdir "$reg"
          ci/pinned-images.sh "$RUNNER_TEMP/pinned-images" registry
          tools/signing/local-registry.sh "$reg"
          sudo podman save -q --format oci-archive -o "$reg/sealed.oci.tar" localhost/nyra-base:ci-sealed
          sudo chown "$(id -u):$(id -g)" "$reg/sealed.oci.tar"
          skopeo --version
          skopeo copy --dest-tls-verify=false --preserve-digests --digestfile "$reg/digest" \
            "oci-archive:$reg/sealed.oci.tar" docker://updates.nyraos.com/nyra-base-arm64:ci
          digest="$(cat "$reg/digest")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [ "$(tar -xOf "$reg/sealed.oci.tar" index.json | jq -er '.manifests | select(length == 1) | .[0].digest')" = "$digest" ]
          echo "copied with the manifest digest unchanged: $digest"

      - name: Join under qemu-user, compare, sign with a key of the job
        run: |
          files=("$RUNNER_TEMP"/unsigned/*)
          name="${files[0]##*/}"
          ref="$RUNNER_TEMP/reference"
          start=$SECONDS
          tools/signing/join-pcrsig.sh localhost/nyra-base:ci-sealed linux/arm64 "${files[0]}" "$ref/pcrsig.json" "$RUNNER_TEMP/join"
          echo "join under qemu-user: $((SECONDS - start)) s"
          cmp "$RUNNER_TEMP/join/out/$name" "$ref/$name"
          echo "The UKI joined under qemu-user on x86_64 is the one joined natively on aarch64."
          python3 -I tools/signing/pcr-policy.py check "$RUNNER_TEMP/join/out/$name" "$ref/tpm2-pcr-public-key.pem"
          key="$(mktemp -d)"
          openssl req -new -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=Nyra CI arm64 join test key" \
            -keyout "$key/uki.key" -out "$key/uki.crt" 2>/dev/null
          PCR_PUBKEY="$ref/tpm2-pcr-public-key.pem" tools/signing/sign-uki.sh "$RUNNER_TEMP/join/out" "$RUNNER_TEMP/signed" \
            --key "$key/uki.key" --cert "$key/uki.crt"
          rm -rf "$key"
          python3 -I - "$RUNNER_TEMP/signed/$name" <<'PY'
          import sys
          import pefile
          machine = pefile.PE(sys.argv[1], fast_load=True).FILE_HEADER.Machine
          assert machine == 0xAA64, hex(machine)
          print("signed on x86_64: an AArch64 PE (machine 0xaa64)")
          PY

  # The plumbing of image.yml's verify-signature-arm64, without a signature of Nyra's (a pull request has
  # no token): on an arm64 runner the image's own skopeo (native) puts the image into the throwaway
  # registry, and tools/signing/test-policy.sh checks the shipped policy for nyra-base-arm64: unsigned
  # and wrongly signed images refused, other registries and local transports accepted.
  policy:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/arm64-prepare

      - name: Pinned test registry image for arm64 (ci/pinned-images.sh)
        run: ci/pinned-images.sh "$RUNNER_TEMP/pinned-images" registry

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-arm64-oci-archive
          path: ${{ runner.temp }}/image-download

      - name: The image into the throwaway registry, then the policy tests
        env:
          IMAGE_SHA256: ${{ needs.build.outputs.image_sha256 }}
        run: |
          ci/check-artifact.sh "$RUNNER_TEMP/image-download/nyra-base.oci.tar" "$IMAGE_SHA256"
          mv "$RUNNER_TEMP/image-download/nyra-base.oci.tar" "$WORK/nyra-base.oci.tar"
          tools/signing/local-registry.sh "$WORK"
          sudo podman load -q -i "$WORK/nyra-base.oci.tar"
          test "$(sudo podman image inspect -f '{{.Os}}/{{.Architecture}}' localhost/nyra-base:ci)" = linux/arm64
          sudo podman run --rm --network host --tmpfs /var/tmp -v "$WORK:/w" localhost/nyra-base:ci \
            skopeo copy --dest-tls-verify=false --preserve-digests --digestfile /w/digest \
              oci-archive:/w/nyra-base.oci.tar docker://updates.nyraos.com/nyra-base-arm64:ci
          [[ "$(cat "$WORK/digest")" =~ ^sha256:[0-9a-f]{64}$ ]]
          tools/signing/test-policy.sh localhost/nyra-base:ci "$WORK" "" nyra-base-arm64

  boot:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/arm64-boot
        with:
          artifact: nyra-base-arm64-oci-archive
          image-sha256: ${{ needs.build.outputs.image_sha256 }}
          uki-cert: ${{ needs.build.outputs.uki_cert }}
          vm-disk: "true"

  # What a person sees (docs/ARM64.md, "The screen"): the installer's encrypted disk with a password, booted
  # as UTM on Apple Silicon runs it (a display, a USB keyboard), emulated. The screen is read as text and
  # the password is typed on the keyboard.
  display:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/arm64-display
        with:
          artifact: nyra-base-arm64-oci-archive
          image-sha256: ${{ needs.build.outputs.image_sha256 }}
          uki-cert: ${{ needs.build.outputs.uki_cert }}

  # The installer ISO for aarch64, in test mode: the image of this run, signed for the ISO's registry with a
  # key made here, which the ISO's policy trusts instead of the release signer. image.yml's iso-arm64 does the
  # same with the release image and its signature. No secret.
  iso:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      iso_sha256: ${{ steps.iso.outputs.iso_sha256 }}
      layer_sha256: ${{ steps.iso.outputs.layer_sha256 }}
      digest_sha256: ${{ steps.iso.outputs.digest_sha256 }}
      iso_artifact: ${{ steps.iso.outputs.iso_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: iso
        uses: ./.github/actions/arm64-iso
        with:
          mode: test
          image-artifact: nyra-base-arm64-oci-archive
          image-sha256: ${{ needs.build.outputs.image_sha256 }}

  # The boots of that ISO and of two altered ones (tools/iso/boot-test.py --arch arm64), emulated: each in a
  # job of its own, so that each stays within its time. The medium, the decoy medium, the verified pull and
  # the refusals as on x86_64 (image.yml's iso job).
  iso-boot:
    needs: iso
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cd
            args: "--deadline 1200"
            minutes: 30
          - name: usb
            args: "--medium usb --decoy --deadline 1200"
            minutes: 30
          - name: cd-pull
            args: "--pull --deadline 2100"
            minutes: 45
          # The altered ISOs (arm64-iso): the pull from each must be refused.
          - name: layer
            args: "--refusal layer --deadline 1200"
            suffix: -layer
            minutes: 30
          - name: digest
            args: "--refusal digest --deadline 1200"
            suffix: -digest
            minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/arm64-iso-boot
        with:
          iso-artifact: ${{ needs.iso.outputs.iso_artifact }}${{ matrix.suffix }}
          # A sha256 that is missing is no sha256: ci/check-artifact.sh refuses the artifact.
          iso-sha256: ${{ matrix.suffix == '-layer' && needs.iso.outputs.layer_sha256 || matrix.suffix == '-digest' && needs.iso.outputs.digest_sha256 || needs.iso.outputs.iso_sha256 }}
          name: ${{ matrix.name }}
          args: ${{ matrix.args }}

  # The vulnerability scan of the ISO's installer system and installer program (docs/SBOM.md), with the
  # exceptions of tools/sbom/mitigations-iso-arm64.toml alone.
  iso-sbom:
    needs: iso
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/arm64-iso-sbom
        with:
          materials-artifact: ${{ needs.iso.outputs.iso_artifact }}-materials
