# SPDX-License-Identifier: GPL-3.0-or-later
# nyra-base for aarch64 (docs/ARM64.md): the same sources and steps as image.yml (mkosi/mkosi.conf,
# Containerfile, ci/build-image.sh, the tools image, bootc from source), built natively on GitHub's
# arm64 runners. Only the architecture changes: the arch job sets it in mkosi.conf (its Architecture=
# and the two packages named after it), nothing else.
# Not part of the x86_64 checks: it runs on main after a merge, by hand, and on pull requests that
# change this file or tools/vm/arm64-boot.sh; image.yml and titanic.yml do not wait for it. It uses no
# cache (every run downloads and builds with the same pins), and nothing is signed for release or
# published.
#   bootc   bootc compiled from source twice, on two runners; build checks that both are identical
#   build   mkosi, the bootc layer, the sealed UKI signed with a key made for the run, lint, then a
#           second build that must give the same layers (ci/check-reproducible.sh)
#   boot    whether the runner has KVM; install to a disk, two boots (tools/vm/arm64-boot.sh: without
#           and with Secure Boot), boot counting across updates (tools/vm/boot-counting.sh) when
#           there is KVM; the installed disk as a compressed qcow2 for UTM on Apple Silicon
# Security: as in image.yml, the boot job runs images built from pull requests with --privileged and
# /dev mounted: GitHub-hosted runners only.
name: arm64
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/arm64.yml
      - tools/vm/arm64-boot.sh
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  bootc:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      matrix:
        copy: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &prepare
        name: Podman, the build inputs (as image.yml), the work directory
        run: |
          command -v podman >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends podman; }
          # As in image.yml: no `podman image prune` from the runner during the job (docs/LESSONS.md).
          if systemctl list-unit-files podman-auto-update.timer >/dev/null 2>&1; then
            sudo systemctl stop podman-auto-update.timer podman-auto-update.service
          fi
          ref="$(sed -n 's/^  BOOTC_REF: //p' .github/workflows/image.yml)"
          commit="$(sed -n 's/^  BOOTC_COMMIT: //p' .github/workflows/image.yml)"
          [[ "$ref" =~ ^v[0-9.]+$ && "$commit" =~ ^[0-9a-f]{40}$ ]]
          snapshot="$(sed -n 's/^Snapshot=//p' mkosi/mkosi.conf)"
          [[ "$snapshot" =~ ^([0-9]{4})([0-9]{2})([0-9]{2})T([0-9]{2})([0-9]{2})([0-9]{2})Z$ ]]
          m=("${BASH_REMATCH[@]}")
          if mountpoint -q /mnt; then work=/mnt/work; else work="$HOME/work"; fi
          sudo mkdir -p "$work" && sudo chown "$(id -u):$(id -g)" "$work"
          {
            echo "BOOTC_REF=$ref"
            echo "BOOTC_COMMIT=$commit"
            echo "SNAPSHOT=$snapshot"
            # The image version as in image.yml (year.month.run), with this workflow's run number: it
            # only grows, so arm64 versions compare among themselves (docs/DEFAULTS.md, "Name and version").
            echo "VERSION=${m[1]}.$((10#${m[2]})).$GITHUB_RUN_NUMBER"
            echo "SOURCE_DATE_EPOCH=$(date -u -d "${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}Z" +%s)"
            echo "WORK=$work"
          } >> "$GITHUB_ENV"
          uname -m; nproc; free -h; df -h / "$work"; podman --version

      - &tools
        name: Build the CI tools image (pinned base image for arm64, ci/pinned-images.sh)
        run: |
          ci/pinned-images.sh "$RUNNER_TEMP/pinned-images" debian
          sudo podman build -q --pull=never --from localhost/pinned/debian --build-arg SNAPSHOT="$SNAPSHOT" -t localhost/nyra-tools -f ci/tools.Containerfile ci

      - name: Build bootc from source
        run: |
          mkdir -p ~/cache
          sudo podman run --rm -v ~/cache:/cache -v "$PWD/ci:/ci:ro" \
            -e BOOTC_REF="$BOOTC_REF" -e BOOTC_COMMIT="$BOOTC_COMMIT" -e SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            localhost/nyra-tools bash /ci/build-bootc.sh
          sudo chown -R "$(id -u):$(id -g)" ~/cache
          echo "bootc build $MATRIX_COPY: sha256 $(sha256sum < ~/cache/bootc.tar | cut -d' ' -f1)"
        env:
          MATRIX_COPY: ${{ matrix.copy }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootc-arm64-${{ matrix.copy }}
          path: ~/cache/bootc.tar
          retention-days: 3

  build:
    needs: bootc
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    outputs:
      uki_cert: ${{ steps.image.outputs.uki_cert }}
      image_sha256: ${{ steps.export.outputs.image_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *prepare

      # The only change for aarch64. Any other line of mkosi.conf (outside comments) that names an
      # architecture is a setting this step does not know: the job fails.
      - name: Set the architecture in mkosi.conf (arm64)
        run: |
          sed -i -e 's/^Architecture=x86-64$/Architecture=arm64/' \
            -e 's/^        systemd-boot-efi-amd64-signed$/        systemd-boot-efi-arm64-signed/' \
            -e 's/^        linux-image-amd64$/        linux-image-arm64/' mkosi/mkosi.conf
          git diff mkosi/mkosi.conf
          test "$(git diff --numstat mkosi/mkosi.conf | cut -f1,2)" = "$(printf '3\t3')"
          if grep -nE 'amd64|x86' mkosi/mkosi.conf | grep -v '^[0-9]*:#'; then
            echo "::error::mkosi.conf names another architecture-specific setting"
            exit 1
          fi

      - *tools

      # bootc compiled twice from the same source, on two runners: the two builds must be identical.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bootc-arm64-*
          path: ${{ runner.temp }}/bootc

      - name: bootc, reproducible
        id: bootc
        run: |
          a="$(sha256sum < "$RUNNER_TEMP/bootc/bootc-arm64-1/bootc.tar" | cut -d' ' -f1)"
          b="$(sha256sum < "$RUNNER_TEMP/bootc/bootc-arm64-2/bootc.tar" | cut -d' ' -f1)"
          echo "bootc builds: $a, $b"
          if [ "$a" != "$b" ]; then
            echo "::error::bootc compiled twice from the same source differs: $a, $b"
            exit 1
          fi
          mkdir -p ~/cache && mv "$RUNNER_TEMP/bootc/bootc-arm64-1/bootc.tar" ~/cache/bootc.tar
          echo "BOOTC_SHA256=$a" >> "$GITHUB_ENV"

      - name: Build the root filesystem with mkosi
        run: |
          sudo mkdir -p "$WORK/bootc" "$WORK/out" "$WORK/tmp"
          sudo tar -C "$WORK/bootc" -xf ~/cache/bootc.tar
          mkdir -p ~/cache/mkosi-packages
          sudo podman run --rm --privileged -v "$PWD/mkosi:/src" -v "$WORK:/work" -v ~/cache/mkosi-packages:/packages \
            localhost/nyra-tools mkosi -C /src \
              --output-directory=/work/out --workspace-directory=/work/tmp --package-cache-dir=/packages \
              --extra-tree=/work/bootc:/ --source-date-epoch="$SOURCE_DATE_EPOCH" --force build
          sudo chown -R "$(id -u):$(id -g)" ~/cache/mkosi-packages
          ls -l "$WORK/out"

      - name: Add the bootc layer, the sealed UKI, and lint
        id: image
        run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q --no-install-recommends sbsigntool python3-pefile jq >/dev/null
          id="$(sudo podman pull -q "oci:$WORK/out/nyra-base-rootfs")"
          sudo podman tag "$id" localhost/nyra-base-rootfs:latest
          ci/build-image.sh localhost/nyra-base-rootfs:latest localhost/nyra-base:ci "$WORK/uki" \
            --annotation org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" 2>&1 | tee "$WORK/build.log"
          echo "uki_cert=$(base64 -w0 "$WORK/uki/uki.crt")" >> "$GITHUB_OUTPUT"

      - name: Build again and compare the layers
        run: ci/check-reproducible.sh

      - name: Export the image and the package list
        id: export
        run: |
          mkdir -p dist
          sudo podman save --format oci-archive -o dist/nyra-base.oci.tar localhost/nyra-base:ci
          echo "image_sha256=$(sha256sum < dist/nyra-base.oci.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          cp "$WORK/out/nyra-base-rootfs.manifest" dist/nyra-base-arm64.manifest.json
          cp "$WORK/bootc/usr/share/doc/bootc/Cargo.lock" "dist/bootc-$BOOTC_REF-$BOOTC_COMMIT.Cargo.lock"
          sudo chown -R "$(id -u):$(id -g)" dist
          m=dist/nyra-base-arm64.manifest.json
          {
            echo "## nyra-base (desktop, aarch64)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Debian snapshot | \`$SNAPSHOT\` (unstable, arm64) |"
            echo "| Version | \`$VERSION\` (arm64 run number) |"
            echo "| bootc | $BOOTC_REF (\`$BOOTC_COMMIT\`), two builds identical: sha256 \`$BOOTC_SHA256\` |"
            echo "| Kernel | linux-image-arm64 $(jq -r '.packages[] | select(.name == "linux-image-arm64") | .version' "$m") |"
            echo "| Boot files | shim-signed $(jq -r '.packages[] | select(.name == "shim-signed") | .version' "$m"), systemd-boot-efi-arm64-signed $(jq -r '.packages[] | select(.name == "systemd-boot-efi-arm64-signed") | .version' "$m") |"
            echo "| Packages | $(jq '.packages | length' "$m") Debian packages |"
            echo "| Image | $(sudo podman image inspect -f '{{.Id}}' localhost/nyra-base:ci | cut -c1-12), $(du -h dist/nyra-base.oci.tar | cut -f1) oci-archive, the second build has the same layers |"
            echo
            echo "\`bootc container lint --fatal-warnings\`"
            echo '```'
            sed -n '/bootc container lint/,$p' "$WORK/build.log" | grep -v '^COMMIT\|^-->\|^STEP\|^Successfully\|^[0-9a-f]\{64\}$' | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyra-base-arm64-oci-archive
          path: dist/nyra-base.oci.tar
          retention-days: 7

      - name: Upload the package lists
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyra-base-arm64-packages
          path: |
            dist/nyra-base-arm64.manifest.json
            dist/bootc-*.Cargo.lock
          retention-days: 90

  boot:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *prepare

      - name: KVM on the runner?
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then kvm=true timeout=300; else kvm=false timeout=1800; fi
          echo "kvm=$kvm ($(ls -l /dev/kvm 2>&1))"
          echo "kvm=$kvm" >> "$GITHUB_OUTPUT"
          echo "BOOT_TIMEOUT=$timeout" >> "$GITHUB_ENV"
          {
            echo "## aarch64 runner"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| CPU | $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) CPUs |"
            echo "| Kernel | $(uname -r) |"
            echo "| /dev/kvm | $(ls -l /dev/kvm 2>&1) |"
            echo "| VM tests | $([ "$kvm" = true ] && echo "KVM" || echo "emulated (QEMU TCG), boot timeout ${timeout} s") |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # ipxe-qemu: the virtio NIC's option ROM file, which QEMU must find (only recommended on arm64).
      - name: Install QEMU and edk2 (AAVMF)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-arm qemu-utils qemu-efi-aarch64 ipxe-qemu \
            python3-virt-firmware systemd-ukify sbsigntool python3-pefile
          qemu-system-aarch64 --version | head -1
          ls -l /usr/share/AAVMF

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-arm64-oci-archive
          path: ${{ env.WORK }}/image

      - name: Load the image
        env:
          IMAGE_SHA256: ${{ needs.build.outputs.image_sha256 }}
        run: |
          ci/check-artifact.sh "$WORK/image/nyra-base.oci.tar" "$IMAGE_SHA256"
          sudo podman load -i "$WORK/image/nyra-base.oci.tar"
          rm "$WORK/image/nyra-base.oci.tar"
          digest="$(sudo podman image inspect -f '{{.Digest}}' localhost/nyra-base:ci)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Install to a disk image with bootc
        id: install
        run: |
          tools/vm/install-disk.sh localhost/nyra-base:ci "$WORK"
          tools/vm/test-console.sh localhost/nyra-base:ci "$WORK/disk.raw" "$WORK"
          qemu-img convert -O qcow2 "$WORK/disk.raw" "$WORK/disk.qcow2"
          rm "$WORK/disk.raw"

      # Before any test boots it: the boots below run in snapshot mode, but boot counting writes to a copy.
      - name: The VM disk image for UTM (docs/ARM64.md)
        run: |
          mkdir -p "$WORK/vm"
          qemu-img convert -c -O qcow2 "$WORK/disk.qcow2" "$WORK/vm/nyra-base-arm64.qcow2"
          (cd "$WORK/vm" && sha256sum nyra-base-arm64.qcow2 > nyra-base-arm64.qcow2.sha256)
          qemu-img info "$WORK/vm/nyra-base-arm64.qcow2"
          echo "| VM disk image | nyra-base-arm64.qcow2, $(du -h "$WORK/vm/nyra-base-arm64.qcow2" | cut -f1) (artifact nyra-base-arm64-vm) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the VM disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyra-base-arm64-vm
          path: ${{ env.WORK }}/vm
          compression-level: 0
          retention-days: 14

      - name: Boots without and with Secure Boot (tools/vm/arm64-boot.sh)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          UKI_CERT: ${{ needs.build.outputs.uki_cert }}
        run: |
          base64 -d <<<"$UKI_CERT" > "$RUNNER_TEMP/uki.crt"
          tools/vm/arm64-boot.sh localhost/nyra-base:ci "$IMAGE_DIGEST" "$WORK/disk.qcow2" "$RUNNER_TEMP/uki.crt" \
            "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY" "$BOOT_TIMEOUT"

      # Its boots have the x86_64 timeouts: only with KVM.
      - name: Boot counting across updates (tools/vm/boot-counting.sh)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.kvm.outputs.kvm == 'true' }}
        run: |
          ci/pinned-images.sh "$RUNNER_TEMP/pinned-images" registry
          tools/vm/boot-counting.sh localhost/nyra-base:ci "$IMAGE_DIGEST" "$WORK/disk.qcow2" \
            "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Upload the serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64-serial-log
          path: ${{ runner.temp }}/serial*.log
          if-no-files-found: ignore
          retention-days: 14
