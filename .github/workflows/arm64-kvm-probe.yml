name: arm64-kvm-probe

on:
  pull_request:
    paths:
      - .github/workflows/arm64-kvm-probe.yml

permissions: {}

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Hardware
        run: |
          uname -m; nproc; free -g; df -h /; ls -l /dev/kvm || true; id; lscpu | head -20
      - name: Try KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo apt-get update -qq
            if [ "$(uname -m)" = aarch64 ]; then
              sudo apt-get install -y -qq qemu-system-arm
              sudo chmod 666 /dev/kvm
              timeout 10 qemu-system-aarch64 -M virt -accel kvm -cpu host -nographic -display none -S -monitor none && echo KVM-OK || echo "KVM-RESULT rc=$?"
            else
              sudo apt-get install -y -qq qemu-system-x86
              sudo chmod 666 /dev/kvm
              timeout 10 qemu-system-x86_64 -accel kvm -cpu host -nographic -display none -S -monitor none && echo KVM-OK || echo "KVM-RESULT rc=$?"
            fi
          else
            echo "NO /dev/kvm"
          fi
