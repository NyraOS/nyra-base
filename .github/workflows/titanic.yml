# SPDX-License-Identifier: GPL-3.0-or-later
# The Titanic battery, every night and by hand (docs/TITANIC.md): not on pull requests.
#   image       image.yml: the image built once, then every boot, update and security test of its
#               install-boot-* jobs, on that image, with 20 rounds of the soft reboot network test, and
#               in parallel the disk encryption tests of its encryption-tpm and encryption-other jobs (Titanic T10)
#   power-cuts  power cuts at random moments of an update, on the same image (tools/titanic/power-cuts.sh);
#               the seed is printed and kept in the results
#   stress      on the same image: a full disk during an update and at boot, and the space the system
#               takes across 8 updates in a row (tools/titanic/full-disk.sh); an update under extreme
#               load (tools/titanic/extreme-load.sh); a hostile root: apt, dpkg, an unsigned module,
#               rm -rf / (tools/titanic/hostile-root.sh); the configuration broken by the user, then
#               Restore earlier settings and Reset settings (tools/titanic/broken-config.sh); these two
#               with Secure Boot and image.yml's UKI certificate
#   results     titanic-results.json: one result per test T1-T15 (tools/titanic/results.py), read
#               from this run's steps through the API with the run's own read-only token
# Artifacts: titanic-results, the serial logs (install-boot-system-serial-log, install-boot-updates-serial-log,
# install-boot-updates-more-serial-log, encryption-tpm-serial-log, encryption-other-serial-log,
# titanic-power-cuts-serial-log, titanic-stress-serial-log) and those of image.yml.
name: titanic
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: titanic-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  WORK: /mnt/work
  CUTS: 20
  UPDATES: 8
jobs:
  image:
    uses: ./.github/workflows/image.yml
    # The network across soft reboots, repeated (tools/vm/soft-reboot-network.sh, ~35 s a round).
    with:
      soft-reboot-rounds: "20"
    # What image.yml's jobs declare (GitHub checks them all). id-token is only for its sign and
    # release-sign jobs (the KMS signing of a release), which never run when this workflow calls
    # image.yml (docs/SIGNING.md).
    permissions:
      contents: read
      actions: read
      id-token: write

  # After the image job, also when one of its tests failed: it needs only the image artifact.
  power-cuts:
    needs: image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      seed: ${{ steps.seed.outputs.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in image.yml's build job: no `podman image prune` from the runner during the job.
      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      - name: Pinned base images, cached (ci/pinned-images.sh)
        uses: ./.github/actions/pinned-images
        with:
          images: registry

      - id: seed
        name: Pick the seed
        run: |
          seed=$((RANDOM))
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Power cuts: seed $seed, $CUTS rounds"

      # As in image.yml's install-boot job.
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf systemd-ukify
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-oci-archive
          path: ${{ env.WORK }}

      - name: Load the image and install it to a disk image with bootc
        env:
          IMAGE_SHA256: ${{ needs.image.outputs.image_sha256 }}
        run: |
          ci/check-artifact.sh "$WORK/nyra-base.oci.tar" "$IMAGE_SHA256"
          sudo podman load -i "$WORK/nyra-base.oci.tar"
          rm "$WORK/nyra-base.oci.tar"
          digest="$(sudo podman image inspect -f '{{.Digest}}' localhost/nyra-base:ci)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          tools/vm/install-disk.sh localhost/nyra-base:ci "$WORK"
          tools/vm/test-console.sh localhost/nyra-base:ci "$WORK/disk.raw" "$WORK"
          qemu-img convert -O qcow2 "$WORK/disk.raw" "$WORK/disk.qcow2"
          rm "$WORK/disk.raw"

      - name: Power cuts at random moments (Titanic T2)
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: |
          tools/titanic/power-cuts.sh localhost/nyra-base:ci "$IMAGE_DIGEST" "$WORK/disk.qcow2" \
            "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY" "$CUTS" "$SEED"

      - name: Upload the serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: titanic-power-cuts-serial-log
          path: ${{ runner.temp }}/serial*.log
          if-no-files-found: ignore
          retention-days: 14

  # As power-cuts, in parallel with it.
  stress:
    needs: image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in image.yml's build job: no `podman image prune` from the runner during the job.
      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      - name: Pinned base images, cached (ci/pinned-images.sh)
        uses: ./.github/actions/pinned-images
        with:
          images: registry

      # As in image.yml's install-boot job.
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf systemd-ukify \
            python3-virt-firmware sbsigntool
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-oci-archive
          path: ${{ env.WORK }}

      - name: Load the image and install it to a disk image with bootc
        env:
          IMAGE_SHA256: ${{ needs.image.outputs.image_sha256 }}
        run: |
          ci/check-artifact.sh "$WORK/nyra-base.oci.tar" "$IMAGE_SHA256"
          sudo podman load -i "$WORK/nyra-base.oci.tar"
          rm "$WORK/nyra-base.oci.tar"
          digest="$(sudo podman image inspect -f '{{.Digest}}' localhost/nyra-base:ci)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          tools/vm/install-disk.sh localhost/nyra-base:ci "$WORK"
          tools/vm/test-console.sh localhost/nyra-base:ci "$WORK/disk.raw" "$WORK"
          qemu-img convert -O qcow2 "$WORK/disk.raw" "$WORK/disk.qcow2"
          rm "$WORK/disk.raw"

      - name: Full disk and the space across updates (Titanic T6)
        run: |
          tools/titanic/full-disk.sh localhost/nyra-base:ci "$IMAGE_DIGEST" "$WORK/disk.qcow2" \
            "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY" "$UPDATES"

      - name: An update under extreme load (Titanic T13)
        if: ${{ !cancelled() }}
        run: |
          tools/titanic/extreme-load.sh localhost/nyra-base:ci "$IMAGE_DIGEST" "$WORK/disk.qcow2" \
            "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Hostile root (Titanic T12)
        if: ${{ !cancelled() }}
        env:
          UKI_CERT: ${{ needs.image.outputs.uki_cert }}
        run: |
          base64 -d <<<"$UKI_CERT" > "$RUNNER_TEMP/uki.crt"
          tools/titanic/hostile-root.sh localhost/nyra-base:ci "$WORK/disk.qcow2" "$RUNNER_TEMP/uki.crt" \
            "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Configuration broken by the user (Titanic T8)
        if: ${{ !cancelled() }}
        env:
          UKI_CERT: ${{ needs.image.outputs.uki_cert }}
        run: |
          base64 -d <<<"$UKI_CERT" > "$RUNNER_TEMP/uki.crt"
          tools/titanic/broken-config.sh localhost/nyra-base:ci "$WORK/disk.qcow2" "$RUNNER_TEMP/uki.crt" \
            "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Upload the serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: titanic-stress-serial-log
          path: ${{ runner.temp }}/serial*.log
          if-no-files-found: ignore
          retention-days: 14

  results:
    needs: [image, power-cuts, stress]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write titanic-results.json
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ needs.power-cuts.outputs.seed }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            > "$RUNNER_TEMP/jobs.json"
          python3 -I tools/titanic/results.py "$RUNNER_TEMP/jobs.json" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$SEED" \
            titanic-results.json "$GITHUB_STEP_SUMMARY"

      - name: Upload titanic-results.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: titanic-results
          path: titanic-results.json
          retention-days: 90
