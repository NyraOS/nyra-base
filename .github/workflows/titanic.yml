# SPDX-License-Identifier: GPL-3.0-or-later
# The Titanic battery, every night and by hand (docs/TITANIC.md): not on pull requests.
#   image       image.yml: the image built once, then every boot, update and security test of its
#               install-boot job, on that image, with 20 rounds of the soft reboot network test
#   power-cuts  power cuts at random moments of an update, on the same image (tools/titanic/power-cuts.sh);
#               the seed is printed and kept in the results
#   full-disk   a full disk during an update and at boot, and the space the system takes across 8
#               updates in a row, on the same image (tools/titanic/full-disk.sh)
#   results     titanic-results.json: one result per test T1-T15 (tools/titanic/results.py), read
#               from this run's steps through the API with the run's own read-only token
# Artifacts: titanic-results, the serial logs (install-boot-serial-log, titanic-power-cuts-serial-log,
# titanic-full-disk-serial-log) and those of image.yml.
name: titanic
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: titanic-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  WORK: /mnt/work
  CUTS: 20
  UPDATES: 8
jobs:
  image:
    uses: ./.github/workflows/image.yml
    # The network across soft reboots, repeated (tools/vm/soft-reboot-network.sh, ~35 s a round).
    with:
      soft-reboot-rounds: "20"
    # What image.yml's jobs declare (GitHub checks them all). id-token is only for its sign job, which
    # never runs when this workflow calls image.yml (docs/SIGNING.md).
    permissions:
      contents: read
      actions: read
      id-token: write

  # After the image job, also when one of its tests failed: it needs only the image artifact.
  power-cuts:
    needs: image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      seed: ${{ steps.seed.outputs.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: seed
        name: Pick the seed
        run: |
          seed=$((RANDOM))
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Power cuts: seed $seed, $CUTS rounds"

      # As in image.yml's install-boot job.
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf systemd-ukify
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nyra-base-oci-archive
          path: ${{ env.WORK }}

      - name: Load the image and install it to a disk image with bootc
        run: |
          sudo podman load -i "$WORK/nyra-base.oci.tar"
          rm "$WORK/nyra-base.oci.tar"
          digest="$(sudo podman image inspect -f '{{.Digest}}' localhost/nyra-base:ci)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          truncate -s 12G "$WORK/disk.raw"
          sudo podman run --rm --privileged --pid=host \
            -v /dev:/dev -v /var/lib/containers:/var/lib/containers -v "$WORK:/output" \
            localhost/nyra-base:ci \
            bootc install to-disk --composefs-backend --bootloader systemd --filesystem ext4 \
              --wipe --via-loopback /output/disk.raw
          loop="$(sudo losetup -P --show -f "$WORK/disk.raw")"
          for p in "$loop"p*; do [ "$(sudo blkid -o value -s TYPE "$p")" = vfat ] && esp="$p"; done
          mkdir -p "$WORK/esp" && sudo mount "$esp" "$WORK/esp"
          sudo podman run --rm --network none -v "$WORK/esp:/esp" localhost/nyra-base:ci \
            /usr/lib/nyra/boot/esp-sync install /esp
          sudo umount "$WORK/esp" && sudo losetup -d "$loop"
          sudo chown "$(id -u):$(id -g)" "$WORK/disk.raw"
          tools/vm/test-console.sh localhost/nyra-base:ci "$WORK/disk.raw" "$WORK"
          qemu-img convert -O qcow2 "$WORK/disk.raw" "$WORK/disk.qcow2"
          rm "$WORK/disk.raw"

      - name: Power cuts at random moments (Titanic T2)
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: |
          tools/titanic/power-cuts.sh localhost/nyra-base:ci "$IMAGE_DIGEST" "$WORK/disk.qcow2" \
            "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY" "$CUTS" "$SEED"

      - name: Upload the serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: titanic-power-cuts-serial-log
          path: ${{ runner.temp }}/serial*.log
          if-no-files-found: ignore
          retention-days: 14

  # As power-cuts, in parallel with it.
  full-disk:
    needs: image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in image.yml's install-boot job.
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf systemd-ukify
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nyra-base-oci-archive
          path: ${{ env.WORK }}

      - name: Load the image and install it to a disk image with bootc
        run: |
          sudo podman load -i "$WORK/nyra-base.oci.tar"
          rm "$WORK/nyra-base.oci.tar"
          digest="$(sudo podman image inspect -f '{{.Digest}}' localhost/nyra-base:ci)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          truncate -s 12G "$WORK/disk.raw"
          sudo podman run --rm --privileged --pid=host \
            -v /dev:/dev -v /var/lib/containers:/var/lib/containers -v "$WORK:/output" \
            localhost/nyra-base:ci \
            bootc install to-disk --composefs-backend --bootloader systemd --filesystem ext4 \
              --wipe --via-loopback /output/disk.raw
          loop="$(sudo losetup -P --show -f "$WORK/disk.raw")"
          for p in "$loop"p*; do [ "$(sudo blkid -o value -s TYPE "$p")" = vfat ] && esp="$p"; done
          mkdir -p "$WORK/esp" && sudo mount "$esp" "$WORK/esp"
          sudo podman run --rm --network none -v "$WORK/esp:/esp" localhost/nyra-base:ci \
            /usr/lib/nyra/boot/esp-sync install /esp
          sudo umount "$WORK/esp" && sudo losetup -d "$loop"
          sudo chown "$(id -u):$(id -g)" "$WORK/disk.raw"
          tools/vm/test-console.sh localhost/nyra-base:ci "$WORK/disk.raw" "$WORK"
          qemu-img convert -O qcow2 "$WORK/disk.raw" "$WORK/disk.qcow2"
          rm "$WORK/disk.raw"

      - name: Full disk and the space across updates (Titanic T6)
        run: |
          tools/titanic/full-disk.sh localhost/nyra-base:ci "$IMAGE_DIGEST" "$WORK/disk.qcow2" \
            "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY" "$UPDATES"

      - name: Upload the serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: titanic-full-disk-serial-log
          path: ${{ runner.temp }}/serial*.log
          if-no-files-found: ignore
          retention-days: 14

  results:
    needs: [image, power-cuts, full-disk]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write titanic-results.json
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ needs.power-cuts.outputs.seed }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            > "$RUNNER_TEMP/jobs.json"
          python3 -I tools/titanic/results.py "$RUNNER_TEMP/jobs.json" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$SEED" \
            titanic-results.json "$GITHUB_STEP_SUMMARY"

      - name: Upload titanic-results.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: titanic-results
          path: titanic-results.json
          retention-days: 90
