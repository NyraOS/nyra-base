          tools/vm/test-console.sh localhost/nyra-base:ci "$WORK/disk.raw" "$WORK"
          qemu-img convert -O qcow2 "$WORK/disk.raw" "$WORK/disk.qcow2"
          rm "$WORK/disk.raw"

      - name: Version jumps and channels, Titanic T11 (docs/UPDATES.md)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 30
        run: tools/vm/channels.sh localhost/nyra-base:ci "$WORK/disk.qcow2" "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: A version that breaks the network, Titanic T3 (docs/UPDATES.md)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 30
        run: tools/vm/network-health.sh localhost/nyra-base:ci "$WORK/disk.qcow2" "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

