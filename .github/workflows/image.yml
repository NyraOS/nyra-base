          path: ${{ runner.temp }}/serial*.log
          if-no-files-found: ignore
          retention-days: 14

  # The required check: it passes only when the three jobs above passed, and is skipped, like they
  # are, when build is skipped. Without this job, GitHub counts a job skipped because a needed one
  # failed as passed. tools/titanic/results.py reads the steps of the three jobs, not this one.
  install-boot:
    needs: [build, install-boot-system, install-boot-updates, install-boot-updates-more]
