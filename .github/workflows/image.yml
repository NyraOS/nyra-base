          RESULTS: ${{ needs.install-boot-system.result }} ${{ needs.install-boot-updates.result }} ${{ needs.install-boot-updates-more.result }}
        run: |
          echo "install-boot-system, install-boot-updates, install-boot-updates-more: $RESULTS"
          [ "$RESULTS" = "success success success" ]

  # Titanic T10, disk encryption (docs/BOOT.md, "Disk encryption"): every step installs the image on a
  # disk of its own and shares nothing with the others (each script has its own directory under
  # $WORK), so the steps are split into two jobs, encryption-other here and encryption-tpm after it,
  # that run in parallel with install-boot from the same image artifact, and a last job, encryption,
  # that needs them (the required check). Same security notes as install-boot: GitHub-hosted runners only.
  encryption-other:
    needs: [build, release-image]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build.outputs.release != 'true' || needs.release-image.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in image.yml's build job: no `podman image prune` from the runner during the job.
      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      # The registry of the rotation and update tests (tools/signing/local-registry.sh).
      - name: Pinned base images, cached (ci/pinned-images.sh)
        uses: ./.github/actions/pinned-images
        with:
          images: registry

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf \
            python3-virt-firmware systemd-ukify sbsigntool swtpm python3-pefile
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.release == 'true' && 'nyra-base-release-oci-archive' || 'nyra-base-oci-archive' }}
          path: ${{ env.WORK }}

      - name: Load the image
        id: load
        env:
          RELEASE: ${{ needs.build.outputs.release }}
          IMAGE_SHA256: ${{ needs.build.outputs.image_sha256 }}
          RELEASE_IMAGE_SHA256: ${{ needs.release-image.outputs.image_sha256 }}
        run: |
          # The artifact and its hash come from the same job: release-image's on a release, else build's.
          [ "$RELEASE" != true ] || IMAGE_SHA256="$RELEASE_IMAGE_SHA256"
          ci/check-artifact.sh "$WORK/nyra-base.oci.tar" "$IMAGE_SHA256"
          sudo podman load -i "$WORK/nyra-base.oci.tar"
          rm "$WORK/nyra-base.oci.tar"

      # Titanic T10 without a TPM (docs/BOOT.md, "Disk encryption"): its own disk, installed on LUKS2
      # with a password and a recovery key as the installer does it (tools/vm/install-encrypted.sh);
      # the password and the recovery key unlock it in the initrd, a wrong password is asked again,
      # neither secret is in the logs or on the disk outside LUKS. It needs only the loaded image.
      - name: Disk encryption without a TPM, Titanic T10 (docs/BOOT.md)
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        timeout-minutes: 30
        run: tools/vm/encryption.sh localhost/nyra-base:ci "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      # Titanic T10, the rotation of the TPM policy key with a PIN (docs/BOOT.md, "Rotating the policy
      # key"; the same script as the rotation in encryption-tpm): test versions signed with policy keys
      # made in this step (deleted once they are built), installed on their own disk for a TPM and
      # switched between through a registry on the runner. The PIN is set before the rotation: the
      # next key enrolled with the PIN typed at the rotated release's first boot, and a new PIN chosen
      # when the disk is enrolled again.
      - name: Rotation of the TPM policy key with a PIN, Titanic T10 (docs/BOOT.md)
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        timeout-minutes: 40
        run: tools/vm/encryption-rotation.sh localhost/nyra-base:ci "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY" pin

      # Titanic T10, updates through nyra-updated on an encrypted disk (docs/BOOT.md, "Disk encryption";
      # docs/UPDATES.md): test versions signed with keys made in this step (policy key, Secure Boot MOK,
      # channel sheet, sigstore), installed for a TPM on their own disk and served as updates.nyraos.com
      # from the runner: N to N+1 through a signed sheet, back to N by hand, and a version whose health
      # check fails falls back to N, every boot unlocked by the TPM, the recovery key never asked.
      - name: Updates through nyra-updated on an encrypted disk, Titanic T10 (docs/BOOT.md)
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        timeout-minutes: 40
        run: tools/vm/encryption-updates.sh localhost/nyra-base:ci "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      # Titanic T10, a disk installed for a TPM whose first boot finds no TPM, or Secure Boot off (each
      # on its own disk): the recovery key unlocks it, nothing is enrolled and the temporary enrollment
      # goes; with the TPM and Secure Boot back, the recovery key once, then it is enrolled.
      - name: First boot without a TPM or with Secure Boot off, Titanic T10 (docs/BOOT.md)
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
