      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.release == 'true' && 'nyra-base-release-oci-archive' || 'nyra-base-oci-archive' }}
          path: ${{ env.WORK }}

      - name: Load the image
        id: load
