            "$GITHUB_STEP_SUMMARY"

      - name: Upload the serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encryption-other-serial-log
          path: ${{ runner.temp }}/serial*.log
          if-no-files-found: ignore
          retention-days: 14

  # The verified pull and the install from the image it pulled (tools/install/verified-pull.sh,
  # docs/UPDATES.md, "Moving a machine"): the script's refusals and its pull against a registry on the
  # runner that answers as updates.nyraos.com, then bootc install --target-imgref from the image ID,
  # two boots and a bootc switch. No secret: the test images are signed with a key made for the run.
  verified-pull:
    needs: [build, release-image]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build.outputs.release != 'true' || needs.release-image.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in image.yml's build job: no `podman image prune` from the runner during the job.
      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      # The registry of the test (tools/signing/local-registry.sh).
      - name: Pinned base images, cached (ci/pinned-images.sh)
        uses: ./.github/actions/pinned-images
        with:
          images: registry

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf \
            python3-virt-firmware systemd-ukify sbsigntool python3-pefile
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.release == 'true' && 'nyra-base-release-oci-archive' || 'nyra-base-oci-archive' }}
          path: ${{ env.WORK }}

      - name: Load the image
        id: load
        env:
          RELEASE: ${{ needs.build.outputs.release }}
          IMAGE_SHA256: ${{ needs.build.outputs.image_sha256 }}
          RELEASE_IMAGE_SHA256: ${{ needs.release-image.outputs.image_sha256 }}
        run: |
          # The artifact and its hash come from the same job: release-image's on a release, else build's.
          [ "$RELEASE" != true ] || IMAGE_SHA256="$RELEASE_IMAGE_SHA256"
          ci/check-artifact.sh "$WORK/nyra-base.oci.tar" "$IMAGE_SHA256"
          sudo podman load -q -i "$WORK/nyra-base.oci.tar"
          rm "$WORK/nyra-base.oci.tar"

      - name: Verified pull, install from the image ID, boot and switch (docs/UPDATES.md)
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        timeout-minutes: 30
        run: tools/install/test-verified-pull.sh localhost/nyra-base:ci "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Upload the serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-pull-serial-log
          path: ${{ runner.temp }}/serial*.log
          if-no-files-found: ignore
          retention-days: 14

  # The same setup as encryption-other, then the TPM steps: about 20 min of tests, against about 22
  # in encryption-other, so the two jobs end at about the same time.
  encryption-tpm:
    needs: [build, release-image]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build.outputs.release != 'true' || needs.release-image.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in image.yml's build job: no `podman image prune` from the runner during the job.
      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      # The registry of the rotation test (tools/signing/local-registry.sh).
      - name: Pinned base images, cached (ci/pinned-images.sh)
        uses: ./.github/actions/pinned-images
        with:
          images: registry

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf \
            python3-virt-firmware systemd-ukify sbsigntool swtpm python3-pefile
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.release == 'true' && 'nyra-base-release-oci-archive' || 'nyra-base-oci-archive' }}
          path: ${{ env.WORK }}

      - name: Load the image
        id: load
        env:
          RELEASE: ${{ needs.build.outputs.release }}
          IMAGE_SHA256: ${{ needs.build.outputs.image_sha256 }}
          RELEASE_IMAGE_SHA256: ${{ needs.release-image.outputs.image_sha256 }}
        run: |
          # The artifact and its hash come from the same job: release-image's on a release, else build's.
          [ "$RELEASE" != true ] || IMAGE_SHA256="$RELEASE_IMAGE_SHA256"
          ci/check-artifact.sh "$WORK/nyra-base.oci.tar" "$IMAGE_SHA256"
          sudo podman load -i "$WORK/nyra-base.oci.tar"
          rm "$WORK/nyra-base.oci.tar"

      # Titanic T10 with a TPM (docs/BOOT.md, "Disk encryption"): its own disk, installed for a TPM
      # (a recovery key and a temporary TPM2 enrollment in the VM's swtpm), booted with Secure Boot:
      # the first boot unlocks by itself and its initrd enrolls the disk with the signed PCR policy,
      # the next boots unlock by themselves, without the TPM the recovery key unlocks it, and after
      # the TPM refused (PCR 7, PCR 12, a new TPM) the recovery key unlocks it and it is enrolled
      # again, never with Secure Boot off or an add-on measured.
      - name: Disk encryption with a TPM, Titanic T10 (docs/BOOT.md)
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        timeout-minutes: 50
        env:
          UKI_CERT: ${{ needs.build.outputs.uki_cert }}
        run: |
          base64 -d <<<"$UKI_CERT" > "$RUNNER_TEMP/uki.crt"
          tools/vm/encryption-tpm.sh localhost/nyra-base:ci "$RUNNER_TEMP/uki.crt" "$WORK" "$RUNNER_TEMP" \
            "$GITHUB_STEP_SUMMARY"

      # Titanic T10, the rotation of the TPM policy key (docs/BOOT.md, "Rotating the policy key"): test
      # versions signed with policy keys made in this step (deleted once they are built), installed on
      # their own disk for a TPM and switched between through a registry on the runner: the next key
      # enrolled in advance, the old one removed only once the rotated release is confirmed good, a
      # fallback before that unlocks by itself and after it asks for the recovery key, and a machine
      # that missed a rotation asks once, then is enrolled again.
      - name: Rotation of the TPM policy key, Titanic T10 (docs/BOOT.md)
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        timeout-minutes: 40
        run: tools/vm/encryption-rotation.sh localhost/nyra-base:ci "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      # Titanic T10, the TPM2 PIN (docs/BOOT.md, "Disk encryption"): its own disk, installed for a TPM;
      # a PIN asked for from the running system is enrolled at the next boot, a wrong PIN is asked again,
      # an empty one and a TPM locked by wrong ones lead to the recovery key, which unlocks the disk; the
      # PIN changed and removed; after the TPM refused, a new PIN is chosen in the initrd, never none.
      - name: Disk encryption with a TPM PIN, Titanic T10 (docs/BOOT.md)
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        timeout-minutes: 50
        env:
          UKI_CERT: ${{ needs.build.outputs.uki_cert }}
        run: |
          base64 -d <<<"$UKI_CERT" > "$RUNNER_TEMP/uki.crt"
          tools/vm/encryption-pin.sh localhost/nyra-base:ci "$RUNNER_TEMP/uki.crt" "$WORK" "$RUNNER_TEMP" \
            "$GITHUB_STEP_SUMMARY"

      - name: Upload the serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encryption-tpm-serial-log
          path: ${{ runner.temp }}/serial*.log
          if-no-files-found: ignore
          retention-days: 14

  # The required check (Titanic reads its name): passes only when the two jobs above passed, and is
  # skipped, like they are, when build is skipped (see install-boot). tools/titanic/results.py reads
  # the steps of the two jobs, not this one.
  encryption:
    needs: [build, encryption-tpm, encryption-other]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every encryption job succeeded
        env:
          RESULTS: ${{ needs.encryption-tpm.result }} ${{ needs.encryption-other.result }}
        run: |
          echo "encryption-tpm, encryption-other: $RESULTS"
          [ "$RESULTS" = "success success" ]

  # On request only (boot-rounds): the installed disk booted many times under Secure Boot on several
  # runners, to find boots that fail only now and then (tools/vm/boot-repeat.sh). Same security
  # notes as install-boot: GitHub-hosted runners only.
  boot-repeat:
    needs: [build, release-image]
    if: ${{ inputs.boot-rounds != '' && inputs.boot-rounds != '0' && !cancelled() && needs.build.result == 'success' && (needs.build.outputs.release != 'true' || needs.release-image.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in image.yml's build job: no `podman image prune` from the runner during the job.
      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf \
            python3-virt-firmware systemd-ukify sbsigntool
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.release == 'true' && 'nyra-base-release-oci-archive' || 'nyra-base-oci-archive' }}
          path: ${{ env.WORK }}

      - name: Load the image and install it to a disk image
        env:
          RELEASE: ${{ needs.build.outputs.release }}
          IMAGE_SHA256: ${{ needs.build.outputs.image_sha256 }}
          RELEASE_IMAGE_SHA256: ${{ needs.release-image.outputs.image_sha256 }}
        run: |
          # The artifact and its hash come from the same job: release-image's on a release, else build's.
          [ "$RELEASE" != true ] || IMAGE_SHA256="$RELEASE_IMAGE_SHA256"
          ci/check-artifact.sh "$WORK/nyra-base.oci.tar" "$IMAGE_SHA256"
          sudo podman load -i "$WORK/nyra-base.oci.tar"
          rm "$WORK/nyra-base.oci.tar"
          tools/vm/install-disk.sh localhost/nyra-base:ci "$WORK"

      - name: Repeated boots
        env:
          UKI_CERT: ${{ needs.build.outputs.uki_cert }}
          ROUNDS: ${{ inputs.boot-rounds }}
        run: |
          base64 -d <<<"$UKI_CERT" > "$RUNNER_TEMP/uki.crt"
          tools/vm/boot-repeat.sh localhost/nyra-base:ci "$WORK/disk.raw" "$RUNNER_TEMP/uki.crt" "$WORK" "$RUNNER_TEMP" \
            "$GITHUB_STEP_SUMMARY" "$ROUNDS"

      - name: Upload the serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-repeat-serial-log-${{ matrix.runner }}
          path: ${{ runner.temp }}/serial*.log
          if-no-files-found: ignore
          retention-days: 14

  # Keyless signing (docs/SIGNING.md): GitHub OIDC -> Google Workload Identity Federation ->
  # an ID token of the signer service account -> a short-lived Fulcio certificate for its
  # e-mail address -> signature recorded in Rekor. No key exists anywhere. Only release builds
  # on GitHub-hosted runners are signed; the job is skipped until the repository variables
  # GCP_WIF_PROVIDER and GCP_SIGNER_SA are set. Only this job and release-sign (both with
  # id-token: write) can request an OIDC token.
  # It refuses an image whose UKI is not signed with the committed Nyra certificate (UKI release gate).
  # Two compiles of the same bootc source must be identical: the release's (build) and the one cached
  # on main (bootc-cache.yml). The release job never unpacks a cache, so the cached build is unpacked
  # here, on a runner of its own, without permissions and without the repository; sign needs it.
  # The jobs after it check the image artifact against build's output (ci/check-artifact.sh).
  bootc-reproducible:
    needs: build
    if: github.workflow == 'image' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      # Only a build cached before this run: one this run saved (none was cached) is its own.
      - name: Restore the bootc build cached on main
        id: cache
        if: needs.build.outputs.bootc_cached == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cache/bootc.tar
          key: ${{ needs.build.outputs.bootc_key }}

      - name: Compare it with the release's bootc
        env:
          HIT: ${{ steps.cache.outputs.cache-hit }}
          RELEASE_SHA256: ${{ needs.build.outputs.bootc_sha256 }}
        run: |
          if ! [[ "$RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::build reported no sha256 of its bootc build ('$RELEASE_SHA256')."
            exit 1
          fi
          if [ "$HIT" != true ]; then
            echo "::notice::No cached bootc build for this key, nothing to compare."
            exit 0
          fi
          cached="$(sha256sum < ~/cache/bootc.tar | cut -d' ' -f1)"
          if [ "$cached" != "$RELEASE_SHA256" ]; then
            echo "::error::bootc compiled from the same source differs from the build cached on main: release $RELEASE_SHA256, cached $cached."
            exit 1
          fi
          echo "Reproducible: the release's bootc build is identical to the cached one ($cached)."

  sign:
    needs: [build, release-image, install-boot, encryption, bootc-reproducible]
    # github.workflow == 'image': never when titanic.yml calls this workflow.
    # release-image is skipped unless this is a release, so the explicit status checks.
    if: >-
      ${{ !cancelled() && github.workflow == 'image' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SIGNER_SA != ''
      && needs.build.result == 'success' && needs.install-boot.result == 'success' && needs.encryption.result == 'success'
      && needs.bootc-reproducible.result == 'success'
      && (needs.build.outputs.release != 'true' || needs.release-image.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # What the publish job publishes, checked there against the artifacts (never read from them).
    outputs:
      image_digest: ${{ steps.export.outputs.image_digest }}
      signature_digest: ${{ steps.export.outputs.signature_digest }}
    env:
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
      REPO: updates.nyraos.com/nyra-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in image.yml's build job: no `podman image prune` from the runner during the job.
      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      - name: Pinned base images, cached (ci/pinned-images.sh)
        uses: ./.github/actions/pinned-images
        with:
          images: registry

      - name: Check that the shipped policy trusts this signer
        env:
          SIGNER: ${{ vars.GCP_SIGNER_SA }}
        run: |
          policy=files/usr/lib/nyra/containers/policy.json
          trusted="$(jq -r '.transports.docker["updates.nyraos.com"][0].fulcio.subjectEmail' "$policy")"
          if [ "$trusted" != "$SIGNER" ]; then
            echo "::error::$policy trusts $trusted, but CI would sign as $SIGNER. Commit the signer address to the policy first (docs/SIGNING.md)."
            exit 1
          fi
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.release == 'true' && 'nyra-base-release-oci-archive' || 'nyra-base-oci-archive' }}
          path: ${{ env.WORK }}

      - name: Load the image and push it to the local registry (as updates.nyraos.com)
        env:
          RELEASE: ${{ needs.build.outputs.release }}
          IMAGE_SHA256: ${{ needs.build.outputs.image_sha256 }}
          RELEASE_IMAGE_SHA256: ${{ needs.release-image.outputs.image_sha256 }}
        run: |
          # The artifact and its hash come from the same job: release-image's on a release, else build's.
          [ "$RELEASE" != true ] || IMAGE_SHA256="$RELEASE_IMAGE_SHA256"
          ci/check-artifact.sh "$WORK/nyra-base.oci.tar" "$IMAGE_SHA256"
          tools/signing/local-registry.sh "$WORK"
          sudo podman load -q -i "$WORK/nyra-base.oci.tar"
          sudo podman run --rm --network host --tmpfs /var/tmp -v "$WORK:/w" localhost/nyra-base:ci \
            skopeo copy --dest-tls-verify=false --preserve-digests --digestfile /w/digest \
              oci-archive:/w/nyra-base.oci.tar "docker://$REPO:ci"
          digest="$(cat "$WORK/digest")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          rm "$WORK/nyra-base.oci.tar"

      # Before anything is signed: the image's /boot holds exactly one UKI, the sealed one
      # (ci/uki-cmdline.txt), with its main profile's PCR policy signed by the Nyra policy key and the
      # whole file signed with the Nyra certificate, both committed here. Until a release UKI is signed
      # with the Nyra key and its PCR policy with pcr-policy-1, every image is refused (docs/SIGNING.md).
      - name: UKI release gate (signed with the committed Nyra certificate)
        run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q --no-install-recommends sbsigntool python3-pefile >/dev/null
          cid="$(sudo podman create -q localhost/nyra-base:ci)"
          sudo podman cp "$cid:/boot" "$WORK/boot"
          sudo podman cp "$cid:/usr/lib/nyra/secureboot/tpm2-pcr-public-key-next.pem" "$WORK/image-next.pem"
          sudo podman cp "$cid:/usr/lib/nyra/secureboot/tpm2-pcr-retired-keys" "$WORK/image-retired"
          sudo podman rm -f "$cid" >/dev/null
          sudo chown -R "$(id -u):$(id -g)" "$WORK/boot" "$WORK/image-next.pem" "$WORK/image-retired"
          tools/signing/uki-gate.sh "$WORK/boot" files/usr/lib/nyra/secureboot/nyra.crt \
            files/usr/lib/nyra/secureboot/tpm2-pcr-public-key.pem \
            files/usr/lib/nyra/secureboot/tpm2-pcr-public-key-next.pem "$WORK/image-next.pem" \
            files/usr/lib/nyra/secureboot/tpm2-pcr-retired-keys "$WORK/image-retired"

      - name: Install cosign
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/cosign" /usr/local/bin/cosign
          cosign version

      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SIGNER_SA }}
          token_format: id_token
          id_token_audience: sigstore
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      # The old signature format (a sha256-<digest>.sig tag with the Rekor v1 SET) is the only one
      # containers/image (bootc, podman, skopeo) verifies; cosign 3 defaults to the new bundle.
      - name: Sign the image
        env:
          ID_TOKEN: ${{ steps.google.outputs.id_token }}
        run: |
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            --fulcio-url https://fulcio.sigstore.dev --rekor-url https://rekor.sigstore.dev \
            --identity-token "$ID_TOKEN" --allow-http-registry "$REPO@$IMAGE_DIGEST"

      - name: Verify with the shipped policy
        run: tools/signing/test-policy.sh localhost/nyra-base:ci "$WORK" "$IMAGE_DIGEST"

      # For publishing (the publish job, docs/SIGNING.md): the signature as an OCI layout, tagged as on
      # the registry. The image itself is the nyra-base-oci-archive artifact (same manifest digest); on
      # a release it is nyra-base-release-oci-archive, kept for 1 day only.
      - name: Export the signature
        id: export
        env:
          SIGNER: ${{ vars.GCP_SIGNER_SA }}
        run: |
          sig="${IMAGE_DIGEST/:/-}.sig"
          mkdir -p dist
          sudo podman run --rm --network host --tmpfs /var/tmp -v "$PWD/dist:/w" localhost/nyra-base:ci \
            skopeo copy --insecure-policy --preserve-digests "docker://$REPO:$sig" "oci:/w/signature:$sig"
          sudo chown -R "$(id -u):$(id -g)" dist
          # The layout holds exactly one manifest: this signature, with its digest and tag name.
          signature_digest="$(jq -er --arg ref "$sig" '
            .manifests | select(length == 1) | .[0]
            | select(.annotations["org.opencontainers.image.ref.name"] == $ref) | .digest' dist/signature/index.json)"
          [[ "$signature_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [ "$(sha256sum < "dist/signature/blobs/sha256/${signature_digest#sha256:}" | cut -d' ' -f1)" = "${signature_digest#sha256:}" ]
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "signature_digest=$signature_digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE_DIGEST" > dist/image-digest
          {
            echo "## Signed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$REPO@$IMAGE_DIGEST\` |"
            echo "| Signer | \`$SIGNER\` (keyless, Fulcio + Rekor) |"
            echo "| Signature | \`$REPO:$sig\` (artifact nyra-base-signature) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyra-base-signature
          path: dist
          retention-days: 14

  # Publishing to updates.nyraos.com (docs/SIGNING.md, "Publishing"), off unless the repository
  # variable PUBLISH_ENABLED is `on`. The only job with the R2 and Cloudflare secrets, which live in the
  # environment `publish` (main only, reviewed by the owner) and nowhere else; it has no id-token, runs
  # no image code (no podman, nothing from the image) and reads every value it publishes from a job
  # output, never from an artifact. ci/check-publish-job.py keeps these invariants.
  publish:
    needs: [build, release-image, sign]
    if: >-
      ${{ !cancelled() && github.workflow == 'image' && needs.build.outputs.release == 'true'
      && needs.sign.result == 'success' && vars.PUBLISH_ENABLED == 'on' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: publish
    permissions:
      contents: read
    concurrency:
      group: publish-nyra-base
      cancel-in-progress: false
    env:
      # The nyra-updates commit whose registry/scripts/publish-image.sh runs next to the tokens. It
      # moves only by a reviewed pull request that reads the nyra-updates diff from the old pin to the
      # new one (Dependabot does not move it).
      UPDATES_PIN: 097f78040352b7570bb99548771b50cc107993e5
    steps:
      # The workspace: nyra-base, for ci/check-artifact.sh. Nothing from the artifacts goes into it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # nyra-updates is public: no token. actions/checkout cannot place a repository outside the
      # workspace, so plain git, into its own directory under the runner's temp. The commit is fetched
      # as part of main's history: GitHub serves a commit by its SHA from every fork of the network, so
      # a pin that is not an ancestor of main is refused.
      - name: Fetch nyra-updates at the pinned commit, which must be on its main
        run: |
          [[ "$UPDATES_PIN" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::UPDATES_PIN is not a 40-hex commit"; exit 1; }
          updates="$RUNNER_TEMP/updates"
          git init -q "$updates"
          git -C "$updates" remote add origin https://github.com/NyraOS/nyra-updates.git
          git -C "$updates" fetch --no-tags origin main
          git -C "$updates" merge-base --is-ancestor "$UPDATES_PIN" FETCH_HEAD || {
            echo "::error::$UPDATES_PIN is not on the main branch of NyraOS/nyra-updates"; exit 1; }
          git -C "$updates" -c advice.detachedHead=false checkout -q "$UPDATES_PIN"
          [ "$(git -C "$updates" rev-parse HEAD)" = "$UPDATES_PIN" ]

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-release-oci-archive
          path: ${{ runner.temp }}/image-download

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-signature
          path: ${{ runner.temp }}/signature-download

      # What is downloaded is data. It is unpacked by tar and read by jq and sha256sum, never run, and
      # every value that names a digest, a tag or a version comes from a job output.
      - name: Check the image and the signature against the jobs that made them
        env:
          IMAGE_SHA256: ${{ needs.release-image.outputs.image_sha256 }}
          IMAGE_DIGEST: ${{ needs.sign.outputs.image_digest }}
          SIGNATURE_DIGEST: ${{ needs.sign.outputs.signature_digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          die() { echo "::error::$*" >&2; exit 1; }
          digest_re='^sha256:[0-9a-f]{64}$'
          version_re='^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$'
          [[ "$IMAGE_DIGEST" =~ $digest_re ]] || die "sign: no image digest ('$IMAGE_DIGEST')"
          [[ "$SIGNATURE_DIGEST" =~ $digest_re ]] || die "sign: no signature digest ('$SIGNATURE_DIGEST')"
          [[ "$VERSION" =~ $version_re ]] || die "build: no release version ('$VERSION')"
          sig_tag="${IMAGE_DIGEST/:/-}.sig"

          # a. The archive is the file release-image made (and the only one in its directory).
          ci/check-artifact.sh "$RUNNER_TEMP/image-download/nyra-base.oci.tar" "$IMAGE_SHA256"

          # b. podman's oci-archive is an OCI layout in a tar: unpacked into an empty directory, as no
          # one, with no image code.
          image="$RUNNER_TEMP/image-layout"
          mkdir "$image"
          tar -x --no-same-owner --no-same-permissions -f "$RUNNER_TEMP/image-download/nyra-base.oci.tar" -C "$image"
          signature="$RUNNER_TEMP/signature-download/signature"
          for layout in "$image" "$signature"; do
            [ -z "$(find "$layout" ! -type f ! -type d -print -quit)" ] || die "$layout holds more than files and directories"
            [ -f "$layout/index.json" ] && [ ! -L "$layout/index.json" ] || die "$layout/index.json is not a regular file"
          done

          # blob LAYOUT DIGEST: the path of a blob of the layout, whose content has that digest.
          blob() {
            local file="$1/blobs/sha256/${2#sha256:}"
            [[ "$2" =~ $digest_re ]] && [ -f "$file" ] && [ ! -L "$file" ] || die "no blob '$2' in $1"
            [ "$(sha256sum < "$file" | cut -d' ' -f1)" = "${2#sha256:}" ] || die "blob $2 of $1 does not match its digest"
            echo "$file"
          }

          # c. The image layout has one manifest, the one sign signed.
          [ "$(jq -er '.manifests | select(length == 1) | .[0].digest' "$image/index.json")" = "$IMAGE_DIGEST" ] ||
            die "the image layout is not exactly the manifest $IMAGE_DIGEST that sign signed"
          manifest="$(blob "$image" "$IMAGE_DIGEST")"

          # d. The signature layout has one manifest, the one sign exported, tagged as the registry expects (e).
          [ "$(jq -er --arg ref "$sig_tag" '.manifests | select(length == 1) | .[0]
                | select(.annotations["org.opencontainers.image.ref.name"] == $ref) | .digest' "$signature/index.json")" = "$SIGNATURE_DIGEST" ] ||
            die "the signature layout is not exactly the manifest $SIGNATURE_DIGEST that sign exported as $sig_tag"
          blob "$signature" "$SIGNATURE_DIGEST" >/dev/null

          # f. The signed content says which version and commit this is, so a tag that is re-pointed to
          # another image shows (bootc reports the label).
          config="$(blob "$image" "$(jq -er '.config.digest' "$manifest")")"
          [ "$(jq -r '.config.Labels["org.opencontainers.image.version"] // ""' "$config")" = "$VERSION" ] ||
            die "the image's version label is not $VERSION"
          [ "$(jq -r '.config.Labels["org.opencontainers.image.revision"] // ""' "$config")" = "$GITHUB_SHA" ] ||
            die "the image's revision label is not $GITHUB_SHA"
          echo "Checked: $VERSION, $GITHUB_SHA, image $IMAGE_DIGEST, signature $SIGNATURE_DIGEST as $sig_tag"

      # The one step with the secrets, as its own environment: the signature first (the script refuses a
      # version whose signature tag is not published), then the version. Both layouts were checked above.
      - name: Publish the signature, then the image
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_KV_TOKEN: ${{ secrets.CLOUDFLARE_KV_TOKEN }}
          IMAGE_DIGEST: ${{ needs.sign.outputs.image_digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          publish="$RUNNER_TEMP/updates/registry/scripts/publish-image.sh"
          bash "$publish" --remote "$RUNNER_TEMP/signature-download/signature" nyra-base "${IMAGE_DIGEST/:/-}.sig"
          bash "$publish" --remote "$RUNNER_TEMP/image-layout" nyra-base "$VERSION"

      - name: Summary
        env:
          IMAGE_DIGEST: ${{ needs.sign.outputs.image_digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "## Published"
            echo
            echo "\`updates.nyraos.com/nyra-base:$VERSION\` -> \`$IMAGE_DIGEST\`; verify-published reads it back."
            echo
            echo "Add to \`channels/nyra-base/releases.json\` in nyra-updates:"
            echo
            echo '```'
            echo "\"$VERSION\": \"$IMAGE_DIGEST\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Reads the release back from the registry as a machine would, with no secret and no environment:
  # the committed policy (its trust roots at the checkout) and registries.d, never --insecure-policy.
  # Red here is an incident to look into, not a reason to publish again (docs/UPDATES.md).
  verify-published:
    needs: [build, sign, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tools/install/verified-pull.sh, the pull the installer makes: the shipped policy, the digest
      # sign reported, the signed labels (version, and revision = this commit). The KV namespace takes a
      # short while to show a new tag: about 2 minutes of retries.
      - name: Pull the version with the shipped policy
        env:
          IMAGE_DIGEST: ${{ needs.sign.outputs.image_digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            if sudo tools/install/verified-pull.sh "$VERSION" "$IMAGE_DIGEST" "$RUNNER_TEMP/storage"; then
              exit 0
            fi
            echo "attempt $attempt failed"
            sleep 10
          done
          echo "::error::updates.nyraos.com/nyra-base:$VERSION was not accepted within about 2 minutes"
          exit 1

      - name: Remove the pulled image
        if: always()
        run: sudo rm -rf "$RUNNER_TEMP/storage"

  # Release mode only (build's `release` output, docs/SIGNING.md): the two jobs that make the image
  # the tests boot and the sign job signs. The credentials of the KMS are in release-sign alone, which
  # runs the one piece of image code there is near them (the join, below) with no network, no
  # environment and three fresh directories; everything that builds or tests an image is in jobs
  # without id-token. They hand files to each other, each checked against the hash its job reported
  # (ci/check-artifact.sh). A KMS_* variable that is not set fails the release (red, not skipped), so
  # the tests never boot an unsigned image.
  release-sign:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      uki_sha256: ${{ steps.sign.outputs.uki_sha256 }}
    env:
      KMS_KEY_RING: projects/nyra-signing-3076/locations/europe-west3/keyRings/nyra
    steps:
      - name: The KMS variables are set
        env:
          KMS_WIF_PROVIDER: ${{ vars.KMS_WIF_PROVIDER }}
          KMS_SIGNER_SA: ${{ vars.KMS_SIGNER_SA }}
        run: |
          if [ -z "$KMS_WIF_PROVIDER" ] || [ -z "$KMS_SIGNER_SA" ]; then
            echo "::error::KMS_WIF_PROVIDER or KMS_SIGNER_SA is not set: this release cannot be signed (docs/SIGNING.md)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in image.yml's build job: no `podman image prune` from the runner during the job.
      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      # Runs as root, so it comes before the auth step: no credential is present yet.
      - name: Install sbsign, pefile and the PKCS#11 engine for openssl
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q --no-install-recommends libengine-pkcs11-openssl >/dev/null
          sudo apt-get install -y -q --no-install-recommends sbsigntool python3-pefile >/dev/null

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-unsigned-uki
          path: ${{ runner.temp }}/unsigned

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-sealed-oci-archive
          path: ${{ runner.temp }}/sealed

      - name: Check both artifacts and load the sealed image
        env:
          UNSIGNED_UKI_SHA256: ${{ needs.build.outputs.unsigned_uki_sha256 }}
          SEALED_IMAGE_SHA256: ${{ needs.build.outputs.sealed_image_sha256 }}
        run: |
          files=("$RUNNER_TEMP"/unsigned/*)
          [ "${#files[@]}" = 1 ] && [ -f "${files[0]}" ] || { echo "::error::the unsigned UKI artifact must hold exactly one file"; exit 1; }
          ci/check-artifact.sh "${files[0]}" "$UNSIGNED_UKI_SHA256"
          ci/check-artifact.sh "$RUNNER_TEMP/sealed/nyra-base-sealed.oci.tar" "$SEALED_IMAGE_SHA256"
          sudo podman load -q -i "$RUNNER_TEMP/sealed/nyra-base-sealed.oci.tar"
          rm "$RUNNER_TEMP/sealed/nyra-base-sealed.oci.tar"
          sudo podman image exists localhost/nyra-base:ci-sealed

      # libkmsp11 reads application default credentials. From here on the job can sign until it ends.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.KMS_WIF_PROVIDER }}
          service_account: ${{ vars.KMS_SIGNER_SA }}
          create_credentials_file: true

      # 1. The PCR 11 policy of the UKI's main profile, signed by pcr-policy-1 (pcr-policy.py sign-kms
      #    checks the UKI first and verifies the signature with the committed public key).
      # 2. The signature joined into the UKI with the sealed image's own ukify: image code, so with no
      #    network, no environment, and only fresh directories mounted (never the workspace, which holds the
      #    credentials file): the only image code near the credentials.
      # 3. The whole file signed for Secure Boot by the key `uki` (tools/signing/sign-uki.sh repeats the checks
      #    on the joined file and verifies the result with the committed certificate).
      - name: Sign the PCR policy and the UKI in the KMS
        id: sign
        run: |
          secureboot=files/usr/lib/nyra/secureboot
          files=("$RUNNER_TEMP"/unsigned/*)
          name="${files[0]##*/}"
          tmp="$(mktemp -d)"
          . tools/signing/kms-pkcs11.sh "$tmp" "$KMS_KEY_RING"
          join="$RUNNER_TEMP/join"
          mkdir -p "$join/in" "$join/pcr" "$join/out"
          python3 -I tools/signing/pcr-policy.py sign-kms "${files[0]}" "$secureboot/tpm2-pcr-public-key.pem" \
            'pkcs11:object=pcr-policy-1;type=private' > "$join/pcr/pcrsig.json"
          cp "${files[0]}" "$join/in/$name"
          sudo podman run --rm --pull=never --network none --tmpfs /tmp --tmpfs /var/tmp \
            -v "$join/in:/in:ro" -v "$join/pcr:/pcr:ro" -v "$join/out:/out" localhost/nyra-base:ci-sealed \
            ukify build --hwids '' --join-pcrsig "/in/$name" --pcrsig @/pcr/pcrsig.json --output "/out/$name"
          sudo chown -R "$(id -u):$(id -g)" "$join/out"
          PCR_PUBKEY="$secureboot/tpm2-pcr-public-key.pem" tools/signing/sign-uki.sh "$join/out" "$join/signed" \
            --engine pkcs11 --key 'pkcs11:object=uki;type=private' --cert "$secureboot/nyra.crt"
          echo "uki_sha256=$(sha256sum < "$join/signed/$name" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # One day of retention: this UKI is signed with the release keys whether or not the tests pass.
      - name: Upload the signed UKI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyra-base-release-uki
          path: ${{ runner.temp }}/join/signed/
          retention-days: 1

  # The image the tests boot and sign signs: the sealed image from build plus the UKI release-sign
  # signed (ci/final-image.sh, as ci/build-image.sh makes it), with no id-token. Its layers must be
  # those of the image build checked (setuid files, lint, SBOM), except the one that holds the UKI.
  release-image:
    needs: [build, release-sign]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image_sha256: ${{ steps.export.outputs.image_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in image.yml's build job: no `podman image prune` from the runner during the job.
      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-release-uki
          path: ${{ runner.temp }}/signed

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-base-sealed-oci-archive
          path: ${{ runner.temp }}/sealed

      - name: Check both artifacts and load the sealed image
        env:
          SIGNED_UKI_SHA256: ${{ needs.release-sign.outputs.uki_sha256 }}
          SEALED_IMAGE_SHA256: ${{ needs.build.outputs.sealed_image_sha256 }}
        run: |
          files=("$RUNNER_TEMP"/signed/*)
          [ "${#files[@]}" = 1 ] && [ -f "${files[0]}" ] || { echo "::error::the signed UKI artifact must hold exactly one file"; exit 1; }
          ci/check-artifact.sh "${files[0]}" "$SIGNED_UKI_SHA256"
          ci/check-artifact.sh "$RUNNER_TEMP/sealed/nyra-base-sealed.oci.tar" "$SEALED_IMAGE_SHA256"
          sudo podman load -q -i "$RUNNER_TEMP/sealed/nyra-base-sealed.oci.tar"
          rm "$RUNNER_TEMP/sealed/nyra-base-sealed.oci.tar"
          sudo podman image exists localhost/nyra-base:ci-sealed

      # The same version and options as the build job's image step (annotations and labels only change
      # the image's metadata; the layers are compared below).
      - name: Build the release image
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.build.outputs.source_date_epoch }}
        run: |
          ci/final-image.sh localhost/nyra-base:ci-sealed "$RUNNER_TEMP/signed" localhost/nyra-base:ci \
            --annotation org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA"

      # What build checked (setuid and capabilities, lint, the SBOM) is this image, but for the UKI: the
      # layers of the sealed image, then the one that holds the UKI, which differs by its signature.
      - name: Same layers as the image build checked
        env:
          BUILT_LAYERS: ${{ needs.build.outputs.image_layers }}
        run: |
          sealed="$(sudo podman image inspect -f '{{json .RootFS.Layers}}' localhost/nyra-base:ci-sealed)"
          final="$(sudo podman image inspect -f '{{json .RootFS.Layers}}' localhost/nyra-base:ci)"
          jq -n -e --argjson built "$BUILT_LAYERS" --argjson sealed "$sealed" --argjson final "$final" '
            ($sealed | length) as $n
            | ($final | length) == ($built | length) and ($final | length) > $n
              and $final[:$n] == $sealed
              and ($final | del(.[$n])) == ($built | del(.[$n]))' >/dev/null || {
            echo "::error::The release image's layers are not build's, except for the UKI's: build $BUILT_LAYERS, release $final, sealed image $sealed."
            exit 1
          }

      # The sign job's gate (the same commands), on this image before any test boots it.
      - name: UKI release gate (signed with the committed Nyra certificate)
        run: |
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q --no-install-recommends sbsigntool python3-pefile >/dev/null
          cid="$(sudo podman create -q localhost/nyra-base:ci)"
          sudo podman cp "$cid:/boot" "$WORK/boot"
          sudo podman cp "$cid:/usr/lib/nyra/secureboot/tpm2-pcr-public-key-next.pem" "$WORK/image-next.pem"
          sudo podman cp "$cid:/usr/lib/nyra/secureboot/tpm2-pcr-retired-keys" "$WORK/image-retired"
          sudo podman rm -f "$cid" >/dev/null
          sudo chown -R "$(id -u):$(id -g)" "$WORK/boot" "$WORK/image-next.pem" "$WORK/image-retired"
          tools/signing/uki-gate.sh "$WORK/boot" files/usr/lib/nyra/secureboot/nyra.crt \
            files/usr/lib/nyra/secureboot/tpm2-pcr-public-key.pem \
            files/usr/lib/nyra/secureboot/tpm2-pcr-public-key-next.pem "$WORK/image-next.pem" \
            files/usr/lib/nyra/secureboot/tpm2-pcr-retired-keys "$WORK/image-retired"

      - name: Export the release image
        id: export
        run: |
          mkdir -p dist
          sudo podman save --format oci-archive -o dist/nyra-base.oci.tar localhost/nyra-base:ci
          sudo chown -R "$(id -u):$(id -g)" dist
          echo "image_sha256=$(sha256sum < dist/nyra-base.oci.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # One day of retention, like the signed UKI: it boots and unlocks disks whether or not the tests pass.
      - name: Upload the release image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyra-base-release-oci-archive
          path: dist/nyra-base.oci.tar
          retention-days: 1
