# SPDX-License-Identifier: GPL-3.0-or-later
# Builds nyra-base (desktop: Debian unstable, x86_64):
#   bootc from source (on Debian testing) -> mkosi root filesystem from the pinned
#   snapshot -> bootc layer (Containerfile) -> sealed UKI, signed with a key made for the run
#   (ci/build-image.sh, docs/BOOT.md) -> `bootc container lint --fatal-warnings`.
# Artifacts: the image as an oci-archive and the SBOM (CycloneDX, from the mkosi package list and
# the Cargo.lock of bootc, zlib-rs and ntpd-rs) with its vulnerability report; known critical or high
# vulnerabilities without a documented mitigation fail the build (docs/SBOM.md). Nothing is pushed
# to a public registry; the `publish` job (off unless enabled, docs/SIGNING.md) publishes to the
# update server.
# Release builds (push or manual run on main) unpack no cache at all (they only look a cache up, to
# save one when it is missing; ci/check-release-cache.py checks that), and the sign job signs
# them keylessly (docs/SIGNING.md), only if their UKI is signed with the committed Nyra certificate
# and the release's bootc is identical to the build cached on main (bootc-reproducible). Every job
# that uses the image artifact checks it against the sha256 build reported (ci/check-artifact.sh).
# A release is signed with the Nyra keys before the tests (release-sign and release-image jobs,
# docs/SIGNING.md, "Release mode"): the tests boot that image.
# Then install-boot installs that oci-archive to a disk image and boots it (KVM), then proves the
# boot chain on copies of that disk: Secure Boot and boot counting across updates (docs/BOOT.md),
# and nyra-updated across real updates (docs/UPDATES.md). In parallel, the encryption-tpm and
# encryption-other jobs install the same oci-archive on encrypted disks of their own and run the disk
# encryption tests (Titanic T10); encryption is the check that both passed.
# CI runs only what a change needs (docs/LESSONS.md): the changes job runs build, install-boot and
# encryption only when a file that can affect the image or its tests changed; a change only in
# tools/sbom/ runs the scan against the last image built on main instead (sbom job). Skipped jobs
# count as passed.
name: image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      soft-reboot-rounds:
        description: Rounds of tools/vm/soft-reboot-network.sh (1-99)
        default: "2"
      boot-rounds:
        description: Boots per runner of tools/vm/boot-repeat.sh, on 6 runners (0 = not run)
        default: "0"
  # titanic.yml runs this workflow every night and reads the names of its steps (tools/titanic/results.py).
  workflow_call:
    inputs:
      soft-reboot-rounds:
        description: Rounds of tools/vm/soft-reboot-network.sh (1-99)
        type: string
        default: "2"
      boot-rounds:
        description: Boots per runner of tools/vm/boot-repeat.sh, on 6 runners (0 = not run)
        type: string
        default: "0"
    outputs:
      uki_cert:
        description: The certificate of this run's UKI key (base64), for Secure Boot tests in the caller
        value: ${{ jobs.build.outputs.uki_cert }}
      image_sha256:
        description: The sha256 of the nyra-base-oci-archive artifact, as the build job made it
        value: ${{ jobs.build.outputs.image_sha256 }}
permissions:
  contents: read
# A new push to a pull request cancels its older run; on main a running release is never cancelled.
# github.workflow is the caller's name when titanic.yml calls this workflow, so the nightly run never
# delays or replaces a pending release build.
concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  # bootc-cache.yml reads BOOTC_REF and BOOTC_COMMIT from these two lines and saves the bootc build on
  # main under the same cache key as the build job below.
  BOOTC_REF: v1.16.13
  BOOTC_COMMIT: fa0d3f9cb9a0ce3b4d1dc2607a0bf5e31b822f60
  WORK: /mnt/work
  RELEASE: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
jobs:
  # Which jobs a change needs. Files that cannot change the image or its tests (the list below, kept
  # short on purpose) skip build and install-boot; anything else, including a new directory, runs
  # them. Manual runs always build.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      image: ${{ steps.files.outputs.image }}
      sbom: ${{ steps.files.outputs.sbom }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          image=false sbom=false count=0 files=""
          # On main, compare with the last commit that passed this workflow, not with the previous
          # push: GitHub drops a queued run when a newer one arrives, and its changes must not be lost.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            BASE="$(gh run list -R "$GITHUB_REPOSITORY" --workflow image.yml --branch main --event push \
              --status success -L 1 --json headSha --jq '.[0].headSha // empty')" || BASE=""
          fi
          # Any doubt (manual or nightly run, no earlier success, an API error) builds: a missed build is
          # worse than spent minutes.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_EVENT_NAME" = schedule ]; then
            image=true
          elif [ -z "$BASE" ] || ! gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" > "$RUNNER_TEMP/compare.json" ||
               ! count="$(jq -e '.files | arrays | length' "$RUNNER_TEMP/compare.json")"; then
            echo "::warning::Could not list the changed files since ${BASE:-the last successful build}; building."
            image=true count=0
          else
            # Both names of a renamed file: moving a file out of the image changes the image.
            files="$(jq -r '.files[] | .filename, .previous_filename // empty' "$RUNNER_TEMP/compare.json")"
          fi
          while read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/* | LICENSE | .github/CODEOWNERS | .github/dependabot.yml | tools/hooks/*) ;;
              .github/workflows/bootc-cache.yml | .github/workflows/kvm.yml | .github/workflows/secrets.yml) ;;
              .github/workflows/ntpd-rs.yml) ;;
              .github/workflows/shellcheck.yml | .github/workflows/titanic.yml | tools/titanic/*) ;;
              tools/sbom/*) sbom=true ;;
              */*) image=true ;;
              *.md) ;; # Markdown at the top level only (README.md); elsewhere it may be part of the image
              *) image=true ;;
            esac
          done <<<"$files"
          # The compare API lists at most 300 files: a longer list may hide an image file.
          [ "$count" -lt 300 ] || image=true
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"
          echo "Changed files: $count; build and install-boot: $image; tools/sbom changed: $sbom"

  build:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    outputs:
      # Release mode (the mode step): the release-sign and release-image jobs and the tests choose by it.
      release: ${{ steps.mode.outputs.release }}
      uki_cert: ${{ steps.image.outputs.uki_cert }}
      version: ${{ steps.image.outputs.version }}
      # What release-image builds the release image with, and the layers of this job's image, which
      # it compares its own with.
      source_date_epoch: ${{ steps.image.outputs.source_date_epoch }}
      image_layers: ${{ steps.image.outputs.image_layers }}
      # Every job that uses an artifact of this job checks it against these (ci/check-artifact.sh).
      image_sha256: ${{ steps.export.outputs.image_sha256 }}
      sbom_sha256: ${{ steps.sbom.outputs.sbom_sha256 }}
      bootc_key: ${{ steps.bootc-cache.outputs.cache-primary-key }}
      bootc_cached: ${{ steps.bootc-cache.outputs.cache-hit }}
      bootc_sha256: ${{ steps.bootc.outputs.sha256 }}
      # Release mode only: the inputs of release-sign and release-image.
      unsigned_uki_sha256: ${{ steps.release-export.outputs.unsigned_uki_sha256 }}
      sealed_image_sha256: ${{ steps.release-export.outputs.sealed_image_sha256 }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release mode (docs/SIGNING.md): the UKI of this run is signed by the release-sign job with the
      # Nyra keys, and the tests boot the image that results. Only this workflow on main (never
      # titanic.yml's call of it: github.workflow is then the caller's name); the build below is then
      # made with NYRA_RELEASE=1 (ci/build-image.sh), also for ci/check-reproducible.sh.
      - name: Release mode
        id: mode
        env:
          RELEASE_MODE: ${{ github.workflow == 'image' && env.RELEASE == 'true' }}
        run: |
          echo "release=$RELEASE_MODE" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_MODE" = true ]; then echo "NYRA_RELEASE=1" >> "$GITHUB_ENV"; fi
          echo "Release mode: $RELEASE_MODE"

      # The runner image enables podman-auto-update.timer, which runs `podman image prune -f` once within
      # 15 min of boot: it deletes untagged images, including one a step has just pulled (`podman pull
      # oci:...` before its `podman tag`) or a build stage, and that step fails with "image not known"
      # (docs/LESSONS.md).
      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      - name: Read the snapshot date from mkosi.conf
        run: |
          snapshot="$(sed -n 's/^Snapshot=//p' mkosi/mkosi.conf)"
          [[ "$snapshot" =~ ^([0-9]{4})([0-9]{2})([0-9]{2})T([0-9]{2})([0-9]{2})([0-9]{2})Z$ ]]
          m=("${BASH_REMATCH[@]}")
          echo "SNAPSHOT=$snapshot" >> "$GITHUB_ENV"
          # The release version (year.month.build, docs/UPDATES.md): the snapshot's year and month, and
          # this workflow's run number, which only grows.
          echo "VERSION=${m[1]}.$((10#${m[2]})).$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(date -u -d "${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}Z" +%s)" >> "$GITHUB_ENV"
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"
          df -h / /mnt

      - name: Pinned base images, cached (ci/pinned-images.sh)
        uses: ./.github/actions/pinned-images
        with:
          images: debian registry

      # The second source of the pinned images: with the first unreachable, registry comes from Docker
      # Hub and passes the same checks; a wrong digest or image ID fails. Pull requests only, in a
      # podman store of its own.
      - name: Self-test of the pinned image sources (ci/pinned-images.sh)
        if: github.event_name == 'pull_request'
        run: ci/pinned-images.sh --self-test

      - name: Build the CI tools image
        run: sudo podman build -q --pull=never --from localhost/pinned/debian --build-arg SNAPSHOT="$SNAPSHOT" -t localhost/nyra-tools -f ci/tools.Containerfile ci

      # The compiled, stripped bootc is cached (this is the slow part, ~15 min); it is
      # saved right after the build so a later failing step does not throw it away.
      # The key covers only what the build depends on: the pinned commit, the snapshot
      # (tools image packages, SOURCE_DATE_EPOCH), the tools image and ci/build-bootc.sh.
      # Release builds compile bootc themselves and only look the cache up; bootc-reproducible compares
      # their build with the cached one.
      - name: Restore the bootc build
        id: bootc-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ env.RELEASE == 'true' }}
          path: ~/cache/bootc.tar
          key: bootc-${{ env.BOOTC_COMMIT }}-${{ env.SNAPSHOT }}-${{ hashFiles('ci/tools.Containerfile', 'ci/build-bootc.sh') }}

      - name: Build bootc from source
        id: bootc
        if: steps.bootc-cache.outputs.cache-hit != 'true' || env.RELEASE == 'true'
        run: |
          mkdir -p ~/cache
          sudo podman run --rm -v ~/cache:/cache -v "$PWD/ci:/ci:ro" \
            -e BOOTC_REF="$BOOTC_REF" -e BOOTC_COMMIT="$BOOTC_COMMIT" -e SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            localhost/nyra-tools bash /ci/build-bootc.sh
          sudo chown -R "$(id -u):$(id -g)" ~/cache
          sha256="$(sha256sum < ~/cache/bootc.tar | cut -d' ' -f1)"
          echo "bootc build: sha256 $sha256"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Save the bootc build
        if: steps.bootc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cache/bootc.tar
          key: ${{ steps.bootc-cache.outputs.cache-primary-key }}

      - name: Restore the mkosi package downloads
        id: mkosi-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ env.RELEASE == 'true' }}
          path: ~/cache/mkosi-packages
          key: mkosi-${{ env.SNAPSHOT }}-${{ hashFiles('mkosi/mkosi.conf') }}
          restore-keys: mkosi-${{ env.SNAPSHOT }}-

      - name: Build the root filesystem with mkosi
        run: |
          sudo mkdir -p "$WORK/bootc" "$WORK/out" "$WORK/tmp"
          sudo tar -C "$WORK/bootc" -xf ~/cache/bootc.tar
          mkdir -p ~/cache/mkosi-packages
          sudo podman run --rm --privileged -v "$PWD/mkosi:/src" -v "$WORK:/work" -v ~/cache/mkosi-packages:/packages \
            localhost/nyra-tools mkosi -C /src \
              --output-directory=/work/out --workspace-directory=/work/tmp --package-cache-dir=/packages \
              --extra-tree=/work/bootc:/ --source-date-epoch="$SOURCE_DATE_EPOCH" --force build
          sudo chown -R "$(id -u):$(id -g)" ~/cache/mkosi-packages
          ls -l "$WORK/out"

      - name: Save the mkosi package downloads
        if: steps.mkosi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cache/mkosi-packages
          key: ${{ steps.mkosi-cache.outputs.cache-primary-key }}

      # The UKI is signed with a key made for this run only (ci/build-image.sh, docs/BOOT.md); its
      # certificate goes to install-boot as a job output, for the Secure Boot test. In release mode the
      # UKI is not signed here and the certificate is the committed Nyra one. bootc reads the
      # version from the manifest annotation (docs/LESSONS.md); the label says the same.
      - name: Add the bootc layer, the sealed UKI, and lint
        id: image
        run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q --no-install-recommends sbsigntool python3-pefile >/dev/null
          id="$(sudo podman pull -q "oci:$WORK/out/nyra-base-rootfs")"
          sudo podman tag "$id" localhost/nyra-base-rootfs:latest
          ci/build-image.sh localhost/nyra-base-rootfs:latest localhost/nyra-base:ci "$WORK/uki" \
            --annotation org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" 2>&1 | tee "$WORK/build.log"
          if [ "${NYRA_RELEASE:-}" = 1 ]; then cert=files/usr/lib/nyra/secureboot/nyra.crt; else cert="$WORK/uki/uki.crt"; fi
          echo "uki_cert=$(base64 -w0 "$cert")" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$SOURCE_DATE_EPOCH" >> "$GITHUB_OUTPUT"
          echo "image_layers=$(sudo podman image inspect -f '{{json .RootFS.Layers}}' localhost/nyra-base:ci)" >> "$GITHUB_OUTPUT"
          # The floor of the clock (docs/DEFAULTS.md, "Time"): /usr/lib/clock-epoch dated SOURCE_DATE_EPOCH.
          e="$(sudo podman run --rm localhost/nyra-base:ci stat -c %Y /usr/lib/clock-epoch)"
          [ "$e" = "$SOURCE_DATE_EPOCH" ] || { echo "::error::/usr/lib/clock-epoch is dated $e, not $SOURCE_DATE_EPOCH"; exit 1; }

      # What a release builds before its UKI is signed outside the job (ci/build-image.sh, NYRA_RELEASE=1):
      # the image with the unsigned UKI must pass the Containerfile's `bootc container lint`, and the UKI
      # must carry the committed policy key and no signature at all. Only on pull requests: a release
      # run does this for real. The crates and the next key of the first build are reused (no download).
      - name: Release mode build smoke test (ci/build-image.sh, NYRA_RELEASE=1)
        if: github.event_name == 'pull_request'
        run: |
          mkdir "$WORK/uki-release"
          sudo cp -a "$WORK/uki/crates" "$WORK/uki/pcr-next" "$WORK/uki-release/"
          NYRA_RELEASE=1 ci/build-image.sh localhost/nyra-base-rootfs:latest localhost/nyra-base:release-smoke "$WORK/uki-release" \
            --annotation org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.version="$VERSION" >/dev/null
          files=("$WORK"/uki-release/unsigned/*)
          [ "${#files[@]}" = 1 ] && [ -f "${files[0]}" ] || { echo "::error::$WORK/uki-release/unsigned must hold exactly the unsigned UKI"; exit 1; }
          python3 -I tools/signing/uki-check.py "${files[0]}" ci/uki-cmdline.txt 0
          python3 -I - "${files[0]}" files/usr/lib/nyra/secureboot/tpm2-pcr-public-key.pem <<'PY'
          import json, sys
          import pefile
          sections = [(s.Name.rstrip(b"\0"), s.get_data().rstrip(b"\0")) for s in pefile.PE(sys.argv[1]).sections]
          committed = open(sys.argv[2], "rb").read().strip()
          keys = [data.strip() for name, data in sections if name == b".pcrpkey"]
          assert keys and all(key == committed for key in keys), "the UKI's .pcrpkey is not the committed key"
          for name, data in sections:
              if name == b".pcrsig":
                  assert not any("sig" in policy for bank in json.loads(data).values() for policy in bank), \
                      "the unsigned UKI carries a PCR policy signature"
          print("release mode: the UKI has the committed policy key and no signature")
          PY
          # Nothing a release signs or certifies is made here: no signing directories, no certificate, no key.
          for path in signed policy uki.crt; do
            [ ! -e "$WORK/uki-release/$path" ] || { echo "::error::$WORK/uki-release/$path must not exist in release mode"; exit 1; }
          done
          keys="$(grep -rlI --exclude-dir=crates 'PRIVATE KEY' "$WORK/uki-release")" || [ $? = 1 ]
          [ -z "$keys" ] || { echo "::error::private key in release mode output: $keys"; exit 1; }

      # A second build from the same inputs must give the same layers (docs/LESSONS.md). It adds ~3 min,
      # so it runs on main and by hand, not on pull requests: for a branch that changes mkosi/ or the
      # Containerfile, run `gh workflow run image.yml --ref <branch>`.
      - name: Build again and compare the layers
        if: github.event_name != 'pull_request'
        run: ci/check-reproducible.sh

      # Setuid and setgid files, and files with capabilities (security.capability), give a local user
      # root's (or a group's) rights: a new one must be a decision, not a side effect of a package.
      # The ones the image has are listed in ci/setuid.txt and ci/capabilities.txt. Control: the same
      # check on a copy of the image (a container, its root filesystem mounted) with one file given
      # cap_net_raw+ep must fail, naming only that file.
      - name: No new setuid, setgid or file-capability files (ci/setuid.txt, ci/capabilities.txt)
        run: |
          check() { # check ROOT: the image's root filesystem, mounted
            # An empty or unmounted directory would pass: the root filesystem must look like the image.
            sudo test -x "$1/usr/bin/bootc" || { echo "::error::$1 is not the image's root filesystem"; return 1; }
            sudo find "$1" -xdev -type f -perm /6000 | sed "s|^$1||" | LC_ALL=C sort > "$RUNNER_TEMP/setuid.txt"
            sudo getcap -r "$1" | sed "s|^$1||; s| .*||" | LC_ALL=C sort > "$RUNNER_TEMP/capabilities.txt"
            local l new fail=0
            for l in setuid capabilities; do
              echo "== $l"; cat "$RUNNER_TEMP/$l.txt"
              new="$(LC_ALL=C comm -13 "ci/$l.txt" "$RUNNER_TEMP/$l.txt")"
              if [ -n "$new" ]; then
                echo "::error::New files, not in ci/$l.txt: $(tr '\n' ' ' <<<"$new")"
                fail=1
              fi
            done
            return "$fail"
          }
          m="$(sudo podman image mount localhost/nyra-base:ci)"
          check "$m"
          sudo podman image umount localhost/nyra-base:ci
          c="$(sudo podman create -q localhost/nyra-base:ci)"
          m="$(sudo podman mount "$c")"
          sudo cp "$m/usr/bin/true" "$m/usr/bin/nyra-cap-test"
          sudo setcap cap_net_raw+ep "$m/usr/bin/nyra-cap-test"
          if out="$(check "$m")"; then r=0; else r=$?; fi
          sudo podman rm -f "$c" >/dev/null
          echo "Control, the image with /usr/bin/nyra-cap-test given cap_net_raw+ep (exit $r):"
          sed 's/^::error::/expected error: /' <<<"$out"
          if [ "$r" = 0 ] || [ "$(grep -c '^::error::' <<<"$out")" != 1 ] ||
             ! grep -qxF '::error::New files, not in ci/capabilities.txt: /usr/bin/nyra-cap-test ' <<<"$out"; then
            echo "::error::The check did not catch exactly the file given cap_net_raw+ep."
            exit 1
          fi

      - name: Test the signature policy (docs/SIGNING.md)
        run: |
          tools/signing/trust-roots.sh "$RUNNER_TEMP/trust-roots"
          diff -r "$RUNNER_TEMP/trust-roots" files/usr/lib/nyra/sigstore
          tools/signing/local-registry.sh "$WORK"
          tools/signing/test-policy.sh localhost/nyra-base:ci "$WORK"
          sudo rm -rf "$WORK/policy-test"

      # The sign job's UKI release gate, on this image (its UKI signed with this run's key; not run in
      # release mode, where release-image runs the gate on the signed image): accepted
      # with this run's certificate and policy key, refused as the sign job runs it (the committed Nyra
      # certificate and policy key), and refused for an add-on, another command line, a second UKI, an
      # add-on next to it, no Nyra SBAT component, a PCR policy missing, not verifying or outside the
      # main profile, a UKI whose sections pefile could read differently from systemd-stub after shim
      # loaded it (tools/signing/pe_sections.py) or are not exactly the sealed UKI's, and a nested
      # signature (made with osslsigncode).
      - name: Test the UKI release gate (docs/SIGNING.md)
        if: steps.mode.outputs.release != 'true'
        run: |
          sudo apt-get install -y -q --no-install-recommends osslsigncode >/dev/null
          tools/signing/test-uki-gate.sh localhost/nyra-base:ci "$WORK/uki/uki.crt" \
            "$WORK/uki/pcr/tpm2-pcr-public-key.pem" "$WORK/uki/pcr-next/tpm2-pcr-public-key-next.pem" "$WORK"

      # The PCR policy signing and its check on a UKI that ci/ukify.sh builds with a policy key of the
      # test: only the main profile's enter-initrd policy is signed, computed independently (systemd-
      # measure signs the same), and anything else is refused before signing and in the check.
      - name: Test the PCR policy signing (docs/BOOT.md)
        run: tools/signing/test-pcr-policy.sh localhost/nyra-base:ci-sealed "$WORK/uki/kernel" "$WORK"

      # The Containerfile runs `nyra-updated check-config` on the image; here it must refuse the key of
      # the test fixtures (its private key is public), so a build that ships it fails.
      - name: Refuse a test channel sheet key (docs/UPDATES.md)
        run: |
          if out="$(sudo podman run --rm -v "$PWD/updated/channel-sheet/tests/data/seed1.pub.pem:/usr/lib/nyra/updates/channel-sheet.pem:ro,z" \
              localhost/nyra-base:ci /usr/libexec/nyra-updated check-config 2>&1)"; then
            echo "::error::check-config accepted the seed1 test key: $out"
            exit 1
          fi
          echo "$out"
          grep -q "holds a test key" <<<"$out"

      - name: Export the image and the SBOM
        id: export
        run: |
          mkdir -p dist
          sudo podman save --format oci-archive -o dist/nyra-base.oci.tar localhost/nyra-base:ci
          echo "image_sha256=$(sha256sum < dist/nyra-base.oci.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          cp "$WORK/out/nyra-base-rootfs.manifest" dist/nyra-base.manifest.json
          cp "$WORK/bootc/usr/share/doc/bootc/Cargo.lock" "dist/bootc-$BOOTC_REF-$BOOTC_COMMIT.Cargo.lock"
          cp zlib/Cargo.lock dist/nyra-zlib.Cargo.lock
          cp ntpd-rs/Cargo.lock dist/nyra-ntpd.Cargo.lock
          sudo chown -R "$(id -u):$(id -g)" dist
          m=dist/nyra-base.manifest.json
          {
            echo "## nyra-base (desktop, x86_64)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Debian snapshot | \`$SNAPSHOT\` (unstable) |"
            echo "| bootc | $BOOTC_REF (\`$BOOTC_COMMIT\`) |"
            echo "| Kernel | linux-image-amd64 $(jq -r '.packages[] | select(.name == "linux-image-amd64") | .version' "$m") |"
            echo "| Packages (SBOM) | $(jq '.packages | length' "$m") Debian packages, $(grep -c '^\[\[package\]\]' dist/bootc-*.Cargo.lock) Rust crates in bootc, $(grep -c '^source = ' dist/nyra-zlib.Cargo.lock) in zlib-rs, $(grep -c '^source = ' dist/nyra-ntpd.Cargo.lock) in ntpd-rs |"
            echo "| Image | $(sudo podman image inspect -f '{{.Id}}' localhost/nyra-base:ci | cut -c1-12), $(du -h dist/nyra-base.oci.tar | cut -f1) oci-archive |"
            echo
            echo "\`bootc container lint --fatal-warnings\`"
            echo '```'
            sed -n '/bootc container lint/,$p' "$WORK/build.log" | grep -v '^COMMIT\|^-->\|^STEP\|^Successfully\|^[0-9a-f]\{64\}$' | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Not in release mode: that image has an unsigned UKI, and only the release-image job's is tested.
      - name: Upload the image
        if: steps.mode.outputs.release != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyra-base-oci-archive
          path: dist/nyra-base.oci.tar
          retention-days: 14

      # The inputs of the release-sign job: the UKI as ukify made it (unjoined: its PCR policy has no
      # signature yet), and the sealed image it was made from. One day of retention: a signature of the
      # release keys is made for them (docs/SIGNING.md).
      - name: Export the unsigned UKI and the sealed image
        id: release-export
        if: steps.mode.outputs.release == 'true'
        run: |
          mkdir -p release/unsigned
          files=("$WORK"/uki/unsigned/*)
          [ "${#files[@]}" = 1 ] && [ -f "${files[0]}" ] || { echo "::error::$WORK/uki/unsigned must hold exactly the unsigned UKI"; exit 1; }
          # The file keeps its name (the kernel version): it is the UKI's name in /boot/EFI/Linux.
          cp "${files[0]}" release/unsigned/
          sudo podman save --format oci-archive -o release/nyra-base-sealed.oci.tar localhost/nyra-base:ci-sealed
          sudo chown -R "$(id -u):$(id -g)" release
          echo "unsigned_uki_sha256=$(sha256sum < "release/unsigned/${files[0]##*/}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sealed_image_sha256=$(sha256sum < release/nyra-base-sealed.oci.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the unsigned UKI
        if: steps.release-export.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyra-base-unsigned-uki
          path: release/unsigned/
          retention-days: 1

      - name: Upload the sealed image
        if: steps.release-export.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyra-base-sealed-oci-archive
          path: release/nyra-base-sealed.oci.tar
          retention-days: 1

      # Last step, after the image is uploaded: the scan fetches data from the network (Debian
      # snapshot index, Debian Security Tracker, OSV) and runs one pinned PyPI package, and none of
      # that gets a chance to touch the image. A blocking finding fails this job, so install-boot
      # and sign do not run.
      - name: SBOM and vulnerability scan (docs/SBOM.md)
        id: sbom
        run: |
          python3 -m venv "$RUNNER_TEMP/sbom-venv"
          "$RUNNER_TEMP/sbom-venv/bin/pip" install -q --no-deps --require-hashes -r tools/sbom/requirements.txt
          "$RUNNER_TEMP/sbom-venv/bin/python" tools/sbom/test_sbom.py
          "$RUNNER_TEMP/sbom-venv/bin/python" tools/sbom/sbom.py dist/nyra-base.manifest.json \
            "dist/bootc-$BOOTC_REF-$BOOTC_COMMIT.Cargo.lock" dist/nyra-base.cdx.json dist/nyra-zlib.Cargo.lock dist/nyra-ntpd.Cargo.lock \
            | tee dist/nyra-base.vulnerabilities.md >> "$GITHUB_STEP_SUMMARY"
          echo "sbom_sha256=$(sha256sum < dist/nyra-base.cdx.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Uploaded even when the scan blocks, to see why. Releases will attach the SBOM, once images
      # are published.
      - name: Upload the SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyra-base-sbom
          path: |
            dist/nyra-base.cdx.json
            dist/nyra-base.vulnerabilities.md
            dist/nyra-base.manifest.json
            dist/bootc-*.Cargo.lock
            dist/nyra-zlib.Cargo.lock
            dist/nyra-ntpd.Cargo.lock
          retention-days: 90

  # A change only in tools/sbom/ (scanner, mitigations): the offline tests, then the scan with this
  # branch's scanner and mitigations against the package list and Cargo.lock of the last image built
  # on main (its nyra-base-sbom artifact), so the result is the one the next build would give.
  sbom:
    needs: changes
    if: needs.changes.outputs.sbom == 'true' && needs.changes.outputs.image != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: SBOM and vulnerability scan against the last image built on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The SBOM artifact of the newest successful push run on main that built (never a fork's
          # branch named main); runs that skipped the build have none.
          id=""
          for run in $(gh run list -R "$GITHUB_REPOSITORY" --workflow image.yml --branch main --event push \
                         --status success -L 30 --json databaseId --jq '.[].databaseId'); do
            id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=nyra-base-sbom" \
              --jq '[.artifacts[] | select(.expired == false)][0].id // empty')"
            [ -z "$id" ] || break
          done
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::No SBOM artifact from a successful build on main"; exit 1; }
          mkdir -p dist
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/sbom.zip"
          unzip -q -o "$RUNNER_TEMP/sbom.zip" nyra-base.manifest.json "bootc-$BOOTC_REF-$BOOTC_COMMIT.Cargo.lock" -d dist
          python3 -m venv "$RUNNER_TEMP/sbom-venv"
          "$RUNNER_TEMP/sbom-venv/bin/pip" install -q --no-deps --require-hashes -r tools/sbom/requirements.txt
          "$RUNNER_TEMP/sbom-venv/bin/python" tools/sbom/test_sbom.py
          # zlib/ and ntpd-rs/Cargo.lock from this checkout: a change to one is an image change, which builds instead.
          "$RUNNER_TEMP/sbom-venv/bin/python" tools/sbom/sbom.py dist/nyra-base.manifest.json \
            "dist/bootc-$BOOTC_REF-$BOOTC_COMMIT.Cargo.lock" dist/nyra-base.cdx.json zlib/Cargo.lock ntpd-rs/Cargo.lock >> "$GITHUB_STEP_SUMMARY"

  # Installs the image from the oci-archive artifact the way a user's disk gets it
  # (bootc install to-disk, composefs backend, systemd-boot, then esp-sync install for the boot
  # files and loader.conf the installer puts on the ESP) on a loopback file, then boots it with
  # QEMU + KVM + OVMF. The image boots only its sealed UKI, whose command line
  # cannot change, so the test-only console access (a getty on ttyS0, root autologin for that boot)
  # is set up by vm-boot.py, with a test add-on on the test disk's ESP (tools/vm/test-console.sh);
  # nothing changes in the image.
  # The digest check reads only the booted entry (--booted drops staged and rollback)
  # and needs exactly one imageDigest there, equal to the loaded image's. Then one more boot changes a
  # composefs object on the disk under the file system, which must give a read error
  # (tools/vm/tampered-object.sh, Titanic T1).
  # Boot chain (docs/BOOT.md), each on its own copy of the installed disk, both run even if the
  # other fails: tools/vm/secure-boot.sh (shim -> systemd-boot -> the image's UKI, signed with this
  # run's key enrolled as MOK; tampered, unsigned and wrongly signed UKIs refused, unsigned add-ons
  # refused, credentials on the ESP or over SMBIOS ignored, a command line over SMBIOS appended by
  # systemd-stub only) and tools/vm/boot-counting.sh (an update that
  # never gets healthy falls back after 3 tries, a healthy one is blessed), and tools/vm/boot-protection.sh
  # (Secure Boot, one firmware variable store across eleven boots: editor off from the first boot,
  # fallback path, "Nyra OS" entry and BootOrder repaired, damaged or missing boot files, ESP full,
  # no older boot loader over a newer one, a newer one only after the version is blessed, nothing
  # written to the ESP when its file system check fails), and
  # tools/vm/recovery.sh (the UKI's signed "Nyra OS Recovery" profile boots under Secure Boot and asks
  # for an administrator's password; a wrong one gives no shell), and tools/vm/reset-settings.sh (the
  # "Nyra OS Reset settings" profile brings /etc back to the image's, keeps accounts, /home, machine ID
  # and host name, and leaves /etc whole across power cuts).
  # Finding the root partition (docs/BOOT.md): tools/vm/boot-repeat.sh's checks, without its repeated
  # boots (the first probe of the boot disk cannot read LoaderDevicePartUUID: with the image's rule
  # that probes it again masked the initrd ends in emergency mode, with the rule the system starts).
  # Secure defaults (docs/DEFAULTS.md), one more boot of the installed disk in snapshot
  # mode: tools/vm/security-defaults.sh (AppArmor, lockdown, firewall, listening sockets, signature
  # policy, filesystem autoload).
  # Security: this job runs images built from pull requests with --privileged and
  # /dev mounted, so it must stay on ephemeral GitHub-hosted runners; never run it on
  # self-hosted runners for pull_request events.
  # install-boot is split into three jobs that run in parallel, each with its own disk
  # (install-boot-system here: everything but the update tests, which the two jobs after it run), and
  # a last job, install-boot, that needs them (the required check).
  install-boot-system:
    needs: [build, release-image]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build.outputs.release != 'true' || needs.release-image.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in image.yml's build job: no `podman image prune` from the runner during the job.
      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      - name: Pinned base images, cached (ci/pinned-images.sh)
        uses: ./.github/actions/pinned-images
        with:
          images: registry

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf \
            python3-virt-firmware systemd-ukify sbsigntool swtpm python3-pefile
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.release == 'true' && 'nyra-base-release-oci-archive' || 'nyra-base-oci-archive' }}
          path: ${{ env.WORK }}

      - name: Load the image
        id: load
        env:
          RELEASE: ${{ needs.build.outputs.release }}
          IMAGE_SHA256: ${{ needs.build.outputs.image_sha256 }}
          RELEASE_IMAGE_SHA256: ${{ needs.release-image.outputs.image_sha256 }}
        run: |
          # The artifact and its hash come from the same job: release-image's on a release, else build's.
          [ "$RELEASE" != true ] || IMAGE_SHA256="$RELEASE_IMAGE_SHA256"
          ci/check-artifact.sh "$WORK/nyra-base.oci.tar" "$IMAGE_SHA256"
          sudo podman load -i "$WORK/nyra-base.oci.tar"
          rm "$WORK/nyra-base.oci.tar"
          digest="$(sudo podman image inspect -f '{{.Digest}}' localhost/nyra-base:ci)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Install to a disk image with bootc
        id: install
        run: |
          start=$SECONDS
          tools/vm/install-disk.sh localhost/nyra-base:ci "$WORK"
          echo "INSTALL_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"
          tools/vm/test-console.sh localhost/nyra-base:ci "$WORK/disk.raw" "$WORK"
          qemu-img convert -O qcow2 "$WORK/disk.raw" "$WORK/disk.qcow2"
          rm "$WORK/disk.raw"

      - name: Boot the installed disk with KVM
        id: boot
        env:
          IMAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "## nyra-base: install and boot"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`localhost/nyra-base:ci\` \`$IMAGE_DIGEST\` |"
            echo "| Install | \`bootc install to-disk --composefs-backend --bootloader systemd\`, ext4, loopback, then \`esp-sync install\` on the ESP, ${INSTALL_SECONDS} s |"
            echo "| VM | QEMU $(qemu-system-x86_64 --version | head -1 | awk '{print $4}'), KVM, UEFI (OVMF), 2 vCPU, 2 GiB |"
            echo "| Test-only access | a getty on ttyS0 and root autologin, set up by vm-boot.py with a test add-on on the ESP (tools/vm/test-console.sh); the image's command line has no console |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/vm/vm-boot.py --autologin \
            --disk "$WORK/disk.qcow2" --timeout 240 \
            --command 'test "$(systemd-detect-virt)" = kvm && echo "virtualization: kvm"' \
            --command 's="$(systemctl is-system-running --wait)"; echo "system: $s"; systemctl --no-pager --failed; systemd-analyze; test "$s" = running' \
            --command 'bootc status && d="$(bootc status --booted --format json | grep -o "\"imageDigest\":\"[^\"]*\"" | cut -d\" -f4)" && echo "booted imageDigest: $d" && test "$d" = '"$IMAGE_DIGEST" \
            --command 'v="$(bootc status --booted --format json | grep -o "\"version\":\"[^\"]*\"" | cut -d\" -f4)" && echo "booted version: $v" && test "$v" = '"$IMAGE_VERSION" \
            --command 'cat /etc/os-release && . /etc/os-release && [ "$ID" = nyra ] && [ "$ID_LIKE" = debian ] && [ "$PRETTY_NAME" = "Nyra OS '"$IMAGE_VERSION"'" ] && [ "$IMAGE_VERSION" = '"$IMAGE_VERSION"' ] && test "$(readlink /etc/os-release)" = ../usr/lib/os-release && [ "$LOGO" = nyra-logo ] && test -s "/usr/share/icons/hicolor/scalable/apps/$LOGO.svg" && test -s "/usr/share/icons/hicolor/16x16/apps/$LOGO.svg" && echo "os-release: Nyra OS, like Debian, with its logo"' \
            --command 'i="$(agetty --show-issue)"; echo "$i"; test ! -e /etc/issue && case "$i" in "Nyra OS '"$IMAGE_VERSION"' "*) echo "the login prompt names Nyra OS" ;; *) false ;; esac && mkdir -p /run/issue.d && echo "a drop-in" > /run/issue.d/99-nyra-test.issue && agetty --show-issue | tail -n 1 | grep -qx "a drop-in" && rm /run/issue.d/99-nyra-test.issue && echo "the drop-ins of /run/issue.d after it"' \
            --command 'findmnt -T /usr; findmnt -T /usr -no OPTIONS | tr , "\n" | grep -qx ro && touch /usr/.nyra-rw-test 2>&1 | grep "Read-only file system"' \
            --command 'cat /proc/cmdline' \
            --log "$RUNNER_TEMP/serial.log" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --title "Installed nyra-base boot with KVM"

      - name: The login shows the Nyra OS message of the day only
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: |
          tools/vm/check-motd.sh --self-test
          tools/vm/check-motd.sh "$RUNNER_TEMP/serial.log"

      - name: Root partition found when the first probe fails (docs/BOOT.md)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          UKI_CERT: ${{ needs.build.outputs.uki_cert }}
        run: |
          base64 -d <<<"$UKI_CERT" > "$RUNNER_TEMP/uki.crt"
          tools/vm/boot-repeat.sh localhost/nyra-base:ci "$WORK/disk.qcow2" "$RUNNER_TEMP/uki.crt" "$WORK" "$RUNNER_TEMP" \
            "$GITHUB_STEP_SUMMARY" 0

      # Titanic T1: a composefs object changed on the disk gives a read error (tools/vm/tampered-object.sh).
      - name: Tampered composefs object (Titanic T1)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: tools/vm/tampered-object.sh "$WORK/disk.qcow2" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Secure defaults (docs/DEFAULTS.md)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: tools/vm/security-defaults.sh "$WORK/disk.qcow2" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Without a network (docs/DEFAULTS.md)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 15
        run: tools/vm/no-network.sh "$WORK/disk.qcow2" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      # The signed PCR 11 policy unlocks the disk only in the initrd (docs/BOOT.md, "TPM2 unlock"):
      # swtpm and the image's own systemd 262 enroll a throwaway LUKS disk and check, for each boot
      # state, whether the TPM releases the key. No VM and no KVM: tools/signing/tpm-replay.py replays
      # the stub's PCR 11 measurements into swtpm. Only the loaded image is needed, not the disk: it
      # runs when the image loaded (so the steps before it succeeded), even if the install failed.
      - name: TPM2 disk-unlock policy (docs/BOOT.md)
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        run: tools/signing/tpm-unlock.sh localhost/nyra-base:ci "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      # Titanic T14 (docs/TITANIC.md): USB sticks pulled out during a write, during an update and
      # during the boot, a stick with ESP, root and swap partitions at boot, and the mount options of
      # trusted and untrusted media (docs/DEFAULTS.md, "Removable media"). Its own copy of the disk.
      - name: Removable media pulled out, Titanic T14 (docs/TITANIC.md)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 30
        run: tools/vm/removable-media.sh localhost/nyra-base:ci "$WORK/disk.qcow2" "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Secure Boot chain (docs/BOOT.md)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          UKI_CERT: ${{ needs.build.outputs.uki_cert }}
        run: |
          base64 -d <<<"$UKI_CERT" > "$RUNNER_TEMP/uki.crt"
          tools/vm/secure-boot.sh localhost/nyra-base:ci "$WORK/disk.qcow2" "$RUNNER_TEMP/uki.crt" "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Boot protection (docs/BOOT.md)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          UKI_CERT: ${{ needs.build.outputs.uki_cert }}
        run: |
          base64 -d <<<"$UKI_CERT" > "$RUNNER_TEMP/uki.crt"
          tools/vm/boot-protection.sh localhost/nyra-base:ci "$WORK/disk.qcow2" "$RUNNER_TEMP/uki.crt" "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Recovery boot entry (docs/BOOT.md)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          UKI_CERT: ${{ needs.build.outputs.uki_cert }}
        run: |
          base64 -d <<<"$UKI_CERT" > "$RUNNER_TEMP/uki.crt"
          tools/vm/recovery.sh localhost/nyra-base:ci "$WORK/disk.qcow2" "$RUNNER_TEMP/uki.crt" "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Reset system settings (docs/BOOT.md)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          UKI_CERT: ${{ needs.build.outputs.uki_cert }}
        run: |
          base64 -d <<<"$UKI_CERT" > "$RUNNER_TEMP/uki.crt"
          tools/vm/reset-settings.sh localhost/nyra-base:ci "$WORK/disk.qcow2" "$RUNNER_TEMP/uki.crt" "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Boot counting across updates (docs/BOOT.md)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          tools/vm/boot-counting.sh localhost/nyra-base:ci "$IMAGE_DIGEST" "$WORK/disk.qcow2" \
            "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Upload the serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-boot-system-serial-log
          path: ${{ runner.temp }}/serial*.log
          if-no-files-found: ignore
          retention-days: 14

  # The two update jobs: the same setup as install-boot-system (each installs the image to a disk of
  # its own; every test below works on a copy of that disk and shares nothing else), then the update
  # tests. Split by measured time so that the three jobs end at about the same time.
  # Measured 27-39 min for this step on the hosted runners; a 40-minute limit stopped a healthy run.
  install-boot-updates:
    needs: [build, release-image]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build.outputs.release != 'true' || needs.release-image.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in image.yml's build job: no `podman image prune` from the runner during the job.
      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      - name: Pinned base images, cached (ci/pinned-images.sh)
        uses: ./.github/actions/pinned-images
        with:
          images: registry

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
