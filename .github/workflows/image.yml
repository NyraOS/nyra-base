# SPDX-License-Identifier: GPL-3.0-or-later
# Builds nyra-base (desktop: Debian unstable, x86_64):
#   bootc from source (on Debian testing) -> mkosi root filesystem from the pinned
#   snapshot -> bootc layer (Containerfile) -> `bootc container lint --fatal-warnings`.
# Artifacts: the image as an oci-archive and the SBOM (CycloneDX, from the mkosi package list and
# bootc's Cargo.lock) with its vulnerability report; known critical or high vulnerabilities without a
# documented mitigation fail the build (docs/SBOM.md). Nothing is pushed to a public registry;
# publishing comes later (NyraOS#25).
# Release builds (push or manual run on main) use no cached content (the bootc cache is only compared
# with the fresh bootc build), and the sign job signs
# them keylessly (docs/SIGNING.md).
# Then install-boot installs that oci-archive to a disk image and boots it (KVM), then proves the
# boot chain on copies of that disk: Secure Boot and boot counting across updates (docs/BOOT.md).
name: image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  # bootc-cache.yml reads BOOTC_REF and BOOTC_COMMIT from these two lines and saves the bootc build on
  # main under the same cache key as the build job below.
  BOOTC_REF: v1.16.13
  BOOTC_COMMIT: fa0d3f9cb9a0ce3b4d1dc2607a0bf5e31b822f60
  WORK: /mnt/work
  RELEASE: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the snapshot date from mkosi.conf
        run: |
          snapshot="$(sed -n 's/^Snapshot=//p' mkosi/mkosi.conf)"
          [[ "$snapshot" =~ ^([0-9]{4})([0-9]{2})([0-9]{2})T([0-9]{2})([0-9]{2})([0-9]{2})Z$ ]]
          m=("${BASH_REMATCH[@]}")
          echo "SNAPSHOT=$snapshot" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(date -u -d "${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}Z" +%s)" >> "$GITHUB_ENV"
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"
          df -h / /mnt

      - name: Build the CI tools image
        run: sudo podman build -q --build-arg SNAPSHOT="$SNAPSHOT" -t localhost/nyra-tools -f ci/tools.Containerfile ci

      # The compiled, stripped bootc is cached (this is the slow part, ~15 min); it is
      # saved right after the build so a later failing step does not throw it away.
      # The key covers only what the build depends on: the pinned commit, the snapshot
      # (tools image packages, SOURCE_DATE_EPOCH), the tools image and ci/build-bootc.sh.
      - name: Restore the bootc build
        id: bootc-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Release builds compile bootc themselves and restore the cache only to compare it with
          # their own build (the next step): two compiles of the same source must be identical.
          path: ~/cache/bootc.tar
          key: bootc-${{ env.BOOTC_COMMIT }}-${{ env.SNAPSHOT }}-${{ hashFiles('ci/tools.Containerfile', 'ci/build-bootc.sh') }}

      - name: Build bootc from source
        if: steps.bootc-cache.outputs.cache-hit != 'true' || env.RELEASE == 'true'
        run: |
          mkdir -p ~/cache
          if [ -f ~/cache/bootc.tar ]; then mv ~/cache/bootc.tar ~/cache/bootc.cached.tar; fi
          sudo podman run --rm -v ~/cache:/cache -v "$PWD/ci:/ci:ro" \
            -e BOOTC_REF="$BOOTC_REF" -e BOOTC_COMMIT="$BOOTC_COMMIT" -e SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            localhost/nyra-tools bash /ci/build-bootc.sh
          sudo chown -R "$(id -u):$(id -g)" ~/cache
          if [ -f ~/cache/bootc.cached.tar ]; then
            if cmp ~/cache/bootc.cached.tar ~/cache/bootc.tar; then
              echo "Reproducible: this bootc build is identical to the cached one."
            else
              mkdir -p "$RUNNER_TEMP/bootc-cached" "$RUNNER_TEMP/bootc-new"
              tar -C "$RUNNER_TEMP/bootc-cached" -xf ~/cache/bootc.cached.tar
              tar -C "$RUNNER_TEMP/bootc-new" -xf ~/cache/bootc.tar
              diff -rq "$RUNNER_TEMP/bootc-cached" "$RUNNER_TEMP/bootc-new" || true
              echo "::error::bootc compiled from the same source differs from the cached build (files above)."
              exit 1
            fi
          else
            echo "::notice::No cached bootc build for this key, nothing to compare."
          fi

      - name: Save the bootc build
        if: steps.bootc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cache/bootc.tar
          key: ${{ steps.bootc-cache.outputs.cache-primary-key }}

      - name: Restore the mkosi package downloads
        id: mkosi-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ env.RELEASE == 'true' }}
          path: ~/cache/mkosi-packages
          key: mkosi-${{ env.SNAPSHOT }}-${{ hashFiles('mkosi/mkosi.conf') }}
          restore-keys: mkosi-${{ env.SNAPSHOT }}-

      - name: Build the root filesystem with mkosi
        run: |
          sudo mkdir -p "$WORK/bootc" "$WORK/out" "$WORK/tmp"
          sudo tar -C "$WORK/bootc" -xf ~/cache/bootc.tar
          mkdir -p ~/cache/mkosi-packages
          sudo podman run --rm --privileged -v "$PWD/mkosi:/src" -v "$WORK:/work" -v ~/cache/mkosi-packages:/packages \
            localhost/nyra-tools mkosi -C /src \
              --output-directory=/work/out --workspace-directory=/work/tmp --package-cache-dir=/packages \
              --extra-tree=/work/bootc:/ --source-date-epoch="$SOURCE_DATE_EPOCH" --force build
          sudo chown -R "$(id -u):$(id -g)" ~/cache/mkosi-packages
          ls -l "$WORK/out"

      - name: Save the mkosi package downloads
        if: steps.mkosi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cache/mkosi-packages
          key: ${{ steps.mkosi-cache.outputs.cache-primary-key }}

      - name: Add the bootc layer and lint
        run: |
          id="$(sudo podman pull -q "oci:$WORK/out/nyra-base-rootfs")"
          sudo podman tag "$id" localhost/nyra-base-rootfs:latest
          sudo podman build --timestamp "$SOURCE_DATE_EPOCH" \
            --label org.opencontainers.image.version="$SNAPSHOT" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t localhost/nyra-base:ci -f Containerfile . 2>&1 | tee "$WORK/build.log"

      # A second build from the same inputs must give the same layers (docs/LESSONS.md). It adds ~3 min,
      # so it runs on main and by hand, not on pull requests: for a branch that changes mkosi/ or the
      # Containerfile, run `gh workflow run image.yml --ref <branch>`.
      - name: Build again and compare the layers
        if: github.event_name != 'pull_request'
        run: ci/check-reproducible.sh

      - name: Test the signature policy (docs/SIGNING.md)
        run: |
          tools/signing/trust-roots.sh "$RUNNER_TEMP/trust-roots"
          diff -r "$RUNNER_TEMP/trust-roots" files/usr/lib/nyra/sigstore
          tools/signing/local-registry.sh "$WORK"
          tools/signing/test-policy.sh localhost/nyra-base:ci "$WORK"
          sudo rm -rf "$WORK/policy-test"

      - name: Export the image and the SBOM
        run: |
          mkdir -p dist
          sudo podman save --format oci-archive -o dist/nyra-base.oci.tar localhost/nyra-base:ci
          cp "$WORK/out/nyra-base-rootfs.manifest" dist/nyra-base.manifest.json
          cp "$WORK/bootc/usr/share/doc/bootc/Cargo.lock" "dist/bootc-$BOOTC_REF-$BOOTC_COMMIT.Cargo.lock"
          sudo chown -R "$(id -u):$(id -g)" dist
          m=dist/nyra-base.manifest.json
          {
            echo "## nyra-base (desktop, x86_64)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Debian snapshot | \`$SNAPSHOT\` (unstable) |"
            echo "| bootc | $BOOTC_REF (\`$BOOTC_COMMIT\`) |"
            echo "| Kernel | linux-image-amd64 $(jq -r '.packages[] | select(.name == "linux-image-amd64") | .version' "$m") |"
            echo "| Packages (SBOM) | $(jq '.packages | length' "$m") Debian packages, $(grep -c '^\[\[package\]\]' dist/bootc-*.Cargo.lock) Rust crates in bootc |"
            echo "| Image | $(sudo podman image inspect -f '{{.Id}}' localhost/nyra-base:ci | cut -c1-12), $(du -h dist/nyra-base.oci.tar | cut -f1) oci-archive |"
            echo
            echo "\`bootc container lint --fatal-warnings\`"
            echo '```'
            sed -n '/bootc container lint/,$p' "$WORK/build.log" | grep -v '^COMMIT\|^-->\|^STEP\|^Successfully\|^[0-9a-f]\{64\}$' | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyra-base-oci-archive
          path: dist/nyra-base.oci.tar
          retention-days: 14

      # Last step, after the image is uploaded: the scan fetches data from the network (Debian
      # snapshot index, Debian Security Tracker, OSV) and runs one pinned PyPI package, and none of
      # that gets a chance to touch the image. A blocking finding fails this job, so install-boot
      # and sign do not run.
      - name: SBOM and vulnerability scan (docs/SBOM.md)
        run: |
          python3 -m venv "$RUNNER_TEMP/sbom-venv"
          "$RUNNER_TEMP/sbom-venv/bin/pip" install -q --no-deps --require-hashes -r tools/sbom/requirements.txt
          "$RUNNER_TEMP/sbom-venv/bin/python" tools/sbom/test_sbom.py
          "$RUNNER_TEMP/sbom-venv/bin/python" tools/sbom/sbom.py dist/nyra-base.manifest.json \
            "dist/bootc-$BOOTC_REF-$BOOTC_COMMIT.Cargo.lock" dist/nyra-base.cdx.json \
            | tee dist/nyra-base.vulnerabilities.md >> "$GITHUB_STEP_SUMMARY"

      # Uploaded even when the scan blocks, to see why. Releases will attach the SBOM (NyraOS#25).
      - name: Upload the SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyra-base-sbom
          path: |
            dist/nyra-base.cdx.json
            dist/nyra-base.vulnerabilities.md
            dist/nyra-base.manifest.json
            dist/bootc-*.Cargo.lock
          retention-days: 90

  # Installs the image from the oci-archive artifact the way a user's disk gets it
  # (bootc install to-disk, composefs backend, systemd-boot) on a loopback file,
  # then boots it with QEMU + KVM + OVMF. Test-only access, nothing changed in the
  # image: console=ttyS0 is an install-time kernel argument on this test disk, and
  # vm-boot.py --autologin logs in on the serial console through a systemd credential.
  # The digest check reads only the booted entry (--booted drops staged and rollback)
  # and needs exactly one imageDigest there, equal to the loaded image's.
  # Boot chain (docs/BOOT.md), each on its own copy of the installed disk, both run even if the
  # other fails: tools/vm/secure-boot.sh (shim -> systemd-boot -> UKI signed with a throwaway key
  # enrolled as MOK; unsigned and wrongly signed UKIs refused) and tools/vm/boot-counting.sh (an
  # update that never gets healthy falls back after 3 tries, a healthy one is blessed).
  # Secure defaults (docs/DEFAULTS.md, NyraOS T15), one more boot of the installed disk in snapshot
  # mode: tools/vm/security-defaults.sh (AppArmor, lockdown, firewall, listening sockets, signature
  # policy, filesystem autoload).
  # Security: this job runs images built from pull requests with --privileged and
  # /dev mounted, so it must stay on ephemeral GitHub-hosted runners; never run it on
  # self-hosted runners for pull_request events.
  install-boot:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf \
            python3-virt-firmware systemd-ukify sbsigntool
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nyra-base-oci-archive
          path: ${{ env.WORK }}

      - name: Load the image
        run: |
          sudo podman load -i "$WORK/nyra-base.oci.tar"
          rm "$WORK/nyra-base.oci.tar"
          digest="$(sudo podman image inspect -f '{{.Digest}}' localhost/nyra-base:ci)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Install to a disk image with bootc
        id: install
        run: |
          truncate -s 12G "$WORK/disk.raw"
          start=$SECONDS
          sudo podman run --rm --privileged --pid=host \
            -v /dev:/dev -v /var/lib/containers:/var/lib/containers -v "$WORK:/output" \
            localhost/nyra-base:ci \
            bootc install to-disk --composefs-backend --bootloader systemd --filesystem ext4 \
              --karg console=ttyS0,115200 --wipe --via-loopback /output/disk.raw
          echo "INSTALL_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"
          sudo chown "$(id -u):$(id -g)" "$WORK/disk.raw"
          qemu-img convert -O qcow2 "$WORK/disk.raw" "$WORK/disk.qcow2"
          rm "$WORK/disk.raw"

      - name: Boot the installed disk with KVM
        run: |
          {
            echo "## nyra-base: install and boot"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`localhost/nyra-base:ci\` \`$IMAGE_DIGEST\` |"
            echo "| Install | \`bootc install to-disk --composefs-backend --bootloader systemd\`, ext4, loopback, ${INSTALL_SECONDS} s |"
            echo "| VM | QEMU $(qemu-system-x86_64 --version | head -1 | awk '{print $4}'), KVM, UEFI (OVMF), 2 vCPU, 2 GiB |"
            echo "| Test-only access | kernel argument \`console=ttyS0,115200\` on the test disk; root autologin on ttyS0 via a systemd credential |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/vm/vm-boot.py --autologin \
            --disk "$WORK/disk.qcow2" --timeout 240 \
            --command 'test "$(systemd-detect-virt)" = kvm && echo "virtualization: kvm"' \
            --command 's="$(systemctl is-system-running --wait)"; echo "system: $s"; systemctl --no-pager --failed; systemd-analyze; test "$s" = running' \
            --command 'bootc status && d="$(bootc status --booted --format json | grep -o "\"imageDigest\":\"[^\"]*\"" | cut -d\" -f4)" && echo "booted imageDigest: $d" && test "$d" = '"$IMAGE_DIGEST" \
            --command 'findmnt -T /usr; findmnt -T /usr -no OPTIONS | tr , "\n" | grep -qx ro && touch /usr/.nyra-rw-test 2>&1 | grep "Read-only file system"' \
            --command 'cat /proc/cmdline' \
            --log "$RUNNER_TEMP/serial.log" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --title "Installed nyra-base boot with KVM"

      - name: Secure defaults (docs/DEFAULTS.md)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: tools/vm/security-defaults.sh "$WORK/disk.qcow2" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Secure Boot chain (docs/BOOT.md)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: tools/vm/secure-boot.sh localhost/nyra-base:ci "$WORK/disk.qcow2" "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Boot counting across updates (docs/BOOT.md)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          tools/vm/boot-counting.sh localhost/nyra-base:ci "$IMAGE_DIGEST" "$WORK/disk.qcow2" \
            "$WORK" "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY"

      - name: Upload the serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-boot-serial-log
          path: ${{ runner.temp }}/serial*.log
          if-no-files-found: ignore
          retention-days: 14

  # Keyless signing (docs/SIGNING.md): GitHub OIDC -> Google Workload Identity Federation ->
  # an ID token of the signer service account -> a short-lived Fulcio certificate for its
  # e-mail address -> signature recorded in Rekor. No key exists anywhere. Only release builds
  # on GitHub-hosted runners are signed; the job is skipped until the repository variables
  # GCP_WIF_PROVIDER and GCP_SIGNER_SA are set. Only this job can request an OIDC token.
  sign:
    needs: [build, install-boot]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SIGNER_SA != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
      REPO: updates.nyraos.com/nyra-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the shipped policy trusts this signer
        env:
          SIGNER: ${{ vars.GCP_SIGNER_SA }}
        run: |
          policy=files/usr/lib/nyra/containers/policy.json
          trusted="$(jq -r '.transports.docker["updates.nyraos.com"][0].fulcio.subjectEmail' "$policy")"
          if [ "$trusted" != "$SIGNER" ]; then
            echo "::error::$policy trusts $trusted, but CI would sign as $SIGNER. Commit the signer address to the policy first (docs/SIGNING.md)."
            exit 1
          fi
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nyra-base-oci-archive
          path: ${{ env.WORK }}

      - name: Load the image and push it to the local registry (as updates.nyraos.com)
        run: |
          tools/signing/local-registry.sh "$WORK"
          sudo podman load -q -i "$WORK/nyra-base.oci.tar"
          sudo podman run --rm --network host --tmpfs /var/tmp -v "$WORK:/w" localhost/nyra-base:ci \
            skopeo copy --dest-tls-verify=false --preserve-digests --digestfile /w/digest \
              oci-archive:/w/nyra-base.oci.tar "docker://$REPO:ci"
          digest="$(cat "$WORK/digest")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          rm "$WORK/nyra-base.oci.tar"

      - name: Install cosign
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/cosign" /usr/local/bin/cosign
          cosign version

      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SIGNER_SA }}
          token_format: id_token
          id_token_audience: sigstore
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      # The old signature format (a sha256-<digest>.sig tag with the Rekor v1 SET) is the only one
      # containers/image (bootc, podman, skopeo) verifies; cosign 3 defaults to the new bundle.
      - name: Sign the image
        env:
          ID_TOKEN: ${{ steps.google.outputs.id_token }}
        run: |
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            --fulcio-url https://fulcio.sigstore.dev --rekor-url https://rekor.sigstore.dev \
            --identity-token "$ID_TOKEN" --allow-http-registry "$REPO@$IMAGE_DIGEST"

      - name: Verify with the shipped policy
        run: tools/signing/test-policy.sh localhost/nyra-base:ci "$WORK" "$IMAGE_DIGEST"

      # For publishing (NyraOS#25): the signature as an OCI layout, tagged as on the registry.
      # The image itself is the nyra-base-oci-archive artifact (same manifest digest).
      - name: Export the signature
        env:
          SIGNER: ${{ vars.GCP_SIGNER_SA }}
        run: |
          sig="${IMAGE_DIGEST/:/-}.sig"
          mkdir -p dist
          sudo podman run --rm --network host --tmpfs /var/tmp -v "$PWD/dist:/w" localhost/nyra-base:ci \
            skopeo copy --insecure-policy --preserve-digests "docker://$REPO:$sig" "oci:/w/signature:$sig"
          sudo chown -R "$(id -u):$(id -g)" dist
          echo "$IMAGE_DIGEST" > dist/image-digest
          {
            echo "## Signed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$REPO@$IMAGE_DIGEST\` |"
            echo "| Signer | \`$SIGNER\` (keyless, Fulcio + Rekor) |"
            echo "| Signature | \`$REPO:$sig\` (artifact nyra-base-signature) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyra-base-signature
          path: dist
          retention-days: 14
