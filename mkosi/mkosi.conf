# SPDX-License-Identifier: GPL-3.0-or-later
# nyra-base, desktop flavour: Debian unstable, x86_64, built by mkosi directly
# from a pinned snapshot.debian.org date. Output: an OCI image (one layer); the
# bootc finishing layer goes on top with ../Containerfile.

[Distribution]
Distribution=debian
Release=unstable
Architecture=x86-64
# The only place where the snapshot date is set. CI reads it from here.
Snapshot=20261026T022331Z
Repositories=main,contrib,non-free-firmware

[Output]
Format=oci
Output=nyra-base-rootfs
# mkosi removes the dpkg database from the image, so the package list (SBOM) is exported here.
ManifestFormat=json

[Content]
Bootable=no
WithDocs=no
# Build records that differ between two builds of the same inputs (docs/LESSONS.md): logs with the
# wall-clock time of the build (alternatives.log) and ldconfig's aux-cache (inode numbers and change
# times of the libraries). The image needs neither; bootc's layout drops /var anyway.
# keyutils is there for keyctl alone, in the initramfs (docs/BOOT.md, "Disk encryption"): not its
# request-key upcall, which would let the kernel run programs as root on behalf of any user
# (request-key, key.dns_resolver, request-key.conf with active debug handlers).
# SSH host keys (/etc/ssh/ssh_host_*): openssh-server's package script makes them; a public image must
# not carry them, not even in a layer that a later one hides (docs/DEFAULTS.md, "SSH").
RemoveFiles=
        /var/log/*.log
        /var/cache/ldconfig/aux-cache
        /usr/sbin/request-key
        /usr/sbin/key.dns_resolver
        /etc/request-key.conf
        /etc/request-key.d
        /usr/share/keyutils
        /etc/ssh/ssh_host_*
# mkosi installs only what is listed: keep this list explicit.
# openssh-server: the SSH server, off unless a layer turns it on (Containerfile, docs/DEFAULTS.md
# "SSH"). Its package scripts make host keys, which RemoveFiles= above removes: a public image must
# not carry them; each machine makes its own. openssh-client: the ssh command (the server does not
# pull it in).
# Secure Boot chain (docs/BOOT.md): shim-signed (signed by Microsoft; pulls in mokutil) and
# systemd-boot-efi-amd64-signed (signed by Debian; bootctl install prefers the .signed binary).
# Secure defaults (docs/DEFAULTS.md): apparmor (profiles loaded at boot), nftables (inbound firewall).
# systemd-ukify: bootc container ukify builds the sealed UKI with the image's own tools (docs/BOOT.md).
# systemd-tpm (pulls in tpm-udev): systemd-measure (the UKI's PCR 11 policy, docs/BOOT.md "TPM2
# unlock") and systemd-pcrphase, which measures the boot phases into PCR 11 that the signed policy
# expects. The other units they enable are blocked in the Containerfile (docs/DEFAULTS.md).
# curl: nyra-updated fetches the channel sheet with it (docs/UPDATES.md).
# wget: the download command many scripts and guides expect; nothing in the image uses it.
# keyutils: keyctl, which removes the key typed at the disk's prompt from the kernel's cache in the
# initrd (the rest of the package is removed above).
# sudo-rs: only its su stays, in place of util-linux's (Containerfile, docs/DEFAULTS.md "su").
# rust-coreutils: uutils coreutils in place of GNU's, which stays installed for the commands uutils
# lacks (Containerfile, docs/DEFAULTS.md "Core utilities").
# udisks2 and polkitd: removable media, mounted when a user asks, with Nyra's mount options
# (docs/DEFAULTS.md, "Removable media"); udisks2 asks polkitd whether a caller may mount, even root.
# libpam-systemd (polkitd needs logind's PAM module): every login gets a logind session, so polkit
# can tell an active local session; with it come the user's manager and /run/user/UID.
Packages=
        systemd
        systemd-sysv
        passwd
        login
        util-linux
        iproute2
        less
        procps
        systemd-resolved
        systemd-boot
        systemd-boot-efi
        shim-signed
        systemd-boot-efi-amd64-signed
        udev
        dbus
        linux-image-amd64
        dracut
        btrfs-progs
        bubblewrap
        dosfstools
        e2fsprogs
        fdisk
        xfsprogs
        libnss-resolve
        libnss-myhostname
        podman
        skopeo
        libostree-1-1
        ostree
        zstd
        efibootmgr
        ca-certificates
        curl
        wget
        cryptsetup
        systemd-cryptsetup
        keyutils
        tpm2-tools
        distrobox
        flatpak
        apparmor
        nftables
        systemd-ukify
        systemd-tpm
        sudo-rs
        rust-coreutils
        udisks2
        polkitd
        libpam-systemd
        openssh-server
        openssh-client

[Build]
ToolsTree=no
