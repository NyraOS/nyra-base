# SPDX-License-Identifier: GPL-3.0-or-later
# nyra-base, desktop flavour: Debian unstable, x86_64, built by mkosi directly
# from a pinned snapshot.debian.org date. Output: an OCI image (one layer); the
# bootc finishing layer goes on top with ../Containerfile.

[Distribution]
Distribution=debian
Release=unstable
Architecture=x86-64
# The only place where the snapshot date is set. CI reads it from here.
Snapshot=20261006T060000Z
Repositories=main,contrib,non-free-firmware

[Output]
Format=oci
Output=nyra-base-rootfs
# mkosi removes the dpkg database from the image, so the package list (SBOM) is exported here.
ManifestFormat=json

[Content]
Bootable=no
WithDocs=no
# Build records that differ between two builds of the same inputs (docs/LESSONS.md): logs with the
# wall-clock time of the build (alternatives.log) and ldconfig's aux-cache (inode numbers and change
# times of the libraries). The image needs neither; bootc's layout drops /var anyway.
RemoveFiles=
        /var/log/*.log
        /var/cache/ldconfig/aux-cache
# mkosi installs only what is listed: keep this list explicit.
# No openssh-server: its package scripts would bake SSH host keys into a public image.
# Secure Boot chain (docs/BOOT.md): shim-signed (signed by Microsoft; pulls in mokutil) and
# systemd-boot-efi-amd64-signed (signed by Debian; bootctl install prefers the .signed binary).
# Secure defaults (docs/DEFAULTS.md): apparmor (profiles loaded at boot), nftables (inbound firewall).
# systemd-ukify: bootc container ukify builds the sealed UKI with the image's own tools (docs/BOOT.md).
# curl: nyra-updated fetches the channel sheet with it (docs/UPDATES.md).
# util-linux-extra: exch, which swaps two directories in one step (the settings reset, docs/BOOT.md).
Packages=
        systemd
        systemd-sysv
        passwd
        login
        util-linux
        util-linux-extra
        iproute2
        less
        procps
        systemd-resolved
        systemd-boot
        systemd-boot-efi
        shim-signed
        systemd-boot-efi-amd64-signed
        udev
        dbus
        linux-image-amd64
        dracut
        btrfs-progs
        bubblewrap
        dosfstools
        e2fsprogs
        fdisk
        xfsprogs
        libnss-resolve
        libnss-myhostname
        podman
        skopeo
        libostree-1-1
        ostree
        zstd
        efibootmgr
        ca-certificates
        curl
        cryptsetup
        systemd-cryptsetup
        tpm2-tools
        distrobox
        flatpak
        apparmor
        nftables
        systemd-ukify

[Build]
ToolsTree=no
