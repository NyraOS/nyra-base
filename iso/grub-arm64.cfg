# The only menu of the aarch64 installer ISO: iso/grub.cfg for arm64 (docs/ISO.md, "aarch64"). GRUB reads
# this file from the ISO (it is not covered by Secure Boot), and starts Debian's signed kernel with the
# installer system as its RAM disk.
# Unlike iso/grub.cfg, no `serial` and no `terminal_*` lines: GRUB's `serial --unit=0` names the x86 port
# com0, and on aarch64 its serial driver is the firmware's (ports efi0, efi1, ... as its source has it), while
# the firmware's console (ConOut) already reaches the screen and the serial port of the virtual machines. The kernel is given
# the screen and the PL011 serial port of QEMU's virt machine, UTM and most boards, ttyAMA0; a machine
# with another serial port (an 8250 one is ttyS0) shows the installer on the screen only.
set default=0
set timeout=3
# The medium of this build, by its volume label (NYRA-ISO- and the build's identifier, put in when the
# ISO is made): not the first medium that has a /boot/vmlinuz.
search --no-floppy --label --set=root NYRA-ISO-@BUILD_ID@

menuentry "Install Nyra OS" {
    linux /boot/vmlinuz quiet loglevel=3 console=tty0 console=ttyAMA0,115200n8
    initrd /boot/initrd.img
}
