# SPDX-License-Identifier: GPL-3.0-or-later
# The boot files of the installer ISO, in a tree of their own (docs/ISO.md): shim, signed by Microsoft, and
# GRUB, signed by Debian, from the same pinned snapshot as the installer system. ci/build-iso.sh copies three
# .efi files from this tree to the ISO's EFI image; nothing else of it, and none of its dependencies
# (grub2-common, freetype and the rest), reaches the installer system, which would only carry them in
# memory. The snapshot date is given by CI, as for ../mkosi.conf.

[Distribution]
Distribution=debian
Release=unstable
Architecture=x86-64
Repositories=main

[Output]
Format=directory
Output=nyra-installer-boot
ManifestFormat=json

[Content]
Bootable=no
WithDocs=no
Packages=
        shim-signed
        grub-efi-amd64-signed

[Build]
ToolsTree=no
