# The only menu of the installer ISO. GRUB reads this file from the ISO (it is not covered by Secure
# Boot, docs/ISO.md), and starts Debian's signed kernel with the installer system as its RAM disk. The
# screen and the serial port 0 both get the menu and the installer.
set default=0
set timeout=3
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
search --no-floppy --file --set=root /boot/vmlinuz

menuentry "Install Nyra OS" {
    linux /boot/vmlinuz quiet loglevel=3 console=tty0 console=ttyS0,115200n8
    initrd /boot/initrd.img
}
