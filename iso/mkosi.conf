# SPDX-License-Identifier: GPL-3.0-or-later
# The operating system of the installer ISO (docs/ISO.md): Debian unstable, x86_64, from the same
# pinned snapshot as the image, built by mkosi into a directory that ci/build-iso.sh turns into the
# initial RAM disk the whole system runs from. The snapshot date is not set here: CI gives it from
# ../mkosi/mkosi.conf, the only place it is set (mkosi --snapshot).

[Distribution]
Distribution=debian
Release=unstable
Architecture=x86-64
# Debian's kernel and boot chain are all in main: the installer needs no firmware blobs.
Repositories=main

[Output]
Format=directory
Output=nyra-installer-os
ManifestFormat=json

[Content]
Bootable=no
WithDocs=no
# The units, the mounts and the settings of the installer system (iso/files).
ExtraTrees=files:/
# Where the system is told its own name, and nothing else a build can leave behind.
Hostname=nyra-installer
# mkosi installs only what is listed: keep this list explicit, and every package in the SBOM.
# systemd, systemd-sysv, udev, kmod: the system, and the modules that the hardware needs (the root
# is the RAM disk, the disk drivers load when udev finds the hardware).
# linux-image-amd64: Debian's kernel, signed by Debian (the boot chain is Debian's, docs/ISO.md);
# shim-signed and grub-efi-amd64-signed: the files that ci/build-iso.sh copies to the ISO, then
# removes from the RAM disk.
# podman, skopeo, docker-registry: the verified pull from the image on the ISO, served on 127.0.0.1
# only (no network in the session).
# mokutil, openssl, jq, fdisk, util-linux: what tools/install/nyra-install.sh runs on the host. The
# disk tools (cryptsetup, mkfs, bootc) are the image's.
# less, procps: for the shell the installer offers, nothing else.
Packages=
        systemd
        systemd-sysv
        udev
        kmod
        linux-image-amd64
        shim-signed
        grub-efi-amd64-signed
        bash
        util-linux
        fdisk
        less
        procps
        jq
        openssl
        mokutil
        podman
        skopeo
        docker-registry

[Build]
ToolsTree=no
