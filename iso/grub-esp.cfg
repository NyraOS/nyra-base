# SPDX-License-Identifier: GPL-3.0-or-later
# On the EFI partition of a USB stick written with the ISO. GRUB (the CD build) starts here when the
# firmware boots the stick's EFI partition, not the ISO file system: it finds the ISO file system of this
# build by its volume label, which holds the kernel, and reads the menu there. Like grub.cfg it is not
# covered by Secure Boot (docs/ISO.md). A CD boots from the ISO file system directly and never
# reads this file.
search --no-floppy --label --set=root NYRA-ISO-@BUILD_ID@
configfile /boot/grub/grub.cfg
