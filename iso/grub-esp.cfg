# On the EFI partition of a USB stick written with the ISO. GRUB (the CD build) starts here when the
# firmware boots the stick's EFI partition, not the ISO file system: it finds the ISO file system, which
# holds the kernel, and reads the menu there. A CD boots from the ISO file system directly and never
# reads this file.
search --no-floppy --file --set=root /boot/vmlinuz
configfile /boot/grub/grub.cfg
